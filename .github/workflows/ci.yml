name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 LTS is the development runtime; the packages support 18.17+.
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Leak guard
        run: pnpm check:leaks

      - name: Type-check
        run: pnpm typecheck

      # The step that prevents a hand-edited generated file, which is how a type quietly
      # stops matching the service. Regenerating must leave the tree clean.
      - name: Generated types match the pinned contracts
        run: |
          pnpm generate:types
          git diff --exit-code

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Published package shape
        run: pnpm -r check:package

      - name: Tarball audit
        run: pnpm audit:tarballs

      # Handed to the runtime-baseline job below, so it does not rebuild.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  # The packages support Node 18.17+, but Vitest 4 requires ^20.19 || >=22.12 and cannot run
  # there. This job runs the node:test baseline against the built artifact on every supported
  # runtime, which is what proves the tarball works where its `engines` field says it does.
  runtime-baseline:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.17", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Node ${{ matrix.node-version }} baseline
        run: node --test packages/*/test/node-baseline.mjs
