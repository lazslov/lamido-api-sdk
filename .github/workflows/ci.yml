name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The toolchain's floor, not the packages'. pnpm 11 refuses to run below Node 22.13,
          # and `cache: pnpm` shells out to pnpm — so a lower version here fails this step
          # before a single script runs. What the *packages* support is 20.19+, and that is
          # proven by the runtime-baseline matrix below rather than by this job.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Leak guard
        run: pnpm check:leaks

      - name: Type-check
        run: pnpm typecheck

      # The step that prevents a hand-edited generated file, which is how a type quietly
      # stops matching the service. Regenerating must leave the tree clean.
      - name: Generated types match the pinned contracts
        run: |
          pnpm generate:types
          git diff --exit-code

      # Same guard for the documented examples, and it only runs where the knowledge base is
      # checked out — it is not a submodule, so its absence is normal rather than a failure.
      # Without this the fixtures would quietly describe last month's API.
      - name: Documented examples match the knowledge base
        run: |
          if [ -d ../knowledge-base ]; then
            pnpm examples:import
            git diff --exit-code
          else
            echo "no knowledge-base checkout beside the repository; skipping"
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Published package shape
        run: pnpm -r check:package

      - name: Tarball audit
        run: pnpm audit:tarballs

      # The zero-dependency claim, asserted against the resolved graph rather than against each
      # manifest. `pnpm why` walks what was actually installed, so a transitive runtime dependency
      # arriving through api-core would fail here and nowhere else.
      - name: Zero runtime dependencies
        run: pnpm deps:audit

      # A real consumer, resolving the packages the way a consumer does: plain Node, CJS require, no
      # framework, and an empty environment. Fast enough to belong in this job.
      - name: Consumer smoke — plain Node
        run: pnpm --filter @lazslov-examples/node-script smoke

      # Handed to the runtime-baseline job below, so it does not rebuild.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  # The packages support Node 20.19+, and this job is what proves the tarball works where its
  # `engines` field says it does: the node:test baseline, against the built artifact, on the floor
  # and on the current LTS. It stays a separate job rather than folding into Vitest because pnpm 11
  # cannot start below Node 22.13 — the 20.19 leg therefore runs with no install at all, and
  # `node:test` is the only runner available under that constraint.
  runtime-baseline:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      # Three of the four built entry points import `@lazslov/api-core` as a bare specifier, so Node
      # needs somewhere to resolve it — and this job deliberately runs no `pnpm install`, because
      # pnpm 11 refuses to start below Node 22.13 and this matrix goes down to 20.19. Hand-linking
      # the workspace is enough precisely because no published package has a runtime dependency,
      # which `deps:audit` in `verify` asserts against the resolved graph before this job runs.
      - name: Link the workspace packages
        run: |
          mkdir -p node_modules/@lazslov
          for pkg in api-core content invoice payment; do
            ln -sfn "../../packages/$pkg" "node_modules/@lazslov/$pkg"
          done

      - name: Node ${{ matrix.node-version }} baseline
        run: node --test packages/*/test/node-baseline.mjs

  # Kept out of `verify` so a local `pnpm verify` stays seconds rather than paying a Next build. This
  # is the fixture half of phase 6's peer-dependency criterion: `next` resolves, the `./next` subpath
  # resolves, and the mode-A route still prerenders.
  examples:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples consume `dist/`, not source.
      - run: pnpm build

      # No CONTENT_SERVICE_* variables are set in this job, deliberately. Building with an empty
      # environment is a first-class requirement, not a nicety: it is how a new contributor runs a
      # client project, and a build that needs a credential cannot be one.
      - name: next-site builds with an empty environment
        run: pnpm --filter @lazslov-examples/next-site build

      # Read out of the build's own prerender manifest. If `/` ever stops being prerendered, something
      # opted the route out — the exact regression the three cache modes exist to prevent, and one that
      # produces no error and no failing test anywhere else.
      - name: The mode-A route is still static
        run: pnpm --filter @lazslov-examples/next-site verify:static
