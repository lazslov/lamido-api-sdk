      description: >
        Scope: content:publish. Fires the revalidation webhook. Un-archives an archived item.


        Identical semantics to the client twin, publishItem: an omitted locale publishes every
        locale of the site, the required-value check runs per locale, and locale is a body field
        rather than a query parameter.
      security: [{ adminKey: [] }]
