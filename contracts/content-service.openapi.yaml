openapi: 3.1.0

# ---------------------------------------------------------------------------
# This spec is the authority on SHAPES. The Markdown in this folder is the
# authority on BEHAVIOUR. Where they disagree, the Markdown wins and this file
# is the bug — fix it here.
#
# Every path below is registered in src/app.ts of the service repo:
#   /                     1 operation   (a static landing page, not an API endpoint)
#   /healthz              1 operation   (the only unauthenticated API endpoint)
#   /v1/public/*          6 operations  → website-api.md
#   /v1/*                30 operations  → client-api.md
#   /v1/admin/*          83 operations  → admin-api.md
#                        ---
#                        121 operations across 88 paths
#
# A single resource is returned AS ITSELF — there is no {data} wrapper. Only a
# list carries one, and it is always {data, next_cursor} (+ total where cheap).
# Every failure is application/problem+json per RFC 9457; see the Problem schema.
# ---------------------------------------------------------------------------

info:
  title: content-service
  version: 0.1.0
  summary: Multi-tenant content API — pages, collections, assets and application data.
  description: |
    Lamido's client websites store their content here instead of hardcoding it, and store
    their application data here instead of owning a database. Texts live in Neon Postgres;
    images live on the Vercel Blob CDN with their URL recorded in Postgres.

    **Three surfaces, three credentials:**

    | Surface | Prefix | Auth | Reads drafts |
    |---|---|---|---|
    | Website read | `/v1/public/*` | `Bearer cpk_…` (a `csk_…` also works) | no |
    | Client admin | `/v1/*` | `Bearer csk_…` | yes |
    | Lamido admin | `/v1/admin/*` | `Bearer cad_…` plus per-route scopes | yes |

    A `cpk_` publishable key is **public by design** — it scopes and revokes, it does not keep
    content secret. A `csk_` or `cad_` key must never reach a browser.

    **Envelope:** a single resource is returned **as itself** — there is no `{data}` wrapper to
    reach through. Only a list carries one, and it is always `{data, next_cursor}`, plus `total`
    where it is cheap to compute and endpoint-specific siblings (`limit`, `offset`, `older_than`)
    documented per endpoint. `next_cursor` is `null`, never absent, even on a list that never
    pages.

    **Failure is `application/problem+json` per RFC 9457** — see the `Problem` schema. There is
    no `{error: …}` wrapper anywhere. Branch on `type` (and `code` where present), never on
    `detail` or `title`.

    **Tenant scoping is per-query.** A resource belonging to another site is a `404`, never a
    `403`, so cross-tenant existence never leaks.

    **`richtext` is a markdown subset, never HTML.** Nothing here sanitises tags.

    This service has no users, no roles, no sessions, no cron, no queue, no general request
    quota and no CORS on the two write tiers. It does have FOUR narrow throttles — failed
    authentications per IP, dataset aggregates per site, manual revalidations per site, webhook
    probes per site. THREE OF THE FOUR FAIL OPEN, so a `429` from those is never guaranteed to
    arrive; the failed-auth counter degrades to a bounded per-instance counter instead and does
    not fail open (a9c8a7c). See `conventions.md` for the full list of non-features.
  license:
    name: UNLICENSED
  x-docs:
    conventions: conventions.md
    website: website-api.md
    client: client-api.md
    admin: admin-api.md
    dataModel: data-model.md
    operations: operations.md
    workflows: workflows.md

servers:
  # The deployment host is deliberately absent from this pinned copy. No host ships in
  # a tarball, and contracts/ is one `files` mistake away from being published — see
  # docs/plans/phase-1-foundations.md §4. The consuming project supplies the base URL
  # from its own environment; the SDK has no fallback.
  - url: "{baseUrl}"
    description: Supplied by the consuming project from its own environment.
    variables:
      baseUrl:
        default: https://content.example.com
        description: Documentation placeholder, not a usable default.

tags:
  - name: health
    description: Liveness. The only unauthenticated endpoint.
  - name: website
    description: >
      Public read tier. Published content only, CDN-cacheable, CORS-gated per site.
      `?view=` is a 403 here for every key kind.
  - name: client
    description: >
      Editor write tier. One site, scoped by the key itself — no path carries a site id.
  - name: client-datasets
    description: Application data. The only tier that creates records.
  - name: admin-keys
    description: Admin credential management.
  - name: admin-sites
    description: Sites and their per-site keys.
  - name: admin-structure
    description: Pages, sections, fields and collections — the shape editors fill in.
  - name: admin-content
    description: >
      The cross-site twins of every client-tier content write. Same functions, same
      behaviour; only the audit actor differs.
  - name: admin-assets
    description: The image library across every site.
  - name: admin-datasets
    description: Dataset definitions and record support access.
  - name: admin-transfer
    description: Whole-site export and import.
  - name: admin-ops
    description: Health, audit and stats.
  - name: admin-webhooks
    description: >
      The event layer: the catalogue, endpoints and their once-only signing secrets, the outbox
      and the delivery queue. THIS SURFACE IS IDENTICAL IN EVERY LAMIDO SERVICE, varying only in
      the tenant collection segment — one admin client and one screen drive all five.

security:
  - siteKey: []

components:
  securitySchemes:
    siteKey:
      type: http
      scheme: bearer
      description: >
        A `cpk_` publishable key (browser-safe, published content only) or a `csk_` secret key
        (server-side, one site, may read drafts and write). 36 characters, opaque.
    secretKey:
      type: http
      scheme: bearer
      description: >
        A `csk_` secret key. Scoped to exactly one site by the key itself. Never ship it to a
        browser — it can publish every word on the site and read every unpublished draft.
    adminKey:
      type: http
      scheme: bearer
      description: >
        A `cad_` admin key. Reaches EVERY site; limited only by its scopes and its optional
        CIDR allowlist. Server-to-server only — this tier sends no CORS headers.

  parameters:
    localeQuery:
      name: locale
      in: query
      required: false
      schema: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
      description: >
        Omitted means the site's `default_locale`. A locale the site does not publish is a 400
        whose `details.locales` lists the ones it does. There is no fallback chain.
    limitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Out of range is a 400, never a clamp.
    offsetQuery:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    aggregateLimitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      description: 1–1000 here, because a group is a much smaller row than a page document.
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
      description: >
        Echo back the `ETag` you received — never rebuild it, because Vercel's edge weakens it
        to `W/"…"`. Comparison is weak, so quoted, unquoted, `W/`-prefixed, comma-separated and
        `*` all work. A match answers 304 with no body.
    pageSlug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    collectionKey:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    datasetKey:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    itemId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    recordId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    assetId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    versionNumber:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 1000000 }
      description: A non-integer is a 400, so `abc` never reads as "no such version".
    resourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    siteIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The site. On the admin tier the site is in the path; on the client tier it is the key.
    endpointPublicIdPath:
      name: publicId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: >
        A webhook endpoint's `public_id`, NEVER its row id. An object an operator points at from a
        UI that spans five services keeps its internal key internal (HR-9).
    keyIdPath:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    itemIdPath:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Named `itemId` rather than `id` because `:id` is already the site.
    recordIdPath:
      name: recordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    viewQuery:
      name: view
      in: query
      required: false
      schema: { type: string, enum: [draft, published], default: published }
      description: >
        `draft` falls back to the published value for any untouched field, and answers
        `no-store`. Only on the write tiers — on `/v1/public/*` any `?view=` other than
        `published` is a 403.
    itemViewQuery:
      name: view
      in: query
      required: false
      schema: { type: string, enum: [draft, published], default: draft }
      description: Defaults to `draft` here, unlike the public tier which serves published only.
    itemStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ItemStatus' }
      description: Omitted returns every status.
    forceQuery:
      name: force
      in: query
      required: false
      schema: { type: string, enum: ['true', 'false'], default: 'false' }
      description: >
        Skips the reference check. Leaves dangling references, which surface in `dangling_refs`
        on `GET /v1/admin/health` and are audited as `forced`.
    confirmQuery:
      name: confirm
      in: query
      required: false
      schema: { type: string, enum: ['true', 'false'], default: 'false' }
      description: >
        Required once the delete would destroy editor-entered values, which a version restore
        cannot bring back — a restore writes into the draft of a field that still has to exist.
    includeSensitiveQuery:
      name: include
      in: query
      required: false
      schema: { type: string, enum: [sensitive] }
      description: >
        The only way a `sensitive` value reaches a response, and the read IS audited
        (`record.read_sensitive`).
    eqQuery:
      name: eq
      in: query
      required: false
      explode: true
      schema:
        type: array
        maxItems: 3
        items: { type: string }
      description: >
        `field:value` equality, repeatable, max 3. The field must be declared `groupable`, and on
        the PUBLIC tier `publicly_enumerable` as well — an eq on a field that did not opt in is a
        400 there, because `eq=donorName:Anna` with a count answers "did Anna donate".
        The value is coerced to the field's declared type, so `manual:false` matches the
        boolean `false` rather than the string.
    fromQuery:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: >
        INCLUSIVE lower bound. `from` not strictly before `until` — including equal — is a 400,
        because an empty window is a caller bug rather than a request for nothing.
    untilQuery:
      name: until
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: >
        EXCLUSIVE upper bound, so `from=D&until=D+1` covers a day exactly once. Named `until`
        rather than `to` deliberately: `to` reads inclusive to nearly everyone.
    cursorQuery:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 500 }
      description: >
        OPAQUE. Pass back a `next_cursor` verbatim; never construct, parse or store one, because
        the encoding is free to change. A malformed cursor is a 400 — never a quiet restart from
        page 1, which would be a pager that loops forever while looking like progress.
    keysetLimitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: 1–200, default 50, on the keyset-paginated lists. Out of range is a 400, never a clamp.
    idempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1 }
      description: >
        Optional. Makes a retry a REPLAY rather than a second operation: the original result comes
        back as 200 with an `Idempotent-Replay: true` response header. The same key with a
        different body is a 409 carrying `code: idempotency_key_reused`. The body hash is over
        canonical JSON (object keys sorted, array order preserved), and the key is scoped to the
        resource it acts on. Free-form and trimmed.

  responses:
    NotModified:
      description: The caller's validator still matches. No body.
    BadRequest:
      description: >
        Problem type `validation`. Every problem in the request is reported at once — read
        `errors` and `details`. DO NOT RETRY.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unknownValueKey:
              summary: An unknown content value key is a 400, not a silent strip
              value:
                type: 'urn:content-service:problem:validation'
                title: Bad Request
                status: 400
                detail: One or more content values could not be stored
                instance: '/v1/pages/home/values'
                request_id: 019fc236-0c4e-7e3f-8203-70fcad1d20e2
                details:
                  unknown_keys: [hero.titel]
                  invalid:
                    - key: celok.stats
                      message: 'Entry 0, "icon": Expected a string for a "text" field'
            unknownLocale:
              summary: A locale the site does not publish
              value:
                type: 'urn:content-service:problem:validation'
                title: Bad Request
                status: 400
                detail: '"en" is not one of this site''s locales'
                instance: '/v1/pages/home/values'
                details: { locale: en, locales: [hu] }
            moneyAsNumber:
              summary: A JSON number in a `money` field is rejected, never converted
              value:
                type: 'urn:content-service:problem:validation'
                title: Bad Request
                status: 400
                detail: One or more record values could not be stored
                instance: '/v1/datasets/donations/records'
                details:
                  unknown_keys: []
                  missing: []
                  invalid:
                    - key: amount
                      message: >-
                        Expected a decimal string of minor units, not a number — "2500" for
                        25.00 EUR, "2500" for 2500 Ft (HUF has no minor units)
    Unauthorized:
      description: >
        Problem type `unauthorized`. Missing, malformed, unknown or revoked key — or a
        deactivated site. All of these share one message on purpose: a distinguishable answer
        would make the API a key-validity oracle. DO NOT RETRY; check the credential.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >
        Problem type `forbidden`. The credential is valid and is being used in the wrong place: a
        `cpk_` key on a write tier, `?view=` on the read tier, a missing admin scope, an admin key
        from a disallowed address, an asset pathname outside the site's prefix — or the BROWSER
        TRIPWIRE, which rejects any request to `/v1/*` or `/v1/admin/*` carrying `Origin` or
        `Sec-Fetch-Dest` BEFORE authentication runs. Never applied to `/v1/public/*`. A plain
        Node `fetch` is unaffected; until 2026-08-09 the check read `Sec-Fetch-Mode: cors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: >
        Problem type `not-found`. Also the answer for a resource that belongs to ANOTHER site, and
        — on the public tier — for content that is unpublished, inactive, draft or archived. A 403
        would confirm the resource exists, so cross-tenant existence must read as absence.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: >
        Problem type `rate-limit`, carrying `Retry-After`. All four throttles in this service
        FAIL OPEN — a counter outage allows the request — so never rely on the service to stop a
        runaway loop of yours.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: >
        Problem type `conflict`. See `details` for the cause, and `code` where a branchable
        sub-case exists. A lost publish race IS retryable after reloading; nothing else here is.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            requiredEmpty:
              summary: A required field would publish empty
              value:
                type: 'urn:content-service:problem:conflict'
                title: Conflict
                status: 409
                detail: Required fields are empty — fill them in before publishing
                instance: '/v1/pages/home/publish'
                details: { missing: [hero.title], locales: [hu] }
            referencedAsset:
              summary: The asset is still in use, in either view
              value:
                type: 'urn:content-service:problem:conflict'
                title: Conflict
                status: 409
                detail: This asset is still referenced — clear the references before deleting it
                instance: '/v1/assets/0f2c'
                details: { references: [] }
            idempotencyKeyReused:
              summary: The same Idempotency-Key with a different body
              value:
                type: 'urn:content-service:problem:conflict'
                title: Conflict
                status: 409
                detail: >-
                  This Idempotency-Key was already used with a different request body. Use a new
                  key, or resend the original body.
                instance: '/v1/datasets/donations/records'
                code: idempotency_key_reused
    PayloadTooLarge:
      description: >
        Problem type `payload-too-large`. A record's `data` serialises to more than 8 KB;
        `details.bytes` and `details.limit` say by how much.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: >
        Problem type `rate-limit`. One of the four throttles was spent: 20 failed
        authentications per client IP per minute, 60 dataset aggregates per SITE per minute, 10
        manual revalidations per SITE per minute, or 20 webhook probes per SITE per minute.
        Carries `Retry-After` and the mirroring `retry_after` member. Safe to retry after that
        many seconds. The last three FAIL OPEN, so a counter outage allows the request rather
        than rejecting it. The failed-auth counter does NOT: it degrades to a bounded
        per-instance counter, so an outage of its table makes this response likelier.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: >
        Problem type `internal`. A stack trace or driver message never reaches the body — that is
        how connection strings leak. Retry ONCE, with the same `Idempotency-Key` if the call had
        one, then report the `request_id`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Slug:
      type: string
      maxLength: 64
      pattern: '^[a-z0-9_]+$'
      description: >
        Lowercase letters, digits and underscores. No dashes, no uppercase — these strings end
        up as object keys in a published document. Uniqueness is scoped to the parent.
      examples: [home, news, donations]

    Problem:
      type: object
      required: [type, title, status, detail, instance]
      description: >
        RFC 9457 Problem Details. EVERY failure on every surface has this shape and is served as
        `application/problem+json` — there is no `{error: …}` wrapper anywhere.
      properties:
        type:
          type: string
          description: >
            `urn:content-service:problem:<slug>`. THE CONTRACT — branch on this, never on
            `detail` or `title`.
          enum:
            - 'urn:content-service:problem:validation'
            - 'urn:content-service:problem:unauthorized'
            - 'urn:content-service:problem:forbidden'
            - 'urn:content-service:problem:not-found'
            - 'urn:content-service:problem:conflict'
            - 'urn:content-service:problem:payload-too-large'
            - 'urn:content-service:problem:rate-limit'
            - 'urn:content-service:problem:internal'
        title:
          type: string
          description: >
            Summarises the HTTP STATUS, not the type — so a 409 reads "Conflict" whatever caused
            it. Nobody may branch on this.
          examples: [Bad Request, Conflict, Too Many Requests]
        status: { type: integer, examples: [400, 409, 429] }
        detail:
          type: string
          description: For a human. Reworded freely — never parse it.
        instance:
          type: string
          description: >
            The request PATH. Never a full URL and never with a query string, because the preview
            surface carries a signed token there.
          examples: ['/v1/pages/home/values']
        request_id:
          type: string
          description: >
            The response's `X-Request-Id`. QUOTE IT IN A SUPPORT REQUEST — it joins this failure
            to the service's log lines and to any audit row the request wrote.
        errors:
          type: array
          description: >
            400 only. The machine-readable field errors; every problem in the request is reported
            at once, so one round trip is enough to fix all of them.
          items:
            type: object
            required: [pointer, code, detail]
            properties:
              pointer:
                type: string
                description: A JSON Pointer into the body, or `#/query/<name>` for a query parameter.
                examples: ['#/values', '#/query/cursor']
              code: { type: string }
              detail: { type: string }
        code:
          type: string
          description: >
            A machine-branchable sub-case from a closed set, where one exists. Present on some
            409s — notably `idempotency_key_reused`.
          examples: [idempotency_key_reused]
        retry_after:
          type: integer
          description: >
            429 only. Seconds. MIRRORS THE `Retry-After` HEADER, which is set from this member so
            the two cannot disagree.
        details:
          description: >
            This service's diagnostics extension — not a house-rules member. Present where it
            genuinely helps a caller act. Every member is snake_case, at every depth, like any
            other JSON member name here (HR-12). Documented per endpoint; common ones are
            `unknown_keys`, `invalid`, `missing`, `locales`, `references`, `record_count`,
            `groupable`, `summable`, `unresolvable_refs`, `asset_id`, `bytes`, `removed`,
            `retyped`, `group_by`.


            A tenant's OWN key is data and is never renamed. `unknown_keys` carries
            `"hero.titel"` and `invalid[].key` carries `amountForint` exactly as the caller
            sent them. The distinction is authorship: the member holding the list is ours, the
            strings inside it are theirs.

    ItemStatus:
      type: string
      enum: [draft, published, archived]
      description: >
        Only `published` items reach the website. `archived` is the recommended way to remove
        one — it keeps its values and its dataset records, and publishing it again brings it
        back.

    FieldType:
      type: string
      enum: [text, richtext, image, url, number, boolean, list]
      description: Not patchable once the field exists — no value conversion exists.

    ItemSchemaField:
      type: object
      required: [key, type]
      description: One entry of a `list` field's or a collection's item schema. Scalars only.
      properties:
        key: { $ref: '#/components/schemas/Slug' }
        type:
          type: string
          enum: [text, richtext, image, url, number, boolean]
          description: '`list` is absent deliberately: a list inside a list has no modelled value shape.'
        label: { type: string, maxLength: 200 }
        required: { type: boolean, default: false }

    ItemSchema:
      type: array
      minItems: 1
      maxItems: 50
      items: { $ref: '#/components/schemas/ItemSchemaField' }
      description: >
        Required for a `list` field and forbidden for every other type. Keys must be unique.

    ResolvedImage:
      type: object
      required: [url, alt]
      description: >
        An `image` value as a consumer sees it — no second call to make. An image whose asset
        was deleted resolves to `null` instead, never to a dangling id.
      properties:
        url: { type: string, format: uri }
        alt: { type: string, description: 'May be "" — that is the correct signal for a decorative image.' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }

    ImageValue:
      type: object
      required: [asset_id, alt]
      description: An `image` value as it is WRITTEN. Only these two keys are stored; extras are dropped.
      properties:
        asset_id: { type: string, format: uuid, description: Must name an asset of this site. }
        alt:
          type: string
          maxLength: 300
          description: Required. Use "" for a decorative image, so "I forgot" stays distinguishable.

    ContentValue:
      description: >
        What a field holds, by its declared `type`: `text`/`richtext`/`url` a string (5 000 /
        100 000 / 2 000 chars), `number` a finite number, `boolean` a boolean, `image` an
        ImageValue, `list` an array of at most 200 flat objects matching the field's item
        schema. `null` on a write discards the DRAFT for that field; send "" to publish an empty
        value.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - { $ref: '#/components/schemas/ImageValue' }
        - type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: true
        - type: 'null'

    PageDocument:
      type: object
      required: [page, sections]
      description: >
        The ONE shape a page's content is served in — identical on the public read, the draft
        preview and inside a frozen version. A field whose value is null is OMITTED, so a
        consumer's own default applies.
      properties:
        page:
          type: object
          required: [slug, title, locale, version, published_at]
          properties:
            slug: { $ref: '#/components/schemas/Slug' }
            title: { type: string }
            locale: { type: string }
            version:
              type: [integer, 'null']
              description: >
                Null until the first publish — which is reachable only on the CLIENT tier's draft
                preview. On /v1/public/* it is never null, because an unpublished page is a 404
                there. One schema serves both tiers, hence the wider type.
            published_at:
              type: [string, 'null']
              format: date-time
              description: Same nullability rule as `version`.
        sections:
          type: array
          description: Active sections only, in `position` order.
          items:
            type: object
            required: [key, type, fields]
            properties:
              key: { $ref: '#/components/schemas/Slug' }
              type: { type: string, description: The structural name a consuming component switches on. }
              fields:
                type: object
                description: Keyed by field key, not an array. Images arrive resolved.
                additionalProperties: true

    Site:
      type: object
      description: The site as Lamido staff and the site's own backend see it.
      required: [id, slug, name, default_locale, locales, active]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        default_locale: { type: string }
        locales: { type: array, items: { type: string } }
        allowed_origins:
          type: array
          items: { type: string }
          description: Exact `Origin` strings. Empty means no browser access at all.
        external_ref:
          type: [string, 'null']
          description: >
            The site's id in the consuming admin, and the webhook envelope's account_id. A site
            without one cannot participate cross-service. NOTE: revalidate_url and
            has_revalidate_secret were REMOVED from this schema — a destination is a webhook
            endpoint now, because a site may have several.
        active: { type: boolean, description: 'false ⇒ every key on this site answers 401.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicSite:
      type: object
      description: >
        The deliberately smaller shape `GET /v1/public/site` serves — this payload may be
        fetched with a key that ships inside a browser bundle.
      required: [slug, name, default_locale, locales, locale, settings]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        default_locale: { type: string }
        locales: { type: array, items: { type: string } }
        locale: { type: string, description: The locale these `settings` values are in. }
        settings:
          type: object
          description: >
            The published fields of the site's reserved `settings` section — nav labels, links,
            e-mails, bank details, page metadata. `{}` when the site has no such section, never
            a 404.
          additionalProperties: true

    SiteKey:
      type: object
      required: [id, site_id, kind, label, key_last4, active]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        kind: { type: string, enum: [publishable, secret] }
        label: { type: string, maxLength: 100, description: Becomes the audit actor and the `published_by` suffix. }
        key_last4: { type: string, description: Last 4 plaintext characters, so two keys can be told apart. }
        active: { type: boolean }
        last_used_at: { type: [string, 'null'], format: date-time, description: Refreshed at most every 5 minutes. }
        created_at: { type: string, format: date-time }

    MintedSiteKey:
      allOf:
        - { $ref: '#/components/schemas/SiteKey' }
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: >
                THE PLAINTEXT, returned exactly once and never recoverable. Do not log it. A
                lost key can only be rotated.
              examples: [csk_YOUR_SECRET_KEY]

    AdminKey:
      type: object
      required: [id, label, scopes, allowed_ips, active]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, maxLength: 100, description: The audit actor. One key per deployment. }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AdminScope' }
        allowed_ips:
          type: array
          maxItems: 50
          items: { type: string }
          description: CIDR allowlist. EMPTY MEANS UNRESTRICTED — the default, because Vercel egress IPs rotate.
          examples: [['203.0.113.7/32']]
        active: { type: boolean }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    AdminScope:
      type: string
      enum:
        - '*'
        - sites:read
        - sites:write
        - content:read
        - content:write
        - content:publish
        - assets:read
        - assets:write
        - datasets:read
        - datasets:write
        - records:read
        - records:write
        - keys:manage
        - audit:read
        - stats:read
        - admin:manage
      description: >
        `content:write` can stage every change and make none of it live; `content:publish` is
        the scope that reaches a visitor. `datasets:*` is structure, `records:*` may return PII.

    Page:
      type: object
      required: [id, site_id, slug, title, position, active]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        position: { type: integer, minimum: 0, maximum: 9999 }
        active: { type: boolean, description: 'false ⇒ invisible to the website, still editable.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Section:
      type: object
      required: [id, page_id, key, type, position, active]
      properties:
        id: { type: string, format: uuid }
        page_id: { type: string, format: uuid }
        key:
          allOf: [{ $ref: '#/components/schemas/Slug' }]
          description: '`settings` is RESERVED: that section becomes `settings` on `GET /v1/public/site`.'
        type:
          allOf: [{ $ref: '#/components/schemas/Slug' }]
          description: Deliberately not an enum — a new section type must not need a deploy.
        label: { type: [string, 'null'], maxLength: 200 }
        position: { type: integer, minimum: 0, maximum: 9999 }
        active:
          type: boolean
          description: >
            false ⇒ excluded from every document, still writable, and its `required` fields do
            not block a publish.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Field:
      type: object
      required: [id, section_id, key, type, required, position]
      properties:
        id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/Slug' }
        type: { $ref: '#/components/schemas/FieldType' }
        label: { type: [string, 'null'], maxLength: 200 }
        required: { type: boolean, description: Enforced at PUBLISH, not at save. }
        item_schema:
          oneOf:
            - { $ref: '#/components/schemas/ItemSchema' }
            - type: 'null'
          description: "Non-null only for `type: list`."
        position: { type: integer, minimum: 0, maximum: 9999 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PageTree:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [sections]
          description: >
            The structure an editor UI renders a form from. INCLUDES inactive sections, unlike
            the rendered document.
          properties:
            sections:
              type: array
              items:
                allOf:
                  - { $ref: '#/components/schemas/Section' }
                  - type: object
                    required: [fields]
                    properties:
                      fields:
                        type: array
                        items: { $ref: '#/components/schemas/Field' }

    VersionSummary:
      type: object
      required: [version, published_by, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        note: { type: [string, 'null'], maxLength: 500 }
        published_by: { type: string, description: '`"<siteSlug>/<key_label>"`.' }
        created_at: { type: string, format: date-time }

    Version:
      allOf:
        - { $ref: '#/components/schemas/VersionSummary' }
        - type: object
          required: [document]
          properties:
            document:
              allOf: [{ $ref: '#/components/schemas/PageDocument' }]
              description: >
                Plus a `values` map of RAW, unresolved values — the only thing a restore can
                work from, because a resolved image URL cannot be stored in a value column.
                An image here is {asset_id, alt}, the same shape a write takes, so a snapshot
                can be fed back to PATCH …/values unchanged. EVERY OTHER read resolves it to
                {url, alt, width, height}.

    CollectionSummary:
      type: object
      required: [key, name, item_schema, position, item_counts]
      properties:
        key: { $ref: '#/components/schemas/Slug' }
        name: { type: string, maxLength: 200 }
        item_schema: { $ref: '#/components/schemas/ItemSchema' }
        position: { type: integer }
        item_counts:
          type: object
          required: [draft, published, archived]
          properties:
            draft: { type: integer }
            published: { type: integer }
            archived: { type: integer }

    Collection:
      type: object
      required: [id, site_id, key, name, item_schema, position]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/Slug' }
        name: { type: string, maxLength: 200 }
        item_schema: { $ref: '#/components/schemas/ItemSchema' }
        position: { type: integer, minimum: 0, maximum: 9999 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Item:
      type: object
      required: [id, collectionKey, slug, position, status, values]
      description: The same shape on every tier — with `status` always `published` on the public one.
      properties:
        id: { type: string, format: uuid }
        collection_key: { $ref: '#/components/schemas/Slug' }
        slug:
          oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }]
          description: >
            Optional — only items addressable by URL need one. NULLs do not collide, so any
            number of slugless items may coexist.
        position: { type: integer, minimum: 0, maximum: 9999 }
        status: { $ref: '#/components/schemas/ItemStatus' }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        values:
          type: object
          description: Keyed by field key, validated against the collection's item schema. Nulls omitted.
          additionalProperties: true

    Asset:
      type: object
      required: [public_id, site_id, pathname, url, content_type, size, uploaded_by, references]
      properties:
        public_id:
          type: string
          format: uuid
          description: >
            UUIDv7. THE ONLY IDENTITY AN ASSET HAS — there is no `id` member, so `body.id` is
            undefined. The internal primary key is never on the wire, which is what lets the admin
            list's keyset cursor be built from this. The path parameter is nevertheless spelled
            `/v1/assets/:id`; pass the `public_id` into it. See client-api.md.
        site_id: { type: string, format: uuid }
        pathname:
          type: string
          description: Blob object key. Always inside `sites/<siteSlug>/`, and unique across the whole store.
          examples: [sites/acme_foundation/hero-Xy7.jpg]
        url: { type: string, format: uri }
        content_type: { $ref: '#/components/schemas/ImageContentType' }
        size: { type: integer, minimum: 1, maximum: 15728640 }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        uploaded_by: { type: string }
        created_at: { type: string, format: date-time }
        references:
          type: integer
          description: How many draft or published values point at this asset. 0 means safe to delete.

    ImageContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp, image/avif]
      description: >
        SVG IS EXCLUDED deliberately — it is a script-execution vector served from a CDN
        origin. A rejected type is a 400 before an upload capability is minted.

    RecordFieldSpec:
      type: object
      required: [key, type]
      additionalProperties: false
      description: >
        One entry of a dataset's `record_schema`.

        STRICT AS OF a931876 — an unrecognised member is a 400 `unknown_field` carrying a pointer
        at the key, such as `/record_schema/0/maxLength`. It used to be accepted and ignored, which
        answered 201 while applying a default: `maxLength: 200` silently gave the field the default
        2 000, and a `ref` block with `Policy` silently selected `reject`, discarding writes.

        THE CASING TRAP IS SPECIFIC. `key` MAY be camelCase, because it is a JSON property rather
        than an address. Every member of the spec around it is snake_case — `max_length`, never
        `maxLength`.

        The `ref` block below is strict too. The BODY containing this array is NOT: a stray
        top-level member on the dataset create is still stripped, which is the service's T-23.
      properties:
        key:
          type: string
          maxLength: 64
          pattern: '^[a-z][a-zA-Z0-9_]*$'
          description: >
            camelCase IS allowed here, unlike every addressing key in this API: a record field
            is a JSON property of `data`, not an address.
          examples: [amountForint]
        type:
          type: string
          enum: [text, number, money, boolean, timestamp, ref]
          description: >
            `money` is SEPARATE FROM `number` on purpose. A money value is a decimal string of
            canonical MINOR UNITS and its definition must name a currency; a JSON number cannot
            hold a large HUF total exactly. No `richtext`, no `image`, no `list` and no nesting:
            a nested array cannot be aggregated or indexed.
        label: { type: string, maxLength: 200 }
        required: { type: boolean, default: false }
        groupable:
          type: boolean
          default: false
          description: >
            May be grouped by AND filtered on. Anything undeclared is a 400 rather than an
            unindexed scan.
        summable:
          type: boolean
          default: false
          description: '`number` and `money` fields only; anything else is a 400.'
        sensitive:
          type: boolean
          default: false
          description: >
            Withheld from list reads, audit, logs and export. MAY NEVER BE `groupable` — a
            group key is echoed in aggregate output.
        publicly_enumerable:
          type: boolean
          default: false
          description: >
            May be a `group_by` or an `eq` field ON THE PUBLIC TIER. Requires `groupable`, and
            MAY NEVER sit on a `sensitive` field. Independent of `sensitive`: the absence of
            that flag does not make a field public, which is what it meant before 9833022.
            Granting it is audited and raises dataset.public_enumeration_granted.
        max_length: { type: integer, minimum: 1, maximum: 5000, default: 2000, description: '`text` only.' }
        min:
          type: number
          description: >
            `number` and `money` only. ON A `money` FIELD THIS IS IN MINOR UNITS, compared as
            BigInt so a bound above 2^53 still means what it says.
        max:
          type: number
          description: '`number` and `money` only; in minor units on a `money` field.'
        integer:
          type: boolean
          description: >
            `number` ONLY — declaring it on a `money` field is a 400, because minor units are
            integral by construction.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [HUF]
          description: >
            ISO 4217, uppercase. REQUIRED ON A `money` FIELD unless `currency_field` is given,
            and forbidden on any other type. Exactly one of the two must be present: an amount
            with no currency is not an amount, and this is caught at definition time rather than
            at aggregate time. HUF HAS ZERO MINOR UNITS estate-wide, so "2500" HUF is 2500 Ft.
            The charset is checked rather than the code, so an unknown currency is accepted here
            but has no conversion defined.
        currency_field:
          type: string
          pattern: '^[a-z][a-zA-Z0-9_]*$'
          description: >
            Names a sibling `text` field carrying this amount's currency per record, for a
            dataset that takes more than one. Mutually exclusive with `currency`, and exactly one
            of the two is required on a `money` field. Summing such a field REQUIRES
            `?group_by=<currency_field>`, or the total would cross currencies. The validation
            messages name this wire spelling, so the string in the error is the string to look
            for in your payload.
        ref:
          type: object
          required: [collection]
          additionalProperties: false
          properties:
            collection:
              allOf: [{ $ref: '#/components/schemas/Slug' }]
              description: A collection that exists on this site.
            policy:
              type: string
              enum: [reject, store]
              default: reject
              description: >
                `store` skips the existence check entirely and is what a dataset recording
                MONEY must declare: a payment webhook must never fail because its target was
                deleted mid-checkout. The resulting dangling refs are counted in
                `GET /v1/admin/health`.

    RecordSchema:
      type: array
      minItems: 1
      maxItems: 40
      items: { $ref: '#/components/schemas/RecordFieldSpec' }

    Dataset:
      type: object
      required: [id, site_id, key, name, record_schema, public_aggregate, position]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        key: { $ref: '#/components/schemas/Slug' }
        name: { type: string, maxLength: 200 }
        record_schema: { $ref: '#/components/schemas/RecordSchema' }
        public_aggregate:
          type: boolean
          default: false
          description: >
            Gates `GET /v1/public/datasets/:key/aggregate`. It publishes the dataset TOTALS and
            no field's values: a group_by or an eq on that tier needs the field's own
            publicly_enumerable flag as well. Before 9833022 this one flag did both.
        retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: null keeps everything forever. Enforced by a CLI, never a cron.
        position: { type: integer, minimum: 0, maximum: 9999 }
        record_count: { type: integer, description: Present on the list endpoints. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecordData:
      type: object
      description: >
        Flat by construction — no nesting. Values are `text` (string), `number`, `boolean`,
        `timestamp` (ISO 8601, normalised to UTC on write) or `ref` (a collection item id). AN
        UNKNOWN KEY IS A 400, never stripped. Serialises to at most 8 KB.
      additionalProperties:
        oneOf: [{ type: string }, { type: number }, { type: boolean }, { type: 'null' }]
      examples:
        - { amountForint: 5000, beneficiaryId: 3f1c0000-0000-4000-8000-000000000000, manual: false }

    Record:
      type: object
      required: [public_id, dataset_key, external_id, data, withheld, occurred_at]
      properties:
        public_id:
          type: string
          format: uuid
          description: >
            UUIDv7. THE ONLY IDENTITY A RECORD HAS — like an asset, there is no `id` member and the
            internal primary key is not addressable anywhere on the API. Records grow without
            bound, so this is what the keyset cursor is built from. The path parameter is spelled
            `/v1/datasets/:key/records/:id`; pass the `public_id` into it. See client-api.md.
        dataset_key: { $ref: '#/components/schemas/Slug' }
        external_id:
          type: [string, 'null']
          maxLength: 200
          description: >
            The caller's own natural key — pass the payment provider's id. NOT patchable: the
            idempotency key must be stable.
        data: { $ref: '#/components/schemas/RecordData' }
        withheld:
          type: array
          items: { type: string }
          description: >
            `sensitive` keys that ARE set but not returned, so "withheld" and "never set" stay
            distinguishable. `[]` when sensitive values are included.
        occurred_at:
          type: string
          format: date-time
          description: The EVENT time — what the list orders by and `from`/`until` filter on.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AggregateGroup:
      type: object
      required: [key]
      properties:
        key:
          type: [string, 'null']
          description: >
            The group's value, always a string. `null` is the bucket for records MISSING the
            `group_by` field — deliberately returned rather than dropped — and is also the single
            row you get when `group_by` is omitted.
        count: { type: integer }
        sum:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - { $ref: '#/components/schemas/MoneySum' }
            description: >
              A `number` field sums to a JSON NUMBER; a `money` field sums to a MoneySum OBJECT.
              The shape follows the summed field's declared type, so a consumer must branch on it.
          description: >
            One entry per `sum:<field>` metric, KEYED BY THE DATASET'S OWN FIELD NAMES, which keep
            their spelling (`sum.amountForint` stays camelCase — tenant vocabulary is not an API
            member). A group with no matching rows reports 0, not null — for a `money` field that
            is `{"amount": "0", …}`, which is a legal sum even though "0" is not a legal stored
            value.

    MoneySum:
      type: object
      required: [amount, currency]
      description: >
        The sum of a `money` field. NEVER A JSON NUMBER: the total stays a string precisely
        because a large HUF total does not fit a double, and a donation total that is silently a
        float is the bug the `money` type exists to stop. Never bare either — an amount with no
        currency is not an amount.
      properties:
        amount:
          type: string
          pattern: '^[0-9]+$'
          examples: ['145000']
          description: >
            Decimal string of canonical minor units. Do NOT parse with Number(); format from the
            string or use BigInt. HUF has zero minor units, so "145000" HUF is 145 000 Ft.
        currency:
          type: string
          examples: [HUF]
          description: >
            The field's fixed `currency`, or — when the field declares `currency_field` — the
            group key, which such a request is required to group by.

    EventTypeDescriptor:
      type: object
      description: >
        One entry of the CLOSED, additive-only catalogue. It is the single source of the emitter's
        permitted types, the subscription validator's accepted set, the docs table and this
        endpoint — so the four cannot disagree.


        Adding an entry needs NO contract_version bump, on the one condition the receiver docs
        state: an unrecognised event_type is ignored and answered 2xx.
      required: [event_type, resource, kind, fires_when, target_status, contract_version, sensitive_blocks, cross_service]
      properties:
        event_type:
          type: string
          enum: [page.published, collection_item.published, collection_item.archived, record.created, site.revalidation_requested]
        resource:
          type: string
          enum: [page, collection_item, record, site]
          description: The `data` key carrying the subject. ALWAYS equals the event type's prefix.
        kind:
          type: string
          enum: [transition, observation]
          description: >
            `transition` = a resource's status moved · `observation` = a row appeared and no status
            moved. THE ASYMMETRY BETWEEN THE TWO `published` EVENTS IS REAL: a collection item has a
            status column that moves, a page does not (a publish appends a version row and flips
            per-field published values).
        fires_when: { type: string, description: One sentence, present tense, for a trigger picker. }
        target_status:
          type: [string, 'null']
          enum: [published, archived, null]
          description: >
            The status the primary resource reaches, when the participle names one. NULL ON EVERY
            OBSERVATION — and that is exactly what the status invariant reads: an event whose
            participle is not a member of its resource's status enum carries whatever status the
            resource actually holds.
        contract_version: { type: integer }
        sensitive_blocks:
          type: array
          items: { type: string }
          description: >
            Blocks that appear only behind an `include_*` flag. `["record.values"]` on
            record.created; empty on everything else.
        cross_service:
          type: boolean
          description: >
            Whether this service DECLARES a sibling Lamido service as a consumer. True only for
            record.created, which email-service turns into an acknowledgement — live since
            2026-08-21. The flag is a declaration by THIS service and not evidence about the
            receiver: the authority on what a receiver does with an event is that receiver's own
            folder, at email-service/webhooks.md section 7. From 2026-08-10 to 2026-08-21 this
            field said the same thing and it was false, because email-service's dispatch accepted
            record.submitted, which nothing in the estate emits. Do not infer an action from this
            flag alone.

    WebhookEndpoint:
      type: object
      description: >
        A destination. MANY PER SITE (max 20) — this replaced two columns on `sites`, which meant
        "call these two URLs when a page publishes" had no representation at all.


        The member set is IDENTICAL IN EVERY LAMIDO SERVICE. Do not expect a field here that is not
        in the others.
      required: [public_id, site_id, url, subscribed_events, contract_version, include_record_values, enabled, consecutive_failures, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid, description: How every route addresses it. The row id is never on the wire. }
        site_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        description: { type: [string, 'null'], description: The operator's note; what a list shows beside the URL. }
        subscribed_events:
          type: [array, 'null']
          items: { type: string }
          description: >
            NULL MEANS EVERY TYPE, including ones added later — the default, and what nearly every
            site should use. An empty array is never stored: it is a 400 at every write.
        contract_version: { type: integer, description: Pinned at creation. Absent from the PATCH. }
        include_record_values:
          type: boolean
          description: >
            Whether record.created carries the record's field values. OFF BY DEFAULT (WH-11), and
            changing it is audited BY VALUE rather than by field name.
        enabled: { type: boolean }
        disabled_reason:
          type: [string, 'null']
          description: >
            Non-null ONLY when `enabled` is false — that is what this resource promises. Set by an
            operator's disable, by auto-disable after five consecutive dead-letters, or by the
            migration off the old per-site secret.
        consecutive_failures:
          type: integer
          description: >
            Dead-letters in a row. ANY 2xx resets it; at 5 the endpoint is disabled. It lives on the
            endpoint rather than the delivery because it is a property of the destination over time —
            on a per-event row it would reset with every new event and never reach the threshold.
            It only moves when a delivery dead-letters, which requires a drain.
        secret_last4:
          type: [string, 'null']
          description: Last 4 characters of the plaintext. Null on an endpoint that has no secret yet.
        secret_fingerprint:
          type: [string, 'null']
          description: >
            A stable, non-reversible label for the secret — an HMAC under the KEK rather than a bare
            digest, so it cannot be compared against a rainbow table of candidate secrets. It exists
            so an operator can confirm a receiver holds the right secret WITHOUT either side sending
            the other the plaintext.
        signing_state:
          type: string
          enum: [ok, missing, undecryptable]
          description: >
            Whether this endpoint can actually be signed for, decided by ATTEMPTING the decryption
            rather than by reading a column. The drill-down behind admin health's
            endpoints_with_undecryptable_secret. 'missing' is a half-finished migration (no
            ciphertext); 'undecryptable' is a CREDENTIALS_ENC_KEY rotated without re-encrypting (a
            ciphertext that no longer opens) — and in that second case secret_last4 and
            secret_fingerprint look identical and perfectly healthy.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MintedEndpointSecret:
      type: object
      description: >
        A create or rotate response. THE ONLY SHAPE IN THIS SERVICE THAT CARRIES KEY MATERIAL, and it
        carries it exactly twice in an endpoint's life: at creation, and at each rotation.


        Wrapped rather than added as a sometimes-null field on the endpoint, so a client cannot
        accidentally build a UI that expects to read it back.
      required: [endpoint, signing_secret]
      properties:
        endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
        signing_secret:
          type: string
          pattern: '^whsec_'
          description: >
            STORE IT NOW — it is not recoverable, and rotating is the only way to get a new one. THE
            WHOLE STRING INCLUDING THE `whsec_` PREFIX IS THE HMAC KEY: do not strip it. Svix-signed
            provider feeds strip theirs, which is the opposite rule, and the two must never share a
            verifier.

    WebhookEvent:
      type: object
      description: >
        One row of the outbox. Written INSIDE the transaction that made the fact true, so a
        rolled-back publish leaves none and a committed one leaves exactly one — even if the process
        died before any HTTP attempt.
      required: [event_id, event_type, site_id, correlation_id, causation_id, hop, payload, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: >
            Sent as `X-Event-Id`. STABLE ACROSS EVERY RETRY AND EVERY OPERATOR REDELIVERY — the
            receiver's dedupe key.
        event_type: { type: string }
        site_id: { type: string, format: uuid }
        account_id:
          type: [string, 'null']
          description: >
            The consuming admin's account id — `sites.external_ref` as it stood inside the emitting
            transaction. Null for a site nobody has paired, which can still receive its own events
            but cannot participate cross-service.
        correlation_id:
          type: string
          format: uuid
          description: >
            Stable across a whole causal chain, and EQUAL TO event_id on everything this service
            emits — a pure emitter has no inbound chain to copy. Written rather than left null so
            "everything in this chain" is one indexed query with no special case for the root.
        causation_id: { type: [string, 'null'], format: uuid, description: 'Always null here. NEVER absent.' }
        hop: { type: integer, description: 'Always 0 here.' }
        page_id: { type: [string, 'null'], format: uuid }
        item_id: { type: [string, 'null'], format: uuid }
        record_id: { type: [string, 'null'], format: uuid }
        payload:
          type: object
          additionalProperties: true
          description: >
            The delivered body, built once and NEVER RE-SERIALISED — re-serialising changes
            whitespace and number formatting, which changes the signature, which means a receiver
            that stored the first body cannot verify the second.


            GOTCHA: this is what we STORED, not necessarily what a given endpoint RECEIVED.
            include_record_values is applied per endpoint at delivery time and contract_version
            renders per endpoint.
        request_id:
          type: [string, 'null']
          description: Joins the row to the log lines of the write that emitted it.
        created_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      description: >
        The delivery of one event to one endpoint, across however many attempts it takes. ONE ROW,
        MUTATED PER ATTEMPT — not a row per attempt, which is what lets the partial index BE the due
        queue rather than a filter over history.


        `unique(event_id, endpoint_id)` means a redelivery RESETS this row and can never insert a
        second one.
      required: [delivery_id, event_id, event_type, status, attempt, next_attempt_at, created_at, updated_at]
      properties:
        delivery_id:
          type: string
          format: uuid
          description: >
            Sent as `X-Delivery-Id`. UNIQUE PER HTTP ATTEMPT — regenerated on every retry and on
            every redelivery, so deduping on it dedupes nothing.
        event_id: { type: string, format: uuid, description: The dedupe key. Unchanged by a redelivery. }
        event_type: { type: string }
        status:
          type: string
          enum: [pending, delivered, dead_lettered]
          description: >
            `pending` until it is either `delivered` (any 2xx) or `dead_lettered` (the ladder is
            exhausted, and a website was never told). NOTE — rungs 3-8 advance only when an operator runs `db:webhooks-drain`; there is no
            cron. So a failed delivery rests at `pending` with `attempt: 3` until somebody drains.
            See website-api.md#delivery-guarantees.
        attempt:
          type: integer
          description: >
            The attempt currently pending, 1-based. Indexes the backoff ladder and decides when it is
            exhausted. Incremented as an attempt is SCHEDULED, so a pending row says which attempt is
            about to happen. Reaches 3 from the two inline attempts; beyond that only a drain moves it.
        next_attempt_at:
          type: string
          format: date-time
          description: >
            When this attempt becomes ELIGIBLE. A FLOOR, NOT A SCHEDULE: nothing polls it, so it is
            the earliest a drain could take the row rather than when it will. POST
            /v1/admin/webhook-deliveries/{id}/redeliver deliberately ignores it. See
            website-api.md#delivery-guarantees.
        response_status: { type: [integer, 'null'], description: 'The LATEST attempt only.' }
        response_body_excerpt:
          type: [string, 'null']
          description: >
            Up to 500 bytes, TRUNCATED WHILE READING rather than buffered and then trimmed — a
            receiver answering with a 10 MB HTML error page must not be able to make our memory its
            problem.
        error:
          type: [string, 'null']
          description: >
            `timeout` · `redirect_not_followed` (a 30x is a failure and is NEVER followed) ·
            `url_rejected: …` (the delivery-time SSRF check refused it and NO REQUEST WAS MADE) ·
            `HTTP <status>` · or a transport failure.
        endpoint_public_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookPingOutcome:
      type: object
      description: >
        What `POST …/test` found, returned synchronously. The probe writes NO event row and NO
        delivery row, and never touches consecutive_failures.
      required: [event_id, ok, response_status, latency_ms, response_body_excerpt, error]
      properties:
        event_id: { type: string, format: uuid, description: 'On the wire, so an operator can find it in the receiver''s log.' }
        ok: { type: boolean, description: 'Whether the receiver answered 2xx — the same rule every real delivery uses.' }
        response_status: { type: [integer, 'null'] }
        latency_ms: { type: integer, description: 'Round trip, including the URL guard''s DNS lookup.' }
        response_body_excerpt: { type: [string, 'null'] }
        error: { type: [string, 'null'], description: 'Transport failure or the guard''s refusal. Null when an answer arrived.' }

    AuditEntry:
      type: object
      required: [id, actor_type, actor_label, action, target_type, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: string, enum: [admin_key, client_key, system] }
        actor_id: { type: [string, 'null'], format: uuid }
        actor_label: { type: string, description: Denormalised, so the trail outlives the key. }
        action: { type: string, examples: [site.create, page.publish, asset.delete, record.read_sensitive] }
        target_type:
          type: string
          enum: [site, site_key, page, section, field, collection, collection_item, asset, dataset, record, admin_key]
        target_id: { type: [string, 'null'] }
        metadata:
          type: object
          description: >
            An ALLOWLISTED summary per action — never a raw request body, never a plaintext key,
            never a record's values. Patches record the changed field NAMES only. Its members are
            snake_case like every other member on this API; ten blocks carried camelCase until
            bdafb64, so a row written before that keeps its original spelling — audit_log is
            append-only and is not rewritten.
          additionalProperties: true
        ip: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
      description: >
        LIVENESS ONLY, and the whole body — `{"status":"ok"}`. `ok` is the only value the
        endpoint can answer, because it reads nothing that could be unhealthy. The `db` and
        `code` members were REMOVED at d013970 and are not stubbed: a client reading `body.db`
        gets undefined. Database health is AdminHealth, on GET /v1/admin/health.

    AdminHealth:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, attention, degraded]
          description: >
            `attention` when a page has unpublished drafts, a delivery dead-lettered, an endpoint
            is disabled, OR an endpoint has no signing secret. `dangling_refs` and
            `pending_deliveries` deliberately do NOT affect it — the first is an expected
            consequence of `ref.policy: store`, the second was reasoned as the ordinary state of a
            healthy queue on a service with no cron, so either would pin the dashboard amber forever.
            CAUTION — since the queue only moves when an operator drains it, a queue nobody drains
            looks exactly like a healthy quiet afternoon. Alert on `pending_deliveries` separately
            from `status`. See website-api.md#delivery-guarantees.
        db: { type: string, enum: [ok, unreachable] }
        blob_configured: { type: boolean, description: 'false breaks every upload.' }
        sites: { type: integer }
        pages_with_unpublished_drafts: { type: integer }
        orphan_assets: { type: integer, description: Shares its exact predicate with `GET /v1/admin/assets/orphans`. }
        orphan_assets_older_than_hours: { type: integer, default: 24 }
        dangling_refs: { type: integer, description: Records whose `ref` names a collection item that no longer exists. }
        pending_deliveries:
          type: integer
          description: >
            Deliveries queued at any rung of the ladder. Drill-down
            `GET /v1/admin/webhook-deliveries?status=pending`. NOT windowed, and not part of
            `status`. A RISING VALUE USUALLY MEANS NOBODY IS DRAINING — the queue only moves when an operator
            runs `db:webhooks-drain`. Drain first, then read what is left; a backlog that clears was
            unattended rather than faulty. See website-api.md#delivery-guarantees.
        dead_lettered_deliveries:
          type: integer
          description: >
            The ladder was exhausted, so a website was never told. Drill-down
            `GET /v1/admin/webhook-deliveries?status=dead_lettered`. Reached only via a drain, since that is what advances the ladder to its end. A non-zero
            value is a real receiver fault.
        disabled_endpoints:
          type: integer
          description: >
            Destinations receiving nothing, by an operator or by auto-disable. Drill-down
            `GET /v1/admin/webhook-endpoints?enabled=false`; read `disabled_reason` on the row.
        endpoints_without_secret:
          type: integer
          description: >
            Endpoints that cannot be signed for at all. THE MIGRATION PROGRESS BAR — every
            endpoint carried over from the old `sites.revalidate_url` starts here and leaves as
            its secret is rotated. Reaching zero is the definition of that cutover finishing.
        enabled_endpoints_without_secret:
          type: integer
          description: >
            Enabled AND unsignable — a state that must never exist. NON-ZERO IS A BUG IN THE
            SERVICE rather than a half-done configuration: the migration creates such endpoints
            disabled, `enable` refuses while the secret is missing, and rotating is the only
            thing that sets one enabled. Counted anyway, because an invariant nothing checks is
            one nobody notices breaking.
        endpoints_with_undecryptable_secret:
          type: integer
          description: >
            Endpoints whose ciphertext is PRESENT and no longer opens — the symptom of a
            CREDENTIALS_ENC_KEY rotated without re-encrypting, and the one count here an IS NULL
            query cannot produce. Non-zero means no delivery to those endpoints can be signed, and
            it turns `status` to `attention`. Before it existed the whole strip stayed green
            while the websites simply stopped hearing. Drill down with signing_state on the
            endpoint object.
        sites_without_external_ref:
          type: integer
          description: >
            Active sites nobody has paired. Not an error — their own receivers work — but they
            emit `account_id: null` and so cannot participate cross-service.
      description: >
        NOTE: `failed_revalidations` was REMOVED. It counted `audit_log` rows over a rolling 24
        hours while its own drill-down selected `publish_events` with no window at all — two
        independent queries that nothing made agree, so a count and its list could disagree. Every
        webhook count above is `count(*)` over the SAME exported predicate its drill-down binds,
        and none of them is windowed.

    ImportDocument:
      type: object
      description: >
        A whole site as one document — what `GET …/export` returns and `POST …/import` accepts.
        Values are keyed by locale: `values: { hu: { draft: …, published: … } }`.

        CRITICAL: on a merge, for every section and field the document MENTIONS, an omitted key
        is a WRITTEN NULL — `label ?? null`, `position ?? 0`, `item_schema ?? null`. So a
        values-only companion document destroys the structure it was meant to fill. Keep
        structure and values in ONE document, and omit `values` entirely to leave stored values
        untouched (`values: {hu: {draft: null}}` CLEARS them). Import writes DRAFTS ONLY and
        never publishes — but the next publish of a page carries everything it wrote live.
      properties:
        site: { type: object, additionalProperties: true }
        pages: { type: array, maxItems: 200, items: { type: object, additionalProperties: true } }
        collections: { type: array, maxItems: 100, items: { type: object, additionalProperties: true } }
        datasets: { type: array, maxItems: 100, items: { type: object, additionalProperties: true } }
        assets: { type: array, maxItems: 5000, items: { type: object, additionalProperties: true } }

paths:
  /:
    get:
      operationId: getLandingPage
      tags: [health]
      summary: A static landing page for a human who typed the domain
      description: |
        HTML, no auth, `Cache-Control: public, max-age=3600`. Added at `9113063`. Exists so
        the root of an API host does not answer a problem document to a browser, which reads
        as an outage. Scoped to `/` exactly; every other unknown path still returns the
        problem document, and a non-`GET` here is a `404`.

        **Not a health check** — the body is a compile-time constant served without touching
        the database, so it stays `200` through a total outage. Use `/healthz` for liveness and
        `GET /v1/admin/health` for the database.
      security: []
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness — is the process alive
      description: >
        The ONLY unauthenticated endpoint, and LIVENESS ONLY. ALWAYS ANSWERS 200
        `{"status":"ok"}` while the process is alive. It answers one question: should the platform
        restart or drain this instance? While requests are still being served the answer is no, so
        a database blip must not tell every instance to die at once.

        IT DOES NOT TOUCH THE DATABASE as of d013970, and the `db` member is GONE from the body
        rather than stubbed. It ran `select 1` and reported db: ok | unreachable, but Neon bills
        per hour of compute and suspends after five minutes of silence, so a monitor polling this
        on any shorter interval held the database awake around the clock — for a reading nothing
        acted on, since the route answers 200 either way. A stub would have left an alert wired to
        a value that can never change again.

        It reads no environment variable either, so it keeps answering 200 while a malformed
        DATABASE_URL fails every other endpoint on the host. It proves the PROCESS is up; it
        cannot prove the service works.

        DATABASE HEALTH IS GET /v1/admin/health, which reported it already and in far more detail.
        That endpoint is authenticated, so it cannot be polled by accident.
      security: []
      responses:
        '200':
          description: >
            Alive. `{"status":"ok"}` — the only body this endpoint can produce. There is no
            degraded response and no `db` or `code` member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ─────────────────────────────────────────────────────────────────────────
  # Website read tier — /v1/public/*   (6 operations)
  # ─────────────────────────────────────────────────────────────────────────
  /v1/public/site:
    get:
      operationId: getPublicSite
      tags: [website]
      summary: Site identity and the published `settings` section
      description: >
        One request a website makes per render and caches. `settings` is `{}` — never a 404 —
        when the site has no `settings` section. The ETag folds in the site row's own
        `updated_at`, because renaming a site changes this payload with nothing published.
      security: [{ siteKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/localeQuery' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: >
            Cache-Control public, s-maxage=60, stale-while-revalidate=300, plus an ETag and
            Vary Origin, Authorization.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PublicSite' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/public/pages:
    get:
      operationId: listPublishedPages
      tags: [website]
      summary: Every page published at least once
      description: >
        For a sitemap or a static path list. NOT paginated — a site has single-digit pages. A
        page that has never been published, or that is inactive, is absent entirely rather than
        listed with a null version. TAKES NO `locale` PARAMETER, unlike every other content read:
        a page's `title` is a column on the page rather than a localised value, so this list is
        the same in every locale.
      security: [{ siteKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: Published pages in staff-defined order.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [slug, title, version, published_at]
                      properties:
                        slug: { $ref: '#/components/schemas/Slug' }
                        title: { type: string }
                        version: { type: integer }
                        published_at: { type: string, format: date-time }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
                      list is not paginated and returns every row.
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/public/pages/{slug}:
    get:
      operationId: getPublishedPage
      tags: [website]
      summary: The published page document
      description: >
        "Does not exist", "switched off" and "never published" all answer the SAME 404 with the
        same message — they are the same fact to a website, and distinguishing them would turn a
        browser-visible key into a map of unreleased structure. That 404 is cacheable at
        s-maxage=10.
      security: [{ siteKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/localeQuery' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PageDocument' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/public/collections/{key}:
    get:
      operationId: listPublishedItems
      tags: [website]
      summary: Published items of a collection
      description: >
        `position` order, published only. The ETag folds in `updated_at` as well as
        `published_at`, because a reorder moves `position` without touching any publish stamp.
      security: [{ siteKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/localeQuery' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: Published items.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/public/collections/{key}/items/{idOrSlug}:
    get:
      operationId: getPublishedItem
      tags: [website]
      summary: One published item, by id or by slug
      description: >
        Both forms, because a list payload gives you ids while a URL carries a slug. A draft or
        archived item is a 404 with the same message as an unknown one.
      security: [{ siteKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
          description: A uuid or a slug — the service decides which by shape.
        - { $ref: '#/components/parameters/localeQuery' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Item' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/public/datasets/{key}/aggregate:
    get:
      operationId: getPublicAggregate
      tags: [website]
      summary: Grouped counts and sums — the only public thing a dataset exposes
      description: >
        Lets a browser render a live total without a secret key and without the site owning a
        database. Answered ONLY when the dataset's `public_aggregate` is true; otherwise a 404
        with the same message as an unknown dataset, because a 403 would confirm it exists.
        Cached for 10 SECONDS, not 60: no publish invalidates a total, so this is the freshness
        mechanism rather than a backstop. The ETag folds in the record count, so a DELETE moves
        it even though no timestamp changed. There is no public records list and no public
        write, on any tier.
      security: [{ siteKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - name: group_by
          in: query
          required: false
          schema: { type: string }
          description: >
            A field the dataset declared `groupable` AND `publicly_enumerable` — on this tier
            both are required, and a field with only the first is a 400 whose
            details.publicly_enumerable lists the fields that qualify. Omitted gives ONE row
            with a null key holding whole-dataset totals, which exists even over zero records.
        - name: metrics
          in: query
          required: false
          schema: { type: string, maxLength: 200, default: count }
          description: >
            Comma-separated `count` and/or `sum:<field>`. Max 3 sum metrics; each field must be
            declared summable.
          examples:
            countAndSum:
              value: count,sum:amountForint
        - { $ref: '#/components/parameters/eqQuery' }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/untilQuery' }
        - { $ref: '#/components/parameters/aggregateLimitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: >
            Cache-Control public, s-maxage=10, stale-while-revalidate=60. Groups by key
            ascending, nulls first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AggregateGroup' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      The DISTINCT GROUP count, including the null group. Exact on every request,
                      but cheaper in one page: at offset 0 a page shorter than `limit` cannot have
                      been truncated, so the count comes from the returned rows. A full page or a
                      non-zero offset costs a SECOND aggregate over `records`. Ask with a `limit`
                      above your expected group count — that is what the 1000 ceiling is for.
                  limit: { type: integer }
                  offset: { type: integer }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────────────────────────────────────────────────────
  # Client (editor) write tier — /v1/*   (30 operations)
  # Every path is scoped to ONE site by the csk_ key. None carries a site id.
  # ─────────────────────────────────────────────────────────────────────────
  /v1/me:
    get:
      operationId: getClientMe
      tags: [client]
      summary: The site this key is bound to, and the key's own metadata
      description: '`site.locales` is the set this key may write. Nothing else on this tier tells you that.'
      security: [{ secretKey: [] }]
      responses:
        '200':
          description: Site and key.
          content:
            application/json:
              schema:
                type: object
                required: [site, key]
                properties:
                  site: { $ref: '#/components/schemas/Site' }
                  key: { $ref: '#/components/schemas/SiteKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/pages:
    get:
      operationId: listClientPages
      tags: [client]
      summary: The site's pages, in staff-defined order
      description: Not paginated. Includes inactive pages, so an editor UI can build a nav.
      security: [{ secretKey: [] }]
      responses:
        '200':
          description: Pages.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Page' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
                      list is not paginated and returns every row.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/pages/{slug}:
    get:
      operationId: getClientPageStructure
      tags: [client]
      summary: The STRUCTURE tree — what fields exist and of what type
      description: >
        Render a form from this; get the values from the rendered endpoint. INCLUDES inactive
        sections, unlike the rendered document, because staff switch a section off to stage it
        and an editor has to be able to fill it in first.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
      responses:
        '200':
          description: The page with its sections and their fields, both in position order.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PageTree' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pages/{slug}/values:
    patch:
      operationId: setDraftValues
      tags: [client]
      summary: Save draft values
      description: >
        ONLY THE DRAFT MOVES — a save never touches what is live. AN UNKNOWN KEY IS A 400, not a
        silent strip: stripping a typo would lose the editor's text behind a 200 OK. Every
        problem comes back at once in `details.unknown_keys` and `details.invalid`. One
        transaction. Answers with the updated draft document so an optimistic UI reconciles in
        one round trip.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                locale:
                  type: string
                  description: Omitted means the site's default_locale.
                values:
                  type: object
                  minProperties: 1
                  maxProperties: 500
                  description: >
                    Keys are "<sectionKey>.<fieldKey>". A null value discards the DRAFT for that
                    field; send "" to publish an empty value. More than 500 keys means using the
                    admin import endpoint instead.
                  additionalProperties: { $ref: '#/components/schemas/ContentValue' }
            examples:
              mixed:
                value:
                  locale: hu
                  values:
                    hero.title: Minden gyermek egy **csoda.**
                    hero.image: { asset_id: 0f2c0000-0000-4000-8000-000000000000, alt: Hero kép }
                    celok.stats:
                      - { value: '17', label: támogatott }
      responses:
        '200':
          description: The updated DRAFT document.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pages/{slug}/publish:
    post:
      operationId: publishPage
      tags: [client]
      summary: Copy drafts over published and freeze a version
      description: >
        PUBLISH IS PER PAGE. Every section shares one document, so this publishes EVERY
        unpublished draft on the page — including ones a seed import wrote. One transaction:
        required fields of ACTIVE sections are checked first (409 with details.missing), then
        published = coalesce(draft, published) per locale, then one page_versions row at
        max(version)+1. The revalidation webhook fires AFTER the commit, best-effort, and never
        fails the publish. Omitting locale publishes every locale but snapshots only the default
        one. A version-number race is retried once, then a 409 you may retry after reloading.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/idempotencyKeyHeader' }
      requestBody:
        required: false
        description: Optional — a bodyless POST publishes with no note in every locale.
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, description: Restricts the publish to one locale. }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: >
            Published — or REPLAYED, if an `Idempotency-Key` matched an earlier publish of this
            page. A replay returns the ORIGINAL version, writes nothing, and fires no second
            revalidation webhook.
          headers:
            Idempotent-Replay:
              schema: { type: string, const: 'true' }
              description: Present only on a replay. Nothing was published by this call.
          content:
            application/json:
              schema:
                type: object
                required: [version, published_by, created_at, locales, document]
                properties:
                  version: { type: integer }
                  note: { type: [string, 'null'] }
                  published_by: { type: string }
                  created_at: { type: string, format: date-time }
                  locales: { type: array, items: { type: string } }
                  document: { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/pages/{slug}/revert:
    post:
      operationId: revertPage
      tags: [client]
      summary: Discard drafts — copy published back over draft
      description: >
        Writes NO version row, deliberately: nothing went live, so there is nothing to record in
        the history of what the website has served.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, description: Omitted reverts every locale of the site. }
      responses:
        '200':
          description: The draft document, now equal to the published one.
          content:
            application/json:
              schema:
                type: object
                required: [locales, document]
                properties:
                  locales: { type: array, items: { type: string } }
                  document: { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pages/{slug}/versions:
    get:
      operationId: listPageVersions
      tags: [client]
      summary: Publish history, newest first
      description: Carries NO documents — a history of fifty publishes would be fifty full pages.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Version summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pages/{slug}/versions/{version}:
    get:
      operationId: getPageVersion
      tags: [client]
      summary: One frozen snapshot, with its document
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/versionNumber' }
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pages/{slug}/versions/{version}/restore:
    post:
      operationId: restorePageVersion
      tags: [client]
      summary: Copy a version's values into the DRAFT
      description: >
        NEVER straight to published — there is exactly one path to live content, so every live
        change has a version row. Restore then publish produces version N+1 whose document
        equals version M. `skipped` names fields the snapshot has that the structure no longer
        does, or whose type changed; SHOW IT, or an editor publishes a page missing a paragraph
        and is never told which.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/versionNumber' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string }
      responses:
        '200':
          description: Restored into the draft.
          content:
            application/json:
              schema:
                type: object
                required: [restored, skipped, document]
                properties:
                  restored: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
                  document: { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/rendered/pages/{slug}:
    get:
      operationId: getRenderedPage
      tags: [client]
      summary: Preview — the page document in either view
      description: >
        IDENTICAL in shape to the public read, so preview mode renders through production
        components. `view=draft` answers no-store, because an editor's back button showing
        yesterday's unpublished draft is indistinguishable from a bug; a published read here is
        still private, because it is authorised by a secret key.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/viewQuery' }
        - { $ref: '#/components/parameters/localeQuery' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/collections:
    get:
      operationId: listClientCollections
      tags: [client]
      summary: Collections with their item counts by status
      description: One screen's worth in one request. Not paginated.
      security: [{ secretKey: [] }]
      responses:
        '200':
          description: Collections.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CollectionSummary' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
                      list is not paginated and returns every row.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/collections/{key}/items:
    get:
      operationId: listClientItems
      tags: [client]
      summary: Items of a collection, in position order
      description: '`view` defaults to `draft` here, unlike the public tier. `status` omitted returns all three.'
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemStatusQuery' }
        - { $ref: '#/components/parameters/itemViewQuery' }
        - { $ref: '#/components/parameters/localeQuery' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createItem
      tags: [client]
      summary: Create an item — always born a draft
      description: >
        `status` is not settable: otherwise "add the next news item" would be a publish. An
        unknown value key is a 400, checked against the collection's item_schema. A duplicate
        slug is a 409; a null slug never collides.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                position: { type: integer, minimum: 0, maximum: 9999, description: 'Omitted: max(position)+1.' }
                locale: { type: string }
                values:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/ContentValue' }
      responses:
        '201':
          description: The created draft item.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/collections/{key}/items/reorder:
    post:
      operationId: reorderItems
      tags: [client]
      summary: Set the complete item order
      description: >
        Takes the COMPLETE ordered set. A partial list is a 400 naming details.missing and
        details.unknown rather than being applied to a prefix — "reshuffle these three and leave
        the rest wherever they landed" is not an operation anyone means to perform.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: The applied order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection_key: { $ref: '#/components/schemas/Slug' }
                  ids: { type: array, items: { type: string, format: uuid } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/collections/{key}/items/{id}:
    get:
      operationId: getClientItem
      tags: [client]
      summary: One item
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemId' }
        - { $ref: '#/components/parameters/itemViewQuery' }
        - { $ref: '#/components/parameters/localeQuery' }
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateItem
      tags: [client]
      summary: Partially update an item
      description: >
        Values MERGE — keys the patch does not mention keep their value, because replacing the
        whole map would make a one-field form silently blank the others. A null slug clears it. A
        body with no fields at all is a 400.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                slug:
                  oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }]
                position: { type: integer, minimum: 0, maximum: 9999 }
                locale: { type: string }
                values:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/ContentValue' }
      responses:
        '200':
          description: The updated item, draft view.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteItem
      tags: [client]
      summary: HARD delete an item — archive instead, normally
      description: >
        Reference-counted: a 409 with details.record_count while dataset records point at this
        item, unless force=true, which leaves those refs dangling (visible in
        GET /v1/admin/health, audited as forced). ARCHIVING IS THE EVERYDAY PATH and has
        nothing to refuse.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemId' }
        - { $ref: '#/components/parameters/forceQuery' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  deleted: { type: boolean }
                  forced: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/collections/{key}/items/{id}/publish:
    post:
      operationId: publishItem
      tags: [client]
      summary: Publish one item — EVERY LOCALE unless the body names one
      description: >
        Copies draft over published per key with coalesce, flips status to published and stamps
        published_at, then fires the revalidation webhook. An empty required key is a 409 with
        details.missing. Publishing an ARCHIVED item brings it back — there is no separate
        un-archive endpoint.


        AN OMITTED locale PUBLISHES EVERY LOCALE OF THE SITE, the same default a page publish
        carries. Before d06a3f8 it published one — the site's default_locale — while flipping
        status for the whole item, so a bilingual import answered 200 per item and left the
        second language empty in public. The required-value check therefore runs PER LOCALE:
        an item filled in one language and empty in another is a 409, not a half-published 200.


        locale is a BODY field here. As a query parameter it is a 400 at #/query/locale — a
        write's query string is closed.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  description: >
                    Omitted publishes every locale of the site. One locale restricts both the
                    write and the required-value check to it.
      responses:
        '200':
          description: >
            The locales the publish covered, and the item rendered in one of them. The shape
            changed at d06a3f8 — it was a bare Item — to match what a page publish answers.
          content:
            application/json:
              schema:
                type: object
                required: [locales, item]
                properties:
                  locales:
                    type: array
                    items: { type: string }
                    description: Every locale this call published. Read this rather than inferring it.
                  item:
                    allOf: [{ $ref: '#/components/schemas/Item' }]
                    description: >
                      Rendered in ONE locale — the requested one, or the site's default. An item's
                      values are one map per locale, so a response can only carry one.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/collections/{key}/items/{id}/archive:
    post:
      operationId: archiveItem
      tags: [client]
      summary: Take an item off the website, recoverably
      description: >
        THE RECOMMENDED REMOVAL. Values are untouched and dataset records that point at it keep
        pointing, so a retired beneficiary keeps its donations and the ledger still adds up.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemId' }
      responses:
        '200':
          description: The archived item.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/assets/upload-token:
    post:
      operationId: createUploadToken
      tags: [client]
      summary: Step 1 of 3 — mint a capability to write one object
      description: >
        Called by YOUR BACKEND; the token it returns is what the browser holds. Scoped to this
        site's prefix, 15 minutes, 15 MB, and the four allowed image types — SVG is rejected
        here, before a capability exists. The bytes never pass through this service, which is why
        Vercel's 4.5 MB body limit does not apply.
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type]
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: >
                    A filename, not a path. Sanitised server-side regardless: directory
                    components are dropped and the name is reduced to [a-z0-9._-].
                content_type: { $ref: '#/components/schemas/ImageContentType' }
      responses:
        '200':
          description: The capability.
          content:
            application/json:
              schema:
                type: object
                required: [token, pathname, allowed_content_types, maximum_size_in_bytes]
                properties:
                  token: { type: string }
                  pathname: { type: string, description: The pathname asked for, BEFORE Blob appends its random suffix. }
                  allowed_content_types: { type: array, items: { $ref: '#/components/schemas/ImageContentType' } }
                  maximum_size_in_bytes: { type: integer, examples: [15728640] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/assets:
    post:
      operationId: registerAsset
      tags: [client]
      summary: Step 3 of 3 — register what Blob actually stored
      description: >
        Explicit registration is the primary path, NOT Blob's onUploadCompleted callback: that
        callback does not fire against localhost, so relying on it would make local development
        diverge from production in the flow that is hardest to test. Send the pathname and url
        Blob returned, which differ from what the token asked for.
      security: [{ secretKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pathname, url, content_type, size]
              properties:
                pathname:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Must start with sites/<siteSlug>/ or the answer is 403.
                url: { type: string, format: uri, maxLength: 1000, description: Must be a Vercel Blob URL. }
                content_type: { $ref: '#/components/schemas/ImageContentType' }
                size:
                  type: integer
                  minimum: 1
                  maximum: 15728640
                  description: 0 is a 400 — a zero-byte image is a failed upload, and registering one hides that.
                width: { type: integer, minimum: 1, maximum: 100000 }
                height: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        '201':
          description: The registered asset, with references 0.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listClientAssets
      tags: [client]
      summary: This site's image library, newest first
      description: >
        No `site_id` parameter, unlike the admin twin — the key decides the site, so there is
        nothing here a caller could set to read another one. `references` is live: 0 means safe
        to delete.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Assets.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  next_cursor:
                    type: [string, 'null']
                    description: >
                      Opaque cursor for the next page, or null on the last (or only) page. ALWAYS
                      present — null, never absent, so one pager terminates correctly everywhere.
                      These lists carry NO total: counting a filtered, unbounded table on every
                      page is not cheap, and the pager terminates on this field instead.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/assets/{id}:
    delete:
      operationId: deleteClientAsset
      tags: [client]
      summary: Delete an asset, refusing while anything points at it
      description: >
        The 409 names WHERE, in both views — an image only a draft references is still someone's
        work in progress. THERE IS NO force= ON THIS TIER: an editor bypassing the check would
        blank an image on their own live site. The row goes first, then the object, because an
        orphaned object is recoverable garbage while a row pointing at deleted bytes is a broken
        image on a live page.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/assetId' }
      responses:
        '200':
          description: Deleted. blob_deleted false means the object survived and the GC CLI will sweep it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_id: { type: string, format: uuid }
                  deleted: { type: boolean }
                  blob_deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/datasets:
    get:
      operationId: listClientDatasets
      tags: [client-datasets]
      summary: Dataset definitions with their record counts
      security: [{ secretKey: [] }]
      responses:
        '200':
          description: Datasets.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Dataset' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
                      list is not paginated and returns every row.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/datasets/{key}/records:
    post:
      operationId: insertRecord
      tags: [client-datasets]
      summary: Insert a record — IDEMPOTENT on external_id
      description: >
        THIS IS THE ONLY TIER THAT CREATES RECORDS. 201 created:true for a new row, 200
        created:false for a replay. A REDELIVERED WEBHOOK IS A SUCCESS, NOT A 409 — an error
        would make a payment provider retry forever. Uniqueness is the (dataset_id, external_id)
        index's job, so two concurrent deliveries cannot race into two rows. Pass the provider's
        own id; a uuid generated per attempt defeats the mechanism. An unknown data key is a 400.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - { $ref: '#/components/parameters/idempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                external_id: { type: string, minLength: 1, maxLength: 200 }
                occurred_at:
                  type: string
                  format: date-time
                  description: The EVENT time. Omitted means now — a live webhook rather than a back-fill.
                data: { $ref: '#/components/schemas/RecordData' }
            examples:
              donation:
                value:
                  external_id: cs_test_YOUR_SESSION_ID
                  occurred_at: '2026-03-01T12:00:00Z'
                  data: { amountForint: 5000, manual: false, donorName: Kovács Anna }
      responses:
        '201':
          description: A new row.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Record' }
                  - type: object
                    required: [created]
                    properties:
                      created:
                        type: boolean
                        const: true
                        description: >
                          Rides BESIDE the record, not wrapping it: the resource is the body, and
                          `created` is metadata about what this call did. Note the record's own
                          payload member is also called `data` — that is the record's data, not
                          an envelope.
        '200':
          description: >
            A replay — the conflict target already existed. NOT AN ERROR: the caller wanted the
            record to exist and it does, and a 409 here would make a payment provider retry
            forever. The stored record is returned UNCHANGED; a differing body is not applied.
          headers:
            Idempotent-Replay:
              schema: { type: string, const: 'true' }
              description: Present only on a replay. Branch on this, or on `created`.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Record' }
                  - type: object
                    required: [created]
                    properties:
                      created: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The same `Idempotency-Key` was used with a different request body — `code:
            idempotency_key_reused`. Only reachable when a key was supplied: an `external_id`
            replay is a redelivered webhook and stays a 200.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    get:
      operationId: listRecords
      tags: [client-datasets]
      summary: Records, newest event first
      description: >
        Ordered by occurred_at descending, not created_at — a migrated ledger keeps its original
        dates, and ordering by when the webhook landed would put a back-fill at the top.
        SENSITIVE VALUES ARE WITHHELD ENTIRELY HERE; there is one door to them and it is the
        single-record read.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - { $ref: '#/components/parameters/eqQuery' }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/untilQuery' }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Records.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Record' } }
                  next_cursor:
                    type: [string, 'null']
                    description: >
                      Opaque cursor for the next page, or null on the last (or only) page. ALWAYS
                      present — null, never absent, so one pager terminates correctly everywhere.
                      These lists carry NO total: counting a filtered, unbounded table on every
                      page is not cheap, and the pager terminates on this field instead.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/datasets/{key}/records/{id}:
    get:
      operationId: getRecord
      tags: [client-datasets]
      summary: One record, optionally including sensitive values
      description: >
        include=sensitive is the ONLY way a sensitive value reaches a response, and that read IS
        AUDITED (record.read_sensitive) — a deliberate exception to "reads are not audited",
        because looking up a donor's details is an event someone may later need to account for.
        The values never reach the trail; only the key names, which are already public on the
        definition.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - { $ref: '#/components/parameters/recordId' }
        - { $ref: '#/components/parameters/includeSensitiveQuery' }
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Record' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRecord
      tags: [client-datasets]
      summary: Partially update a record
      description: >
        data keys MERGE; null clears one. `required` is checked against the MERGED result, so a
        one-field correction is possible. external_id is absent from this body and is stripped if
        sent: changing the idempotency key would let a replay insert a second row for a payment
        that already counted.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - { $ref: '#/components/parameters/recordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                occurred_at: { type: string, format: date-time }
                data: { $ref: '#/components/schemas/RecordData' }
      responses:
        '200':
          description: The updated record.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Record' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      operationId: deleteRecord
      tags: [client-datasets]
      summary: Hard delete a record
      description: There is no archive for a record — it is data, not an editorial draft. Audited.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - { $ref: '#/components/parameters/recordId' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_id: { type: string, format: uuid }
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/datasets/{key}/aggregate:
    get:
      operationId: getClientAggregate
      tags: [client-datasets]
      summary: Grouped counts and sums, authenticated
      description: >
        The same parser as the public aggregate, with neither the public_aggregate gate nor the
        per-field publicly_enumerable one — so this endpoint answers questions the public twin
        refuses, and never the other way round. Answers ETag/If-None-Match with 304; the
        validator folds in the record count, so a delete moves it.
      security: [{ secretKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/datasetKey' }
        - name: group_by
          in: query
          required: false
          schema: { type: string }
          description: >
            A field the dataset declared groupable. NO publicly_enumerable requirement here — that
            gates the cpk_ tier only, so this endpoint answers questions the public one refuses.
            Omitted gives one null-key row of totals.
        - name: metrics
          in: query
          required: false
          schema: { type: string, maxLength: 200, default: count }
          description: 'Comma-separated count and/or sum:<field>. Max 3 sum metrics.'
        - { $ref: '#/components/parameters/eqQuery' }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/untilQuery' }
        - { $ref: '#/components/parameters/aggregateLimitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
        - { $ref: '#/components/parameters/ifNoneMatch' }
      responses:
        '200':
          description: >
            Groups, key ascending, nulls first. Cache-Control private, max-age=0,
            must-revalidate, plus Vary: Authorization and an ETag — 55b828d, 2026-08-24. It
            answered `public, s-maxage=10` with NO Vary before that, on a response authorised by
            a secret key, so a shared proxy could serve one tenant's totals to another's key.
            Keep the ETag and revalidate: a repeat read then costs one validator query instead
            of the GROUP BY.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AggregateGroup' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────────────────────────────────────────────────────
  # Lamido admin tier — /v1/admin/*   (83 operations)
  # Server-to-server. NO CORS headers, and the browser tripwire DOES guard this
  # tier — Origin or Sec-Fetch-Dest is a 403 before auth. No mode: "same-origin"
  # is needed by any caller; that requirement ended estate-wide on 2026-08-09.
  # Scopes are per route; a cad_ key reaches every site.
  # ─────────────────────────────────────────────────────────────────────────
  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [admin-ops]
      summary: What may this key do?
      description: >
        NO SCOPE REQUIRED — a key must always be able to introspect itself, or a narrowly-scoped
        key cannot even discover that it is narrowly scoped.
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/AdminKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/health:
    get:
      operationId: getAdminHealth
      tags: [admin-ops]
      summary: The operator status strip
      description: >
        No scope required — a key must always be able to introspect. Deeper than /healthz, and since
        d013970 THE ONLY ENDPOINT THAT REPORTS DATABASE HEALTH — /healthz stopped querying, so every
        `db` alert belongs here. It queries on every call, so schedule a poll in minutes rather than
        seconds: Neon bills for the compute a poll keeps awake.

        It reports the conditions a human has to act on, and EVERY COUNT HAS A DRILL-DOWN —
        orphan_assets → GET /v1/admin/assets/orphans · dangling_refs → GET
        /v1/admin/datasets/{id}/records · pending_deliveries and dead_lettered_deliveries → GET
        /v1/admin/webhook-deliveries?status=… · disabled_endpoints → GET
        /v1/admin/webhook-endpoints?enabled=false · endpoints_without_secret and
        endpoints_with_undecryptable_secret → GET /v1/admin/webhook-endpoints?signing_state=… ·
        sites_without_external_ref → GET /v1/admin/sites?paired=false.


        The four webhook counts bind the SAME exported predicate their list does, which is what
        the removed failed_revalidations got wrong: it and its drill-down were two independent
        queries over two tables with different windows, so they could disagree.


        ALSO ALWAYS 200 — alert on `status`, never on the status code, AND THAT NOW HOLDS WITH THE
        DATABASE DOWN: until f8e51f8 this endpoint answered 500 in exactly that state, because
        resolving the cad_ key is itself a database read and threw before the handler ran. During an
        outage the credential therefore cannot be verified, so any well-formed bearer token is
        answered; no token is still 401 and an Origin header still 403, and every other
        /v1/admin/* route still answers 500. dangling_refs and
        pending_deliveries are deliberately excluded from `status`: ref policy `store` produces
        the first on purpose, and with no cron a queued delivery is the ordinary state of a
        healthy queue, so either would pin a dashboard amber forever.
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: >
            `status` is ok | attention | degraded. WHEN THE DATABASE IS UNREACHABLE THE BODY IS
            SHORT — `{status: "degraded", db: "unreachable", blob_configured}` and nothing else,
            because the counts are the queries that failed. Code for absent keys, not for zeroes.
            That body is REACHABLE as of f8e51f8; before it, an outage produced a 500 problem
            document and this branch could not be observed at all.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/AdminHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/admin-keys:
    get:
      operationId: listAdminKeys
      tags: [admin-keys]
      summary: Every admin key, hashes excluded
      description: >
        Scope: admin:manage. NOT PAGINATED — it returns every key, newest first, and takes no
        `limit` or `offset`. It used to advertise both; the handler never read them, so a caller
        that paged silently received the whole list on every request.
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: Admin keys.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminKey' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
                      list is not paginated and returns every row.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminKey
      tags: [admin-keys]
      summary: Mint an admin key
      description: >
        Scope: admin:manage. Returns the plaintext ONCE. The FIRST key on a deployment cannot be
        made here — use the CLI (pnpm run db:admin-key -- mint --label …), because there is
        deliberately no master key in the environment. One key per deployment: the label is the
        audit actor.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
                scopes:
                  type: array
                  minItems: 1
                  default: ['*']
                  items: { $ref: '#/components/schemas/AdminScope' }
                allowed_ips:
                  type: array
                  maxItems: 50
                  default: []
                  items: { type: string }
                  description: CIDRs. Empty means unrestricted, which is correct for rotating egress IPs.
      responses:
        '201':
          description: The key, with its plaintext — the only time it is readable.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AdminKey' }
                  - type: object
                    properties:
                      api_key: { type: string, examples: [cad_YOUR_ADMIN_KEY] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/admin-keys/{id}:
    patch:
      operationId: updateAdminKey
      tags: [admin-keys]
      summary: Change a key's label, scopes, allowlist or active flag
      description: 'Scope: admin:manage. A body with no fields is a 400.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
                scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AdminScope' } }
                allowed_ips: { type: array, maxItems: 50, items: { type: string } }
                active: { type: boolean }
      responses:
        '200':
          description: The updated key.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/AdminKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokeAdminKey
      tags: [admin-keys]
      summary: Revoke an admin key
      description: >
        Scope: admin:manage. Mint and deploy the replacement first — a key that revokes the one
        it is authenticated with cannot undo it.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/AdminKey' }
