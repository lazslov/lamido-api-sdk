      operationId: createField
      tags: [admin-structure]
      summary: Create a field
      description: >
        Scope: sites:write. item_schema is REQUIRED for type list and REJECTED for every other
        type — a list with no schema has nothing to validate its entries against, and a schema on
        a scalar is meaningless. `type: "list"` inside an item_schema is rejected: lists do not
        nest.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      requestBody:
        required: true
        content:
          application/json:
