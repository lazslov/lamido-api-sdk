        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/sites:
    get:
      operationId: listSites
      tags: [admin-sites]
      summary: Sites, filterable
      description: 'Scope: sites:read. `external_ref` is indexed, so filtering by it is cheap. `paired=false` is the drill-down for `sites_without_external_ref`.'
      security: [{ adminKey: [] }]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: Free-text match on slug and name.
        - name: active
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
        - name: external_ref
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: paired
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: >
            Whether lamido-admin has paired the site. paired=false is the drill-down behind
            sites_without_external_ref on GET /v1/admin/health and binds the same predicate that
            count uses, including its active clause. NOT the same as external_ref=, which matches a
            VALUE and therefore cannot express absence.
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Sites.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Site' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createSite
      tags: [admin-sites]
      summary: Onboard a site and mint its key pair
      description: >
        Scope: sites:write. THE RESPONSE CONTAINS THE ONLY READABLE COPY OF TWO PLAINTEXT KEYS —
        do not log it. The site and its keys are created in one transaction, because a site
        without keys is a half-onboarded tenant somebody has to notice by hand. The slug is also
        the Blob prefix, so it is effectively immutable.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 1, maxLength: 200 }
                default_locale: { type: string, default: hu }
                locales:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                  description: Defaults to [default_locale], and MUST contain it.
                allowed_origins:
                  type: array
                  maxItems: 20
                  default: []
                  items: { type: string }
                  description: >
                    Origins, not URLs — scheme, host, optional port. No path, no trailing slash,
                    no wildcard; compared with ===. Empty means no browser access.
                external_ref:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >
                    The site's id in your own admin, and the webhook envelope's account_id.


                    NOTE: revalidate_url and revalidate_secret were REMOVED from this body. A site
                    may have several destinations, so one is created through
                    POST /v1/admin/sites/{id}/webhook-endpoints — which is also the only response
                    that ever shows a signing secret, and the secret is now generated by the
                    service rather than chosen by the caller.
                key_label: { type: string, minLength: 1, maxLength: 100, description: Defaults to the slug. }
      responses:
        '201':
          description: The site plus both plaintext keys — publishable first, then secret.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Site' }
                  - type: object
                    required: [keys]
                    properties:
                      keys:
                        type: array
                        items: { $ref: '#/components/schemas/MintedSiteKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/sites/{id}:
    get:
      operationId: getSite
      tags: [admin-sites]
      summary: Site, masked keys and structure counts in one payload
      description: 'Scope: sites:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Site' }
                  - type: object
                    properties:
                      keys: { type: array, items: { $ref: '#/components/schemas/SiteKey' } }
                      counts: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSite
      tags: [admin-sites]
      summary: Update a site
      description: >
        Scope: sites:write. A body with no fields is a 400. `locales` must still contain
        `default_locale` — checked against the stored row when only one of the two is sent.
        `active: true` reverses a soft delete.


        The revalidation fields are no longer accepted here — see the body description below.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                default_locale: { type: string }
                locales: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
                allowed_origins: { type: array, maxItems: 20, items: { type: string } }
                external_ref: { type: [string, 'null'] }
                active: { type: boolean }
              description: >
                revalidate_url and revalidate_secret were REMOVED. They are stripped as unknown
                fields, so a patch carrying ONLY them reduces to {} and is a 400 rather than a
                silent no-op — a body that quietly dropped a destination change is how a site ends
                up believing it is configured. Manage destinations through
                PATCH /v1/admin/webhook-endpoints/{publicId}.
      responses:
        '200':
          description: The updated site.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Site' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSite
      tags: [admin-sites]
      summary: Deactivate a site, or hard-delete an empty one
      description: >
        Scope: sites:write. WITHOUT hard=true this is a SOFT delete: active goes false, every key
        on the site starts answering 401, and every row stays — reversible with PATCH
        {"active": true}. WITH hard=true it refuses with a 409 while the site has any page,
        collection or asset, because content is not recreatable from anywhere else in this system.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - name: hard
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: Deactivated (the site) or deleted ({id, deleted}).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Site' }
                  - type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/sites/{id}/keys:
    get:
      operationId: listSiteKeys
      tags: [admin-sites]
      summary: A site's keys, masked
      description: 'Scope: sites:read. Hashes are never returned; key_last4 is how two keys are told apart.'
      security: [{ adminKey: [] }]
      parameters:
