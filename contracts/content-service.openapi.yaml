        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/sites/{id}/keys/{keyId}/rotate:
    post:
      operationId: rotateSiteKey
      tags: [admin-sites]
      summary: Replace a key's secret, keeping the row
      description: >
        Scope: sites:write. Same row, so the label, the audit history and every entry naming this
        key id survive; last_used_at resets and a revoked key becomes active again. THERE IS NO
