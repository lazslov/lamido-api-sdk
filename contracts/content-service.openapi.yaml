        key to the consumer before or with the rotation.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/keyIdPath' }
      responses:
        '201':
          description: The rotated key, with its new plaintext.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/MintedSiteKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/sites/{id}/keys/{keyId}:
    delete:
      operationId: revokeSiteKey
      tags: [admin-sites]
      summary: Soft-revoke a site key
      description: >
        Scope: sites:write. REFUSES the site's last active key of that kind with a 409: a site
        with no publishable key serves nothing to its website and one with no secret key cannot
        be edited. Mint the replacement first.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
