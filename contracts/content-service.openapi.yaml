      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      responses:
        '200':
          description: Fields in position order.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Field' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
