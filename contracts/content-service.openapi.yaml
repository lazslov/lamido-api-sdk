  # ── Transfer, revalidation, audit, stats (5) ─────────────────────────────
  /v1/admin/sites/{id}/export:
    get:
      operationId: exportSite
      tags: [admin-transfer]
      summary: The whole site as one document
      description: >
        Scope: content:read. Structure, values in every locale, collections with their items, and
        dataset DEFINITIONS. Records are never included — they have no backup but the database's
        own.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/ImportDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/sites/{id}/import:
    post:
      operationId: importSite
      tags: [admin-transfer]
      summary: Apply a site document
      description: >
        Scope: content:write. mode=merge (default) or replace — REPLACE DELETES THE SITE'S ENTIRE
        STRUCTURE AND CONTENT. Writes DRAFTS ONLY and never publishes, so it cannot change what
        visitors see by itself; but it overwrites unpublished drafts, and the next publish of a
        page carries everything it wrote live. On a merge, an omitted key on a MENTIONED section
        or field is a written null — keep structure and values in one document. Values are
        validated against each field's declared type and EVERY problem is reported at once.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [merge, replace], default: merge }
        - { $ref: '#/components/parameters/confirmQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDocument' }
      responses:
        '200':
          description: What the import created and updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/sites/{id}/revalidate:
    post:
      operationId: requestSiteRevalidation
      tags: [admin-ops]
      summary: Invalidate a whole site now — emits site.revalidation_requested
      description: >
        Scope: content:publish. Emits a `site.revalidation_requested` event, which is a NEW fact.


        THIS ROUTE'S MEANING NARROWED. It used to serve both "re-send that failed delivery" and
        "invalidate everything", and that conflation was a defect: it wrote a NEW event_id every
        time, against a published contract telling receivers to dedupe on exactly that id — so a
        "re-fired" publish arrived as an event the receiver had never seen. To re-send a failed
        delivery use POST /v1/admin/webhook-deliveries/{id}/redeliver, which keeps the same
        X-Event-Id.


        `slug` and `collection` are a NARROWING HINT carried as `data.site.scope`, not a target: the
        event is a fact about the site, and a receiver may invalidate everything regardless. Omit
        them and `scope` is null. No fabricated version is sent — the old route read the latest
        page_versions row, which made a hand-triggered call indistinguishable on the wire from a real
        publish.


        A site with no endpoint is NO LONGER a 409; the event is recorded regardless, so the honest
        answer is `queued: 0`. Throttled to 10/min per site, rejected BEFORE anything is written.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [page, collection_item], default: page }
                slug: { $ref: '#/components/schemas/Slug' }
                collection: { $ref: '#/components/schemas/Slug' }
      responses:
        '200':
          description: 'The event was recorded and queued. `queued: 0` is a normal answer.'
          content:
            application/json:
              schema:
                type: object
                required: [event_id, queued, scope]
                properties:
                  event_id:
                    type: string
                    format: uuid
                    description: The X-Event-Id every receiver will see.
                  queued:
                    type: integer
                    description: How many endpoints it was queued for. ZERO is normal, not an error.
                  scope:
                    type: [object, 'null']
                    description: What the operator narrowed to, or null for the whole site.
                    properties:
                      type: { type: string, enum: [page, collection_item] }
                      slug: { type: [string, 'null'] }
                      collection: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ── Webhooks: the fourteen-route surface, identical in every Lamido service ───
  #
  # The ONLY permitted variation across services is the tenant collection segment
  # (`sites` here; `merchants`, `clients`, `tenants` elsewhere). One lamido-admin
  # client and one screen drive all five, so a member or a route that exists only
  # here is paid for in that repository forever.

  /v1/admin/event-types:
    get:
      operationId: listEventTypes
      tags: [admin-webhooks]
      summary: The closed event catalogue, as data
      description: >
        Scope: webhooks:read. THE HIGHEST-LEVERAGE ROUTE ON THIS SURFACE. Build a trigger picker
        from it, never from a hardcoded array — otherwise every checkbox list in a consuming admin
        must be edited in another repository whenever any service adds an event, which means it will
        be wrong, silently, and the symptom is an operator who cannot subscribe to an event that
        exists.


        Served from the same in-code catalogue that validates `subscribed_events`, bounds what the
        emitter may send, and is asserted against the published conventions table — so the four
        cannot disagree. `webhook.ping` is reserved estate-wide, is in NO catalogue and is not
        subscribable.
      security: [{ adminKey: [] }]
      responses:
        '200':
          description: The five event types this service emits.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/EventTypeDescriptor' } }
                  next_cursor:
                    type: [string, 'null']
                    description: Always present, always null here — the set is small and static.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [admin-webhooks]
      summary: Every endpoint, across sites
      description: >
        Scope: webhooks:read. `event_type` is the TRIGGER-FIRST view — "on page.published, call these
        two endpoints" — which is the question an operator actually has. It is this relation read
        from the other side and is derived on read; the inverse is never stored, because two truths
        about one relation disagree.


        GOTCHA: the `event_type` and `signing_state` filters are applied IN MEMORY — `subscribed_events` is a jsonb
        array where null means "every type, including ones added later". So a page may come back
        SHORT of `limit` — recorded here rather than hidden, because a silently short page is how a
        client concludes it has reached the end.
      security: [{ adminKey: [] }]
      parameters:
        - name: enabled
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
        - name: event_type
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: signing_state
          in: query
          required: false
          description: >
            Applied IN MEMORY, like `event_type` — see the GOTCHA above. `missing` is the
            drill-down behind the `endpoints_without_secret` health count; `undecryptable`
            is the one to reach for after a `CREDENTIALS_ENC_KEY` rotation went wrong.
          schema: { type: string, enum: [ok, missing, undecryptable] }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Endpoints, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/sites/{id}/webhook-endpoints:
    get:
      operationId: listSiteWebhookEndpoints
      tags: [admin-webhooks]
      summary: One site's endpoints
      description: >
        Scope: webhooks:read. A 200 WITH AN EMPTY ARRAY when the site has none, never a 404 — over a
        collection, "receives no webhooks" is simply an empty collection, and 404ing it would make a
        client branch on a status to render a table with no rows. Not paginated: 20 is the ceiling.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      responses:
        '200':
          description: This site's endpoints, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } }
                  next_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createWebhookEndpoint
      tags: [admin-webhooks]
      summary: Add a destination — THE ONLY RESPONSE THAT SHOWS THE SIGNING SECRET
      description: >
        Scope: webhooks:write.


        CRITICAL: the response carries `signing_secret` and it is READABLE EXACTLY ONCE, here or from
        rotate-secret. Put it into the receiver's CONTENT_REVALIDATE_SECRET. Afterwards only
        secret_last4 and secret_fingerprint come back. A lost secret can only be ROTATED, never
        recovered — and rotating invalidates the old one immediately.


        The whole `whsec_…` string IS the HMAC key, prefix included. Do not strip it; Svix-signed
        feeds do, and this is the opposite rule.


        A site may hold 20 endpoints; the 21st is a 409 `code: endpoint_limit_reached`. There is no
        upsert — the site PATCH that used to set `revalidate_url` was REMOVED rather than redefined,
        because a route whose semantics silently changed is worse than one that rejects the field.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 500
                  description: >
                    HTTPS ONLY, port 443, no credentials, no fragment, and every resolved A/AAAA
                    record must be a public address. Validated here AND again at every delivery,
                    because DNS can be re-pointed in between. An unresolvable host FAILS CLOSED.
                description: { type: [string, 'null'], minLength: 1, maxLength: 200 }
                subscribed_events:
                  type: [array, 'null']
                  minItems: 1
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 100 }
                  description: >
                    null (the default) means EVERY type in the catalogue, including ones added later.
                    AN EMPTY ARRAY IS A 400, never "none" — "subscribed to nothing" and "not
                    configured" are different states, and a configured destination that silently
                    receives no traffic is indistinguishable from a broken one. Use disable instead.
                contract_version:
                  type: integer
                  minimum: 1
                  description: >
                    Pinned at creation and deliberately ABSENT from the PATCH: moving a live endpoint
                    between envelope versions changes the bytes its receiver verifies, which is a new
                    endpoint rather than an edit. Defaults to the latest.
                include_record_values:
                  type: boolean
                  default: false
                  description: >
                    Whether record.created carries the record's field VALUES. OFF BY DEFAULT — a
                    record on a donor dataset is a name, an email address, an amount and a message
                    from a real person, and a webhook body lands in the receiver's request log, their
                    log drain, any proxy between us, and a support ticket. Turning it on writes an
                    audit row naming the acting key; turning it off writes another.
      responses:
        '201':
          description: The endpoint, plus the plaintext secret ONCE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedEndpointSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/webhook-endpoints/{publicId}:
    get:
      operationId: getWebhookEndpoint
      tags: [admin-webhooks]
      summary: One endpoint
      description: 'Scope: webhooks:read. The signing secret is never here.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchWebhookEndpoint
      tags: [admin-webhooks]
      summary: Change an endpoint's configuration
      description: >
        Scope: webhooks:write.


        A PATCH DOES NOT RE-ENABLE and does not clear consecutive_failures. Bundling "the destination
        is good now" into every field change meant that fixing a typo in a URL silently re-armed an
        endpoint auto-disabled a week earlier, and the operator had no idea. POST …/enable says that,
        and says only that.


        The audit entry records WHICH FIELDS CHANGED, not their values — with one exception:
        include_record_values is audited BY VALUE, because "an operator turned donor values on" is
        precisely what has to be recoverable later.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                url: { type: string, format: uri, maxLength: 500 }
                description: { type: [string, 'null'], minLength: 1, maxLength: 200 }
                subscribed_events:
                  type: [array, 'null']
                  minItems: 1
                  maxItems: 50
                  items: { type: string, minLength: 1, maxLength: 100 }
                include_record_values: { type: boolean }
      responses:
        '200':
          description: The endpoint as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteWebhookEndpoint
      tags: [admin-webhooks]
      summary: Remove a destination
      description: >
        Scope: webhooks:write. Takes its pending deliveries with it and LEAVES EVERY EVENT. An event
        is a fact about a publish that deleting a URL cannot un-happen, and an operator asking "what
        did we emit last Tuesday" must get the same answer before and after this call. That asymmetry
        is why events and deliveries are two tables.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      responses:
        '200':
          description: Confirmation, plus how many queued deliveries went with it.
          content:
            application/json:
              schema:
                type: object
                required: [public_id, deleted]
                properties:
                  public_id: { type: string, format: uuid }
                  deleted: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/webhook-endpoints/{publicId}/rotate-secret:
    post:
      operationId: rotateWebhookEndpointSecret
      tags: [admin-webhooks]
      summary: Mint new key material — returned ONCE
      description: >
        Scope: webhooks:write. Returns the plaintext once, like a create. THE PREVIOUS SECRET STOPS
        WORKING IMMEDIATELY, which is why this is a route of its own rather than a flag on the
        patch: it must not be reachable by an operator who thought they were editing a URL.


        Clears consecutive_failures and RE-ENABLES the endpoint — an operator rotating is about to
        hand the receiver a working secret, and leaving the counter one dead-letter from the threshold
        would disable it on its next hiccup.


        THIS IS ALSO HOW THE MIGRATION COMPLETES. An endpoint carried over from the old
        sites.revalidate_url has no secret and is disabled; rotating mints one and enables it. Other
        endpoints of the same site are untouched — that is the entire point of per-endpoint secrets.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      responses:
        '200':
          description: The endpoint, plus the new plaintext secret ONCE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedEndpointSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/webhook-endpoints/{publicId}/enable:
    post:
      operationId: enableWebhookEndpoint
      tags: [admin-webhooks]
      summary: Clear a disable
      description: >
        Scope: webhooks:write. Resets consecutive_failures as well as the flag — leaving the counter
        one dead-letter below the threshold would disable the endpoint again on its next hiccup, which
        reads to an operator as "the enable button does not work".


        REFUSED WITH A 409 (`code: secret_missing`) while the endpoint has no signing secret, rather
        than enabling one that would fail every attempt. Rotating the secret is what enables such an
        endpoint, and it says so in disabled_reason.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      responses:
        '200':
          description: The endpoint, enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/webhook-endpoints/{publicId}/disable:
    post:
      operationId: disableWebhookEndpoint
      tags: [admin-webhooks]
      summary: Stop delivering to an endpoint
      description: >
        Scope: webhooks:write. THE CORRECT WAY to say "this endpoint should receive nothing" — which
        is why `subscribed_events: []` is a 400 rather than a synonym for it. A disabled endpoint
        keeps its URL, its secret and its history; an endpoint subscribed to nothing looks configured
        and is silently dead.


        Always records a reason, defaulted rather than left null, so a non-null disabled_reason never
        has to be read as "auto-disabled, reason lost".
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: The endpoint, disabled, with a reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/webhook-endpoints/{publicId}/test:
    post:
      operationId: testWebhookEndpoint
      tags: [admin-webhooks]
      summary: Deliver a signed webhook.ping now, synchronously
      description: >
        Scope: webhooks:write. USE THIS BEFORE ANYTHING IS LIVE, AND AFTER EVERY ROTATION. Without
        it the only way to prove a URL and a secret are right is to cause a real publish — and the
        operator configuring an endpoint is usually not the person who can publish on a live website.
        Every misconfiguration then surfaces as a dead-letter hours later, attached to a real publish
        that was ALSO lost.


        Bypasses subscribed_events and the ladder, and writes NO EVENT ROW AND NO DELIVERY ROW: a
        probe is not a fact about a page, and counting a failed probe would put configuration noise
        in the number that means "a website was not told". It never touches consecutive_failures.


        Shares the envelope, the renderer, the signature, the URL guard, the timeout, the redirect
        rule and the excerpt cap with production — a test button that exercises its own copy of the
        delivery path proves only that the copy works.


        Answers 200 WHATEVER THE RECEIVER SAID; `ok` is the result. An endpoint with no secret is a
        409 `code: secret_missing`.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/endpointPublicIdPath' }
      responses:
        '200':
          description: What the probe found. 200 even when the receiver refused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookPingOutcome' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/webhook-events:
    get:
      operationId: listWebhookEvents
      tags: [admin-webhooks]
      summary: The outbox — what we say we emitted, and exactly what we sent
      description: >
        Scope: webhooks:read. REPLACES GET /v1/admin/revalidations. Answers the one question no other
        list can: "we say we emitted it — what exactly did we send?" The delivery list says what
        happened to it afterwards, and the two are separate because an event emitted for a site with
        no endpoint has NO delivery row and must still be findable.


        EVERY EVENT IS HERE, including ones with no destination — and unlike the old outbox this
        write is INSIDE the publish transaction, so it is a reconcilable ledger rather than
        near-complete evidence. A rolled-back publish leaves no row; a committed one leaves exactly
        one, even if the process was killed before any HTTP attempt.


        correlation_id is THE CROSS-SERVICE QUERY: one value returns everything one publish caused,
        here and against a sibling service's copy of this route.


        GOTCHA: `payload` is what we STORED, not necessarily what a given endpoint RECEIVED.
        include_record_values is applied per endpoint at delivery time and contract_version renders
        per endpoint, so two receivers can legitimately have been sent different bytes for one row.
      security: [{ adminKey: [] }]
      parameters:
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: event_type
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: correlation_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Everything one causal chain produced, across every service that carries the id.
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/untilQuery' }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Events, newest first. NO total.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WebhookEvent' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [admin-webhooks]
      summary: The delivery queue — the drill-down behind the health strip
      description: >
        Scope: webhooks:read. Shares its predicates with the health counts BY CONSTRUCTION:
        `?status=dead_lettered` is the same condition dead_lettered_deliveries counts, because both
        bind one exported SQL fragment rather than two independently written queries. That is the fix
        the old failed_revalidations needed — it and its drill-down were separate queries over
        separate tables with different windows, so they could disagree.


        `status` defaults to `all` DELIBERATELY: an operator arrives here from a health count, and
        defaulting to pending would show them a different set than the one they clicked.
      security: [{ adminKey: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, pending, delivered, dead_lettered], default: all }
        - name: endpoint
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: An endpoint's public_id.
        - name: event_type
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Deliveries, newest first. NO total.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/webhook-deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliverWebhookDelivery
      tags: [admin-webhooks]
      summary: Send that delivery again — SAME event id
      description: >
        Scope: webhooks:write. THIS RESETS THE EXISTING ROW AND KEEPS THE EVENT ID.


        `unique(event_id, endpoint_id)` makes a second row for one event IMPOSSIBLE TO INSERT, so
        "a new attempt with the same X-Event-Id" is enforced by the schema rather than by this
        handler remembering. The receiver is entitled to recognise the event and skip it — which is
        exactly what finally makes the documented dedupe key honest. Before this split, re-firing
        wrote a NEW event_id while the docs told receivers to dedupe on it, so a "re-fired" publish
        arrived as an event the receiver had never seen and was processed as new.


        X-Delivery-Id IS regenerated, because it identifies one HTTP request and the receiver is
        about to get a different one. `attempt` goes back to 1, so a redelivered dead-letter gets the
        whole ladder again: an operator redelivering has usually just fixed something, and one
        attempt before dead-lettering again would waste the fix.


        It DELIVERS INLINE and answers with the row re-read AFTER the attempt, so status is already
        delivered with the receiver response_status, or pending at attempt 2 with the error. It also
        IGNORES next_attempt_at, which is what makes it the tool for one delivery an operator is
        actively fixing; db:webhooks-drain is the tool for a backlog, and it honours the ladder. See
        website-api.md#delivery-guarantees.


        Use POST /v1/admin/sites/{id}/revalidate instead when the intent is "invalidate everything",
        which is a genuinely new fact.
      security: [{ adminKey: [] }]
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The delivery_id from the delivery list — NOT the event id.
      responses:
        '200':
          description: The delivery, reset to pending with a new delivery_id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The endpoint is disabled (`code: endpoint_disabled`) or has no signing secret
            (`code: secret_missing`) — either would make the redelivery fail on arrival.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/admin/audit:
    get:
      operationId: listAudit
      tags: [admin-ops]
      summary: The append-only write trail
      description: >
        Scope: audit:read. Newest first. There is deliberately no write and no delete endpoint.
        The target_type+target_id pair and action+date-window are index-served; filtering on
        anything else is a scan. metadata is an ALLOWLISTED summary per action — never a raw body,
        never a plaintext key, never a record's values.
      security: [{ adminKey: [] }]
      parameters:
        - name: actor_type
          in: query
          required: false
          schema: { type: string, enum: [admin_key, client_key, system] }
          description: Both writing tiers land in one trail, so "which tier did this" is a real filter.
        - name: actor_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: target_type
          in: query
          required: false
          schema: { type: string, enum: [site, site_key, page, section, field, collection, collection_item, asset, dataset, record, admin_key] }
        - name: target_id
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: request_id
          in: query
          required: false
          description: >
            Joins the trail to the log lines of the request that wrote it — the value of the
            `X-Request-Id` header on that call.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/untilQuery' }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  next_cursor:
                    type: [string, 'null']
                    description: >
                      Opaque cursor for the next page, or null on the last (or only) page. ALWAYS
                      present — null, never absent, so one pager terminates correctly everywhere.
                      These lists carry NO total: counting a filtered, unbounded table on every
                      page is not cheap, and the pager terminates on this field instead.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/stats/overview:
    get:
      operationId: getStatsOverview
      tags: [admin-ops]
      summary: Size-of-the-world counters
      description: >
        Scope: stats:read, and NOT sites:read as it was before 1372230 — these are unfiltered
        rollups over every tenant, so the scope that reads one site must not report the size of
        the fleet. Publishes in the window are counted from page_versions, which IS the publish
        record.
      security: [{ adminKey: [] }]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Counters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
