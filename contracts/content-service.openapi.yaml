              properties:
                pathname: { type: string, minLength: 1, maxLength: 500 }
                url: { type: string, format: uri, maxLength: 1000 }
                contentType: { $ref: '#/components/schemas/ImageContentType' }
                size: { type: integer, minimum: 1, maximum: 15728640 }
                width: { type: integer, minimum: 1, maximum: 100000 }
                height: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        '201':
          description: The registered asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/assets:
    get:
      operationId: listAdminAssets
      tags: [admin-assets]
      summary: The image library, across every site or one
      description: 'Scope: assets:read. Omitting siteId lists EVERY site — this key is cross-tenant.'
      security: [{ adminKey: [] }]
      parameters:
        - name: siteId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Assets, newest first, each with a live reference count.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/assets/orphans:
    get:
      operationId: listOrphanAssets
      tags: [admin-assets]
      summary: Assets nothing refers to
      description: >
        Scope: assets:read. Shares its exact predicate with the orphanAssets count on
        GET /api/admin/health, so the number and this list are the same set by construction. The
        response echoes back the cutoff it applied, so a list can be matched to the count that
        prompted it. olderThan is in HOURS (default 24, so a just-uploaded image is not garbage);
        0 reports everything unreferenced right now.
      security: [{ adminKey: [] }]
      parameters:
        - name: siteId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: olderThan
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 8760, default: 24 }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Orphans, with the applied cutoff.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  olderThan: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/assets/{id}:
    delete:
      operationId: deleteAdminAsset
      tags: [admin-assets]
      summary: Delete an asset, with an operator override
      description: >
        Scope: assets:write. force=true skips the reference check AND NOTHING ELSE — it is for an
        asset whose references are themselves broken, never a convenience: forcing it blanks an
        image on a live site. The forced delete is audited as forced.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/assetId' }
        - { $ref: '#/components/parameters/forceQuery' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Admin datasets and records (8) ───────────────────────────────────────
  /api/admin/sites/{id}/datasets:
    get:
      operationId: listSiteDatasets
      tags: [admin-datasets]
      summary: A site's dataset definitions
      description: 'Scope: datasets:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      responses:
        '200':
          description: Datasets with record counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Dataset' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createDataset
      tags: [admin-datasets]
      summary: Provision a dataset
      description: >
        Scope: datasets:write. A new kind of client data costs one call and NO DEPLOY. Cross-field
        rules, each a 400: summable only on a number field, sensitive may NEVER be groupable, and
        a ref.collection must be a collection that already exists on this site. Setting
        publicAggregate true makes every groupable field's values publicly enumerable through
        group keys.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name, recordSchema]
              properties:
                key: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 1, maxLength: 200 }
                recordSchema: { $ref: '#/components/schemas/RecordSchema' }
                publicAggregate: { type: boolean, default: false }
                retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
                position: { type: integer, minimum: 0, maximum: 9999 }
            examples:
              donations:
                value:
                  key: donations
                  name: Adományok
                  publicAggregate: true
                  recordSchema:
                    - { key: amountForint, type: number, required: true, summable: true, integer: true, min: 1 }
                    - { key: beneficiaryId, type: ref, groupable: true, ref: { collection: beneficiaries, policy: store } }
                    - { key: donorName, type: text, sensitive: true, maxLength: 200 }
      responses:
        '201':
          description: The dataset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/datasets/{id}:
    get:
      operationId: getDataset
      tags: [admin-datasets]
      summary: One dataset definition
      description: 'Scope: datasets:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDataset
      tags: [admin-datasets]
      summary: Update a dataset definition
      description: >
        Scope: datasets:write. Existing records are NOT re-validated against a changed schema —
        tightening a rule affects future writes only. retentionDays null clears the window back
        to keep-forever.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                key: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 1, maxLength: 200 }
                recordSchema: { $ref: '#/components/schemas/RecordSchema' }
                publicAggregate: { type: boolean }
                retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
                position: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '200':
          description: The updated dataset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteDataset
      tags: [admin-datasets]
      summary: Delete a dataset AND ALL ITS RECORDS
      description: >
        Scope: datasets:write, and confirm=true is required. NOTHING IN THIS SYSTEM CAN RESTORE
        THE RECORDS — a site export carries dataset definitions and no records, so the database's
        own backup is the only copy.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/confirmQuery' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/datasets/{id}/records:
    get:
      operationId: listAdminRecords
      tags: [admin-datasets]
      summary: Records of one dataset, for support
      description: >
        Scope: records:read — a SEPARATE scope from datasets:read, because records may hold donor
        PII while a definition is only structure. THERE IS DELIBERATELY NO INSERT ON THIS TIER:
        records are written by the system that owns the event, and a staff-created donation with
        no payment behind it is a data-integrity bug wearing a helpful face. Sensitive values are
        withheld here.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/eqQuery' }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/toQuery' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Records, newest event first.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Record' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/datasets/{id}/records/{recordId}:
    get:
      operationId: getAdminRecord
      tags: [admin-datasets]
      summary: One record, optionally including sensitive values
      description: >
        Scope: records:read. include=sensitive is AUDITED here too (record.read_sensitive), and
        for the stronger reason: a cad_ key reaches every site.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/recordIdPath' }
        - { $ref: '#/components/parameters/includeSensitiveQuery' }
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Record' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAdminRecord
      tags: [admin-datasets]
      summary: Delete a record
      description: 'Scope: records:write. Hard delete, audited. There is no archive for a record.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/recordIdPath' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Admin content mirrors (15) ───────────────────────────────────────────
  # Two-line handlers over the SAME functions the client tier calls, with the
  # same arguments. Behaviour is identical by construction; see client-api.md.
  /api/admin/sites/{id}/rendered/pages/{slug}:
    get:
      operationId: getAdminRenderedPage
      tags: [admin-content]
      summary: A page document in either view, for any site
      description: 'Scope: content:read. The client-tier twin of GET /api/client/rendered/pages/{slug}.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/viewQuery' }
        - { $ref: '#/components/parameters/localeQuery' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/pages/{slug}/values:
    patch:
      operationId: setAdminDraftValues
      tags: [admin-content]
      summary: Save draft values for any site
      description: >
        Scope: content:write. Identical semantics to the client tier, including the unknown-key
        400 — see client-api.md.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                locale: { type: string }
                values:
                  type: object
                  minProperties: 1
                  maxProperties: 500
                  additionalProperties: { $ref: '#/components/schemas/ContentValue' }
      responses:
        '200':
          description: The updated draft document.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/pages/{slug}/publish:
    post:
      operationId: publishAdminPage
      tags: [admin-content]
      summary: Publish a page of any site
      description: >
        Scope: content:publish — DELIBERATELY SEPARATE from content:write, so a key can stage
        every change on a site and make none of it live. Publishes the whole page, including
        drafts someone else left.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/sites/{id}/pages/{slug}/revert:
    post:
      operationId: revertAdminPage
      tags: [admin-content]
      summary: Discard a page's drafts, for any site
      description: 'Scope: content:write. No version row — nothing went live.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string }
      responses:
        '200':
          description: Reverted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/pages/{slug}/versions:
    get:
      operationId: listAdminPageVersions
      tags: [admin-content]
      summary: A page's publish history, for any site
      description: 'Scope: content:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Version summaries, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/pages/{slug}/versions/{version}:
    get:
      operationId: getAdminPageVersion
      tags: [admin-content]
      summary: One frozen snapshot, for any site
      description: 'Scope: content:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/versionNumber' }
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Version' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/pages/{slug}/versions/{version}/restore:
    post:
      operationId: restoreAdminPageVersion
      tags: [admin-content]
      summary: Restore a version into the draft, for any site
      description: >
        Scope: content:write — NOT content:publish, because a restore writes the draft and
        changes nothing a visitor sees. `skipped` still has to be surfaced.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/pageSlug' }
        - { $ref: '#/components/parameters/versionNumber' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string }
      responses:
        '200':
          description: Restored into the draft.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/collections/{key}/items:
    get:
      operationId: listAdminItems
      tags: [admin-content]
      summary: Items of a collection, for any site
      description: 'Scope: content:read. `view` defaults to draft, as on the client tier.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemStatusQuery' }
        - { $ref: '#/components/parameters/itemViewQuery' }
        - { $ref: '#/components/parameters/localeQuery' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAdminItem
      tags: [admin-content]
      summary: Create an item, for any site
      description: 'Scope: content:write. Always born a draft.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                position: { type: integer, minimum: 0, maximum: 9999 }
                locale: { type: string }
                values: { type: object, additionalProperties: { $ref: '#/components/schemas/ContentValue' } }
      responses:
        '201':
          description: The created item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/sites/{id}/collections/{key}/items/reorder:
    post:
      operationId: reorderAdminItems
      tags: [admin-content]
      summary: Set the complete item order, for any site
      description: 'Scope: content:write. The complete set, or a 400.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/collections/{key}/items/{itemId}:
    get:
      operationId: getAdminItem
      tags: [admin-content]
      summary: One item, for any site
      description: 'Scope: content:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemIdPath' }
        - { $ref: '#/components/parameters/itemViewQuery' }
        - { $ref: '#/components/parameters/localeQuery' }
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAdminItem
      tags: [admin-content]
      summary: Partially update an item, for any site
      description: 'Scope: content:write. Values merge; a null slug clears it.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                slug:
                  oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }]
                position: { type: integer, minimum: 0, maximum: 9999 }
                locale: { type: string }
                values: { type: object, additionalProperties: { $ref: '#/components/schemas/ContentValue' } }
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteAdminItem
      tags: [admin-content]
      summary: Hard-delete an item, for any site
      description: >
        Scope: content:write. Reference-counted against dataset records; force=true leaves them
        dangling and is audited as forced. Archive is the everyday path.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemIdPath' }
        - { $ref: '#/components/parameters/forceQuery' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/sites/{id}/collections/{key}/items/{itemId}/publish:
    post:
      operationId: publishAdminItem
      tags: [admin-content]
      summary: Publish an item, for any site
      description: 'Scope: content:publish. Fires the revalidation webhook. Un-archives an archived item.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemIdPath' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string }
      responses:
        '200':
          description: The published item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/sites/{id}/collections/{key}/items/{itemId}/archive:
    post:
      operationId: archiveAdminItem
      tags: [admin-content]
      summary: Archive an item, for any site
      description: 'Scope: content:write. Off the website, recoverable, keeps its dataset records.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - { $ref: '#/components/parameters/collectionKey' }
        - { $ref: '#/components/parameters/itemIdPath' }
      responses:
        '200':
          description: The archived item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Transfer, revalidation, audit, stats (5) ─────────────────────────────
  /api/admin/sites/{id}/export:
    get:
      operationId: exportSite
      tags: [admin-transfer]
      summary: The whole site as one document
      description: >
        Scope: content:read. Structure, values in every locale, collections with their items, and
        dataset DEFINITIONS. Records are never included — they have no backup but the database's
        own.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ImportDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/sites/{id}/import:
    post:
      operationId: importSite
      tags: [admin-transfer]
      summary: Apply a site document
      description: >
        Scope: content:write. mode=merge (default) or replace — REPLACE DELETES THE SITE'S ENTIRE
        STRUCTURE AND CONTENT. Writes DRAFTS ONLY and never publishes, so it cannot change what
        visitors see by itself; but it overwrites unpublished drafts, and the next publish of a
        page carries everything it wrote live. On a merge, an omitted key on a MENTIONED section
        or field is a written null — keep structure and values in one document. Values are
        validated against each field's declared type and EVERY problem is reported at once.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [merge, replace], default: merge }
        - { $ref: '#/components/parameters/confirmQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDocument' }
      responses:
        '200':
          description: What the import created and updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/sites/{id}/revalidate:
    post:
      operationId: refireRevalidation
      tags: [admin-ops]
      summary: Re-fire the revalidation webhook by hand
      description: >
        Scope: content:publish. Every field is optional; a bodyless POST re-sends "revalidate
        everything", which is what a receiver should read an absent slug as. `collection` is
        REQUIRED when type is collection_item. Use it after failedRevalidations moves on
        GET /api/admin/health.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [page, collection_item], default: page }
                slug: { $ref: '#/components/schemas/Slug' }
                collection: { $ref: '#/components/schemas/Slug' }
      responses:
        '200':
          description: The delivery outcome — delivered, skipped, status, attempts, reason.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/audit:
    get:
      operationId: listAudit
      tags: [admin-ops]
      summary: The append-only write trail
      description: >
        Scope: audit:read. Newest first. There is deliberately no write and no delete endpoint.
        The targetType+targetId pair and action+date-window are index-served; filtering on
        anything else is a scan. metadata is an ALLOWLISTED summary per action — never a raw body,
        never a plaintext key, never a record's values.
      security: [{ adminKey: [] }]
      parameters:
        - name: actorType
          in: query
          required: false
          schema: { type: string, enum: [admin_key, client_key, system] }
          description: Both writing tiers land in one trail, so "which tier did this" is a real filter.
        - name: actorId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: targetType
          in: query
          required: false
          schema: { type: string, enum: [site, site_key, page, section, field, collection, collection_item, asset, dataset, record, admin_key] }
        - name: targetId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/toQuery' }
        - { $ref: '#/components/parameters/limitQuery' }
        - { $ref: '#/components/parameters/offsetQuery' }
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/stats/overview:
    get:
      operationId: getStatsOverview
      tags: [admin-ops]
      summary: Size-of-the-world counters
      description: >
        Scope: sites:read. Unfiltered rollups, plus publishes in the window — counted from
        page_versions, which IS the publish record.
      security: [{ adminKey: [] }]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Counters.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
