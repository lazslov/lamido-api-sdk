  /v1/admin/sites/{id}/pages/{slug}/publish:
    post:
      operationId: publishAdminPage
      tags: [admin-content]
      summary: Publish a page of any site
      description: >
        Scope: content:publish — DELIBERATELY SEPARATE from content:write, so a key can stage
        every change on a site and make none of it live. Publishes the whole page, including
