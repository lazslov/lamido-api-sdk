        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pathname, url, content_type, size]
              properties:
                pathname: { type: string, minLength: 1, maxLength: 500 }
                url: { type: string, format: uri, maxLength: 1000 }
                content_type: { $ref: '#/components/schemas/ImageContentType' }
                size: { type: integer, minimum: 1, maximum: 15728640 }
                width: { type: integer, minimum: 1, maximum: 100000 }
                height: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        '201':
          description: The registered asset.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/assets:
    get:
      operationId: listAdminAssets
      tags: [admin-assets]
      summary: The image library, across every site or one
      description: 'Scope: assets:read. Omitting site_id lists EVERY site — this key is cross-tenant.'
      security: [{ adminKey: [] }]
      parameters:
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Assets, newest first, each with a live reference count.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  next_cursor:
                    type: [string, 'null']
                    description: >
                      Opaque cursor for the next page, or null on the last (or only) page. ALWAYS
                      present — null, never absent, so one pager terminates correctly everywhere.
                      These lists carry NO total: counting a filtered, unbounded table on every
                      page is not cheap, and the pager terminates on this field instead.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/assets/orphans:
    get:
      operationId: listOrphanAssets
      tags: [admin-assets]
      summary: Assets nothing refers to
      description: >
        Scope: assets:read. Shares its exact predicate with the orphan_assets count on
        GET /v1/admin/health, so the number and this list are the same set by construction. The
        response echoes back the cutoff it applied, so a list can be matched to the count that
        prompted it. older_than is in HOURS (default 24, so a just-uploaded image is not garbage);
        0 reports everything unreferenced right now.
      security: [{ adminKey: [] }]
      parameters:
        - name: site_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: older_than
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 8760, default: 24 }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Orphans, with the applied cutoff.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  next_cursor:
                    type: [string, 'null']
                    description: >
                      Opaque cursor for the next page, or null on the last (or only) page. ALWAYS
                      present — null, never absent, so one pager terminates correctly everywhere.
                      These lists carry NO total: counting a filtered, unbounded table on every
                      page is not cheap, and the pager terminates on this field instead.
                  older_than: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/assets/{id}:
    delete:
      operationId: deleteAdminAsset
      tags: [admin-assets]
      summary: Delete an asset, with an operator override
      description: >
        Scope: assets:write. force=true skips the reference check AND NOTHING ELSE — it is for an
        asset whose references are themselves broken, never a convenience: forcing it blanks an
        image on a live site. The forced delete is audited as forced.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/assetId' }
        - { $ref: '#/components/parameters/forceQuery' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Admin datasets and records (8) ───────────────────────────────────────
  /v1/admin/sites/{id}/datasets:
    get:
      operationId: listSiteDatasets
      tags: [admin-datasets]
      summary: A site's dataset definitions
      description: 'Scope: datasets:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      responses:
        '200':
          description: Datasets with record counts.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Dataset' } }
                  next_cursor:
                    type: 'null'
                    description: >
                      ALWAYS PRESENT AND ALWAYS NULL on this list, which does not use
                      cursors. The key is here so that one pager reads `body.next_cursor` on every list
                      in the service and gets null rather than undefined — see conventions.md §3.
                  total:
                    type: integer
                    description: >
                      Row count, always present. Equals `data.length` here, because this
                      list is not paginated and returns every row.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createDataset
      tags: [admin-datasets]
      summary: Provision a dataset
      description: >
        Scope: datasets:write. A new kind of client data costs one call and NO DEPLOY. Cross-field
        rules, each a 400: summable only on a number field, sensitive may NEVER be groupable,
        publicly_enumerable REQUIRES groupable and may never sit on a sensitive field, and a
        ref.collection must be a collection that already exists on this site. Setting
        public_aggregate true publishes the dataset TOTALS; a field's values reach the public
        tier only through that field's own publicly_enumerable flag, and granting it is audited
        and alerted.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/siteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name, record_schema]
              properties:
                key: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 1, maxLength: 200 }
                record_schema: { $ref: '#/components/schemas/RecordSchema' }
                public_aggregate: { type: boolean, default: false }
                retention_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
                position: { type: integer, minimum: 0, maximum: 9999 }
            examples:
              donations:
                value:
                  key: donations
                  name: Adományok
                  public_aggregate: true
                  record_schema:
                    - { key: amountForint, type: number, required: true, summable: true, integer: true, min: 1 }
                    - { key: beneficiaryId, type: ref, groupable: true, ref: { collection: beneficiaries, policy: store } }
                    - { key: donorName, type: text, sensitive: true, maxLength: 200 }
      responses:
        '201':
          description: The dataset.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/datasets/{id}:
    get:
      operationId: getDataset
      tags: [admin-datasets]
      summary: One dataset definition
      description: 'Scope: datasets:read.'
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      responses:
        '200':
          description: The dataset.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateDataset
      tags: [admin-datasets]
      summary: Update a dataset definition
      description: >
        Scope: datasets:write. Existing records are NOT re-validated against a changed schema —
        tightening a rule affects future writes only. retention_days null clears the window back
        to keep-forever.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                key: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 1, maxLength: 200 }
                record_schema: { $ref: '#/components/schemas/RecordSchema' }
                public_aggregate: { type: boolean }
                retention_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
                position: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '200':
          description: The updated dataset.
