        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteDataset
      tags: [admin-datasets]
      summary: Delete a dataset AND ALL ITS RECORDS
      description: >
        Scope: datasets:write, and confirm=true is required. NOTHING IN THIS SYSTEM CAN RESTORE
        THE RECORDS — a site export carries dataset definitions and no records, so the database's
        own backup is the only copy.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/confirmQuery' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/datasets/{id}/records:
    get:
      operationId: listAdminRecords
      tags: [admin-datasets]
      summary: Records of one dataset, for support
      description: >
        Scope: records:read — a SEPARATE scope from datasets:read, because records may hold donor
        PII while a definition is only structure. THERE IS DELIBERATELY NO INSERT ON THIS TIER:
        records are written by the system that owns the event, and a staff-created donation with
        no payment behind it is a data-integrity bug wearing a helpful face. Sensitive values are
        withheld here.
      security: [{ adminKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/resourceId' }
        - { $ref: '#/components/parameters/eqQuery' }
        - { $ref: '#/components/parameters/fromQuery' }
        - { $ref: '#/components/parameters/untilQuery' }
        - { $ref: '#/components/parameters/keysetLimitQuery' }
        - { $ref: '#/components/parameters/cursorQuery' }
      responses:
        '200':
          description: Records, newest event first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Record' } }
                  next_cursor:
                    type: [string, 'null']
                    description: >
                      Opaque cursor for the next page, or null on the last (or only) page. ALWAYS
                      present — null, never absent, so one pager terminates correctly everywhere.
                      These lists carry NO total: counting a filtered, unbounded table on every
                      page is not cheap, and the pager terminates on this field instead.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/datasets/{id}/records/{recordId}:
