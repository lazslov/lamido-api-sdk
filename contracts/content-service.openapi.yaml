                type: { $ref: '#/components/schemas/FieldType' }
                label: { type: string, minLength: 1, maxLength: 200 }
                required: { type: boolean, default: false, description: Enforced at publish, not at save. }
                itemSchema: { $ref: '#/components/schemas/ItemSchema' }
                position: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '201':
          description: The field.
