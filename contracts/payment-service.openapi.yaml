openapi: 3.1.0

# ---------------------------------------------------------------------------
# This spec is the authority on SHAPES. The Markdown in this folder is the
# authority on BEHAVIOUR. Where they disagree, the Markdown wins and this file
# is the bug — fix it here.
#
# Every path below is registered in src/app.ts, and a test
# (src/__tests__/docs/openapi.test.ts) compares the two lists in both
# directions, so a route without an operation and an operation without a route
# both fail the build.
# ---------------------------------------------------------------------------

info:
  title: payment-service
  version: 0.1.0
  summary: Multi-merchant payment broker for Stripe and Barion.
  description: |
    Lamido's client websites integrate against one uniform REST API; this service talks to
    **Stripe** or **Barion** using each merchant's own credentials.

    Three surfaces, three credentials:

    | Surface | Prefix | Auth |
    |---|---|---|
    | Merchant | `/v1/*` | `Authorization: Bearer pmk_…` |
    | Admin | `/admin/*` | `Authorization: Bearer pad_…` plus scopes |
    | Provider callback | `/v1/providers/*` | none (Barion) / HMAC (Stripe) — **not for you to call** |

    **HUF has zero minor units in this API.** `"1000"` HUF means 1000 Ft, not 10.00 Ft.
    This deviates from ISO 4217 deliberately. EUR is 2-decimal, so `"1000"` EUR is €10.00.
    Every amount is a decimal string of minor units, never a JSON number, because JSON
    numbers lose precision above 2^53.

    Errors are RFC 7807 Problem Details on every surface, served as
    `application/problem+json`. Branch on `type`, never on `title` or `detail`.
  license:
    name: UNLICENSED
  x-docs:
    merchant: merchant-api.md
    admin: admin-api.md
    runbook: runbook.md

servers:
  # The deployment host is deliberately absent from this pinned copy. No host ships in
  # a tarball, and contracts/ is one `files` mistake away from being published — see
  # docs/plans/phase-1-foundations.md §4. The consuming project supplies the base URL
  # from its own environment; the SDK has no fallback.
  - url: "{baseUrl}"
    description: Supplied by the consuming project from its own environment.
    variables:
      baseUrl:
        default: https://payment.example.com
        description: Documentation placeholder, not a usable default.

tags:
  - name: Merchant payments
    description: Create and read payments with a `pmk_` key.
  - name: Merchant refunds
    description: Refund payments with a `pmk_` key.
  - name: Merchant webhooks
    description: A merchant's own outbound-delivery queue.
  - name: Provider callbacks
    description: Inbound PSP traffic. Documented so the URLs are unambiguous; never called by an integrator.
  - name: Observability
    description: Public liveness.
  - name: Admin self
  - name: Admin merchants
  - name: Admin credentials
  - name: Admin payments
  - name: Admin refunds
  - name: Admin webhooks
  - name: Admin stats
  - name: Admin keys
  - name: Admin audit
  - name: Cron

security:
  - MerchantKey: []

paths:
  # =========================================================================
  # Observability
  # =========================================================================
  /healthz:
    get:
      operationId: getHealthz
      tags: [Observability]
      summary: Liveness plus a database ping.
      description: |
        Public, unauthenticated, and not subject to the browser tripwire. On failure the body
        carries the driver's error **code only** — its message contains the connection string.
      security: []
      responses:
        '200':
          description: Alive, database reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, commit, now]
                properties:
                  status: { const: ok }
                  version: { type: string, examples: ['0.1.0'] }
                  commit:
                    type: string
                    description: '`VERCEL_GIT_COMMIT_SHA`, or `dev` locally. Answers "which build is live?".'
                  now: { type: string, format: date-time }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, db, code]
                properties:
                  status: { const: degraded }
                  db: { const: unreachable }
                  code:
                    type: string
                    description: The driver's error code. Never its message.

  # =========================================================================
  # Merchant tier
  # =========================================================================
  /v1/payments:
    post:
      operationId: createPayment
      tags: [Merchant payments]
      summary: Create a payment and get a gateway URL.
      description: |
        Calls the PSP, so this is the one merchant endpoint with real latency. Redirect the
        buyer's browser to `gateway_url`.

        Returns **201** for a new payment and **200** with `Idempotent-Replay: true` for a
        replay of an identical request, because a replay created nothing.

        A **502** does not mean nothing happened: read `detail`. A definitive rejection may be
        retried with the same key once the request is fixed; an unreachable provider leaves the
        outcome unknown and the only safe retry is with the **same** `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
            examples:
              full:
                summary: Every field
                value:
                  merchant_payment_ref: order-12345
                  amount_minor: '2500'
                  currency: HUF
                  provider: barion
                  metadata: { cart_id: c_88f1 }
              minimal:
                summary: The least that works
                value:
                  merchant_payment_ref: order-12345
                  amount_minor: '2500'
                  currency: HUF
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: A replay of an earlier identical request. Nothing was created.
          headers:
            Idempotent-Replay:
              schema: { const: 'true' }
              description: Present only on a replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '409': { $ref: '#/components/responses/IdempotencyConflictProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /v1/payments/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    get:
      operationId: getPayment
      tags: [Merchant payments]
      summary: Read one payment.
      description: |
        **Side effect:** a payment past its `expires_at` and still open is lazily checked with
        the PSP once and may transition to `expired`. That sweep can never fail the read.

        An id belonging to another merchant returns **404**, never 403, so ids cannot be probed
        for existence.
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/payments/{public_id}/refresh:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: refreshPayment
      tags: [Merchant payments]
      summary: Force a re-read of authoritative provider state.
      description: |
        Reconciliation, **not polling**. Throttled to one call per payment per 5 seconds; a
        second call inside the window is a 429 with a `retry_after` member and makes no
        provider call. A payment already in a terminal status returns immediately.
      responses:
        '200':
          description: The payment, transitioned if the provider's state had moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RefreshThrottledProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /v1/payments/{public_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: createRefund
      tags: [Merchant refunds]
      summary: Refund a payment, in whole or in part.
      description: |
        **Moves real money, with no confirmation step** — this is a server-to-server API and
        the caller's own backend owns the confirmation UX.

        `amount_minor` and `currency` are both required. `currency` is an assertion, not an
        instruction: both PSPs key a refund off the original transaction. It exists so
        "refund 500 EUR" against a HUF payment cannot be silently read as 500 HUF.

        The remaining balance is enforced by a database CHECK constraint, so two concurrent
        refunds cannot together exceed the payment; the loser gets
        `422 refund_exceeds_remaining`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
            examples:
              partial:
                value: { amount_minor: '1000', currency: HUF, reason: 'Two items returned, ticket #812' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '200':
          description: A replay of an earlier identical request. Nothing was refunded.
          headers:
            Idempotent-Replay:
              schema: { const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/IdempotencyConflictProblem' }
        '422': { $ref: '#/components/responses/RefundStateProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }
    get:
      operationId: listPaymentRefunds
      tags: [Merchant refunds]
      summary: Every refund of one payment.
      description: Oldest first. Not paginated — the refund cap bounds the list by construction.
      responses:
        '200':
          description: The refunds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/refunds/{public_id}:
    parameters:
      - $ref: '#/components/parameters/RefundPublicId'
    get:
      operationId: getRefund
      tags: [Merchant refunds]
      summary: Read one refund.
      description: |
        **Side effect:** a refund whose outcome is unknown is reconciled here, which may make
        one provider call. It cannot fail the read. This is the call to make when chasing an
        `outcome_unknown: true`.
      responses:
        '200':
          description: The refund.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/webhook-deliveries:
    get:
      operationId: listOwnWebhookDeliveries
      tags: [Merchant webhooks]
      summary: A merchant's own webhook queue.
      description: |
        Newest first, not cursor-paginated. Exists so an integrator can answer "why didn't I
        get the event?" themselves. The payload is deliberately not included.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `pending`, because the common question is "what is stuck?".
          schema:
            type: string
            enum: [pending, delivered, dead_lettered, all]
            default: pending
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: The deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }

  # =========================================================================
  # Provider callbacks — documented so the URLs are unambiguous
  # =========================================================================
  /v1/providers/barion/ipn/{merchantPublicId}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicIdPath'
    post:
      operationId: barionIpn
      tags: [Provider callbacks]
      summary: Barion's IPN. Called by Barion, never by an integrator.
      description: |
        The value to paste into the Barion shop settings is returned as `callback_url` by
        `PUT /admin/merchants/{public_id}/credentials/barion` — do not build it by hand.

        **Barion sends no body**; `paymentId` arrives in the query string and the `Content-Type`
        may be absent. No body parser may be registered on this path: one would answer 415
        before the handler runs, and the only symptom is "endpoint failing" in the Barion
        dashboard.

        **Always answers 200** — unknown payment ids, missing parameters and internal failures
        included — inside Barion's 15-second deadline. A non-200 makes Barion retry and
        eventually flag the endpoint; recovery here is the sweeper and `POST /refresh`.

        The callback is treated as a hint, never a fact: authoritative state is re-fetched from
        Barion before any transition.
      security: []
      parameters:
        - name: paymentId
          in: query
          required: false
          description: Barion's payment id, bare 32-hex or dashed. Both spellings are resolved.
          schema: { type: string }
      responses:
        '200':
          description: Received. The only response this endpoint produces.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { const: true }

  /v1/providers/stripe/webhook/{merchantPublicId}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicIdPath'
    post:
      operationId: stripeWebhook
      tags: [Provider callbacks]
      summary: Stripe's webhook. Called by Stripe, never by an integrator.
      description: |
        Normally created automatically on the merchant's Stripe account during onboarding, so
        there is nothing to paste. The HMAC covers the exact bytes Stripe sent, so the raw body
        is read before anything else touches the request.

        Status codes are deliberately unlike Barion's, because Stripe's retry behaviour is
        worth using: **400** for a bad, stale or absent signature and for an unknown merchant
        or unusable credential (re-sending will not fix a configuration problem, and the
        dashboard is where someone can act on it); **500** when processing failed or we are
        rate limited, because Stripe then retries with backoff for days.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: A Stripe Event. Verified against the merchant's own signing secret.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Processed, or nothing to do.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }
        '400':
          description: Signature rejected, unknown merchant, or a credential we cannot use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }
        '500':
          description: Processing failed, or rate limited. Stripe should retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }

  # =========================================================================
  # Cron
  # =========================================================================
  /api/cron/webhooks:
    get:
      operationId: cronDrainWebhooksGet
      tags: [Cron]
      summary: Drain the due webhook queue. Invoked by Vercel Cron.
      description: |
        Requires `Authorization: Bearer $CRON_SECRET` and **fails closed when `CRON_SECRET` is
        unset** — an unauthenticated queue drain is a free denial-of-service against every
        merchant endpoint we have. Vercel Cron issues a `GET`; the `POST` form exists so an
        operator can prove the path by hand. One handler, so the two cannot drift.
      security:
        - CronSecret: []
      responses:
        '200':
          description: What the drain did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainSummary' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
    post:
      operationId: cronDrainWebhooksPost
      tags: [Cron]
      summary: Drain the due webhook queue, by hand.
      description: The same handler as the `GET`, for an operator invoking it manually.
      security:
        - CronSecret: []
      responses:
        '200':
          description: What the drain did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainSummary' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }

  # =========================================================================
  # Admin — self and health
  # =========================================================================
  /admin/me:
    get:
      operationId: adminMe
      tags: [Admin self]
      summary: Introspect the calling key. No scope required.
      description: The first call lamido-admin should make, to decide which navigation to render.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The calling key.
          content:
            application/json:
              schema:
                type: object
                required: [id, label, scopes, allowed_ips, last_used_at]
                properties:
                  id: { type: string, format: uuid }
                  label: { type: string }
                  scopes:
                    type: array
                    items: { $ref: '#/components/schemas/AdminScope' }
                  allowed_ips:
                    type: array
                    items: { type: string }
                    description: CIDRs. **Empty means unrestricted**, which is the default.
                  last_used_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }

  /admin/health:
    get:
      operationId: adminHealth
      tags: [Admin self]
      summary: The dashboard strip. No scope required.
      description: |
        **Always HTTP 200, even when it reports `degraded`** — a monitoring check needs the
        status code to mean "the strip itself is broken" and nothing else. Read the body.

        When the database is unreachable the counts read zero and `database` reads
        `unreachable`.

        `status` is derived from the counts by **blast radius, not severity**: `degraded` means
        someone cannot take payments, `attention` means something needs a human while payments
        still flow. Every count has a drill-down, and the count query and the listing filter
        are the same predicate.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The strip. Note the status code does not reflect `status`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStrip' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }

  /admin/providers:
    get:
      operationId: adminProviderCatalog
      tags: [Admin self]
      summary: The provider catalog that drives the generic credential form.
      description: |
        A new PSP therefore needs no admin UI work. Wrapper keys are snake_case; the `key`
        inside each field is **not**, because it is the literal property name the credential
        upsert body expects.
      security:
        - AdminKey: []
      responses:
        '200':
          description: One descriptor per provider.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderDescriptor' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  # =========================================================================
  # Admin — merchants
  # =========================================================================
  /admin/merchants:
    get:
      operationId: adminListMerchants
      tags: [Admin merchants]
      summary: Browse and search merchants.
      security:
        - AdminKey: []
      parameters:
        - name: q
          in: query
          required: false
          description: Matches the name, the external ref **and** the public id — an operator arrives holding whichever of the three was read out to them.
          schema: { type: string }
        - name: active
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of merchants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMerchant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
    post:
      operationId: adminCreateMerchant
      tags: [Admin merchants]
      summary: Provision a merchant, with its first API key.
      description: |
        Returns the merchant **plus a one-time `pmk_` key**. The plaintext is shown once; only
        its SHA-256 is stored.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMerchantRequest' }
      responses:
        '201':
          description: Created, with the one-time merchant key.
          content:
            application/json:
              schema:
                type: object
                required: [merchant, api_key]
                properties:
                  merchant: { $ref: '#/components/schemas/AdminMerchant' }
                  api_key: { $ref: '#/components/schemas/MintedMerchantKey' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /admin/merchants/{public_id}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminGetMerchant
      tags: [Admin merchants]
      summary: One merchant.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The merchant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMerchant' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    patch:
      operationId: adminUpdateMerchant
      tags: [Admin merchants]
      summary: Amend a merchant.
      description: |
        **`null` is meaningful and distinct from absent**: absent leaves a field alone, `null`
        clears it. That is the only way to remove a redirect template.

        `external_ref` is accepted only at creation and has no PATCH. A `default_currency` that
        lands outside the stored `allowed_currencies` is a 409 — the rule is checked against
        the merged result, not against the body.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMerchantRequest' }
      responses:
        '200':
          description: The merchant as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMerchant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /admin/merchants/{public_id}/api-keys:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminListMerchantKeys
      tags: [Admin merchants]
      summary: A merchant's API keys, including revoked ones.
      description: Not paginated. `key_hash` is never returned.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MerchantApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    post:
      operationId: adminMintMerchantKey
      tags: [Admin merchants]
      summary: Mint an additional merchant key.
      description: 'The rotation path: mint, let the merchant deploy, then revoke the old one.'
      security:
        - AdminKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: [string, 'null'], examples: [staging] }
      responses:
        '201':
          description: The new key. Plaintext shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedMerchantKey' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/api-keys/{id}:
    parameters:
      - $ref: '#/components/parameters/InternalId'
    delete:
      operationId: adminRevokeMerchantKey
      tags: [Admin merchants]
      summary: Revoke a merchant key.
      description: |
        A **soft revoke**: the row stays and `revoked_at` is stamped, so a leaked-credential
        post-mortem still has the evidence that the key existed. Idempotent — re-revoking
        returns 200 with the unchanged timestamp.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The revoked key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # =========================================================================
  # Admin — credentials
  # =========================================================================
  /admin/credentials:
    get:
      operationId: adminListFailingCredentials
      tags: [Admin credentials]
      summary: The drill-down behind the health strip's `failing_credentials` count.
      description: |
        Exists **only** to serve that tile, so it takes the one filter that maps onto the
        count's predicate and nothing richer — a second definition of "failing" is a second
        definition waiting to disagree with the first. Not paginated: a list long enough to
        need a cursor is the incident, not an ergonomics problem.
      security:
        - AdminKey: []
      parameters:
        - name: failing
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The credentials, each with its merchant.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Credential'
                    - type: object
                      required: [merchant_public_id]
                      properties:
                        merchant_public_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/merchants/{public_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminListMerchantCredentials
      tags: [Admin credentials]
      summary: Everything configured for a merchant, current and past.
      description: |
        Includes **inactive** rows: deactivating leaves the row behind as history, and "what
        was configured before the switch to live?" is an incident question. Never returns a
        secret.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The credentials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/merchants/{public_id}/credentials/{provider}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
      - $ref: '#/components/parameters/ProviderName'
    put:
      operationId: adminUpsertCredential
      tags: [Admin credentials]
      summary: Store or amend a merchant's PSP credential.
      description: |
        **Never log this request body.** It carries plaintext PSP secrets.

        Four behaviours matter, and the first two read alike while being asymmetric:

        - An omitted `secrets` field **keeps its stored ciphertext** — editing a label cannot
          blank a working POSKey.
        - `config` is **replaced wholesale**. A PUT that omits it drops every setting, so the
          admin UI must always resend the full config object, even when only the label changed.
        - Supplying a secret **voids the previous test verdict**; the credential stops resolving
          for payments until re-tested. The alternative is charging buyers through an unproven
          key.
        - **The mode of an active credential cannot change** (409). Barion POSKeys are UUIDs in
          both environments with no prefix to tell them apart, so an in-place mode edit is an
          undetectable way to point a sandbox key at live money.

        The response carries `callback_url`, already resolved for this merchant — the value to
        paste into the PSP dashboard, so nobody builds it by hand.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertCredentialRequest' }
            examples:
              barion:
                value:
                  mode: sandbox
                  label: Acme Barion sandbox
                  secrets: { posKey: 'YOUR_POSKEY' }
                  config: { payeeEmail: shop@acme.example.com, defaultLocale: hu-HU }
              stripe:
                value:
                  mode: sandbox
                  secrets: { secretKey: sk_test_YOUR_KEY, webhookSecret: whsec_YOUR_SECRET }
                  config: { defaultLocale: hu }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialWithCallback' }
        '200':
          description: Amended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialWithCallback' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
    delete:
      operationId: adminDeactivateCredential
      tags: [Admin credentials]
      summary: Deactivate a merchant's credential.
      description: The row stays as history and the single active slot frees for a replacement.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The deactivated credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/merchants/{public_id}/credentials/{provider}/test:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
      - $ref: '#/components/parameters/ProviderName'
    post:
      operationId: adminTestCredential
      tags: [Admin credentials]
      summary: Probe a credential, read-only.
      description: |
        **HTTP 200 even when `ok` is `false`** — a failed probe is a fact about the credential,
        not a failure of the request, and a 4xx would send it through generic error handling and
        lose the message that says why.

        `details.reason` is machine-readable so the UI can offer the right remedy:
        `live_blocked` (this deployment has live traffic switched off), `decrypt_failed` (the
        KEK was rotated), `probe_failed` (the adapter itself threw).

        Never issues, captures or refunds anything.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The verdict. Check `ok`, not the status code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialTestResult' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # =========================================================================
  # Admin — payments
  # =========================================================================
  /admin/payments:
    get:
      operationId: adminListPayments
      tags: [Admin payments]
      summary: Browse payments across merchants.
      description: |
        Not searchable by amount or by anything about a buyer: this service holds no buyer PII,
        and an endpoint that looked like it did would invite operators to try.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: provider
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Provider' }
        - name: currency
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Currency' }
        - name: merchant_payment_ref
          in: query
          required: false
          description: Exact match.
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPayment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/payments/stuck:
    get:
      operationId: adminListStuckPayments
      tags: [Admin payments]
      summary: The stuck queue, oldest first.
      description: |
        **Registered before `/admin/payments/{public_id}`** — the other way round, `stuck`
        reaches the detail handler as a public id and the symptom is a 400 on a path that looks
        perfectly correct.

        `total` is the **unfiltered** count, the same number the health strip shows, so
        narrowing by merchant does not change the figure the operator clicked.
      security:
        - AdminKey: []
      parameters:
        - name: olderThanMinutes
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 43200, default: 15 }
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stuck payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [total, older_than_minutes]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPayment' }
                      total:
                        type: integer
                        description: Unfiltered count — what the health strip shows.
                      older_than_minutes: { type: integer }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/payments/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    get:
      operationId: adminGetPayment
      tags: [Admin payments]
      summary: One payment, its refunds, and every inbound PSP callback.
      description: |
        `timeline` is the answer to "the merchant says Barion notified you and nothing
        happened", which is unanswerable without it. The raw callback body and the recorded
        headers are **not** included; they stay in `provider_events` for dispute evidence.

        Unlike the merchant read, this runs **no expiry sweep**: an operator inspecting a
        payment sees the row as it is, not as their own page load has just rearranged it.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The payment, its refunds and its callback timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/payments/{public_id}/refresh:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: adminRefreshPayment
      tags: [Admin payments]
      summary: Re-read authoritative provider state.
      description: |
        Shares the merchant tier's **5-second per-payment throttle**, which is a column on the
        payment. That throttle protects the PSP's API rather than ours, so exempting operators
        would aim the difference at the wrong party.

        Reading state is not changing it, so this needs only `payments:read`.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The payment, transitioned if the provider's state had moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RefreshThrottledProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /admin/payments/{public_id}/reconcile:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: adminReconcilePayment
      tags: [Admin payments]
      summary: Resolve a payment the provider cannot resolve for us.
      description: |
        For the residue `POST /refresh` cannot fix. A discriminated union on `action`, because
        the three actions differ in what they need and in how much damage they do. `reason` is
        required on all three and is recorded in the audit entry.

        **Every reconcile body is validated strictly**: an unrecognised field is a 400 rather
        than silently dropped. Elsewhere unknown keys are ignored, but
        `{"action":"release","provider_payment_id":"…"}` reads to a human as "release this
        specific provider payment", and silently ignoring the field would release whatever the
        row happened to be.

        `release` is the **only destructive action in the admin API**. It requires
        `initializing` status (`422 not_releasable`) and a null `provider_payment_id`
        (`422 known_to_provider`), and the row is snapshotted into `audit_log.metadata` before
        the delete.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileRequest' }
      responses:
        '200':
          description: The payment as it now stands, or a released confirmation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ReconcileStateProblem' }

  /admin/payments/{public_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: adminCreateRefund
      tags: [Admin refunds]
      summary: Refund a payment as an operator. Moves real money.
      description: |
        `amount_minor` is required — there is no "refund the rest" default, exactly as on the
        merchant tier. The operator is looking at `refundable_minor` when they click, so send
        the number they saw. The currency comes from the payment.

        There is **no `Idempotency-Key` header** here: an operator clicking a button has none to
        supply. Double-click protection is the CHECK constraint on `payments` — the second
        reserve against the cap is refused by Postgres, not by an `if`. The admin UI should
        still gate the action behind a retype.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { $ref: '#/components/schemas/MinorAmount' }
                reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: The refund.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/RefundStateProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /admin/refunds:
    get:
      operationId: adminListRefunds
      tags: [Admin refunds]
      summary: Browse refunds across merchants.
      description: |
        `outcome_unknown=true` is the operationally important filter: it is the reconciler's
        backlog, money that may or may not have moved. The reconciler clears these on its own,
        so a handful at any moment is normal and a growing count is not.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: outcome_unknown
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of refunds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminRefund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/refunds/{public_id}:
    parameters:
      - $ref: '#/components/parameters/RefundPublicId'
    get:
      operationId: adminGetRefund
      tags: [Admin refunds]
      summary: One refund.
      description: |
        Runs **no reconciliation sweep**, unlike the merchant read. An operator called about a
        refund whose outcome is unknown must see that it is unknown, not have the page load
        quietly resolve it into a different answer.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The refund.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRefund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # =========================================================================
  # Admin — webhooks
  # =========================================================================
  /admin/webhook-endpoints:
    get:
      operationId: adminListWebhookEndpoints
      tags: [Admin webhooks]
      summary: The drill-down behind the health strip's `disabled_webhook_endpoints` count.
      description: Not paginated, for the same reason as `/admin/credentials`.
      security:
        - AdminKey: []
      parameters:
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The endpoints.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/merchants/{public_id}/webhook-endpoint:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminGetWebhookEndpoint
      tags: [Admin webhooks]
      summary: A merchant's webhook endpoint.
      description: |
        One endpoint per merchant, by design. With none configured this is a **404, not a
        `null` body** — "this merchant receives no webhooks" is a distinct answer from a
        configuration, and a client branching on a null inside a 200 gets it wrong more often.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    put:
      operationId: adminUpsertWebhookEndpoint
      tags: [Admin webhooks]
      summary: Create or update a merchant's webhook endpoint.
      description: |
        The signing secret is returned **once**, on the call that mints it — a first save, or
        `rotate_secret: true`. An ordinary update returns `{ endpoint }` with no secret.

        `rotate_secret` is explicit rather than implied by any update: the previous secret stops
        working the instant it lands, and the merchant's deployment has to be ready. There is
        no dual-secret grace period.

        `subscribed_events: null` or absent means every event type, which is the default and
        what nearly every merchant should use. An **empty array is rejected**, because an
        endpoint subscribed to nothing is indistinguishable from a broken one.

        A save also **re-enables** an auto-disabled endpoint and clears its failure counter — an
        operator saving is asserting the destination is good now.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertWebhookEndpointRequest' }
      responses:
        '201':
          description: Created, with the one-time signing secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedWebhookEndpoint' }
        '200':
          description: Updated. Carries a secret only when one was minted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MintedWebhookEndpoint'
                  - type: object
                    required: [endpoint]
                    properties:
                      endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/merchants/{public_id}/webhook-endpoint/enable:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    post:
      operationId: adminEnableWebhookEndpoint
      tags: [Admin webhooks]
      summary: Re-enable an auto-disabled endpoint.
      description: Clears `disabled_reason` and resets `consecutive_failures`.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The endpoint, enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/webhook-deliveries:
    get:
      operationId: adminListWebhookDeliveries
      tags: [Admin webhooks]
      summary: The delivery queue, across merchants.
      description: |
        Defaults to **`status=all`**, unlike the merchant-facing list which defaults to
        `pending`. An operator arrives here from a health-strip count about dead-letters, and
        defaulting to `pending` would show a different set than the one they clicked.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, delivered, dead_lettered, all]
            default: all
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/WebhookDelivery'
                            - type: object
                              required: [merchant_public_id]
                              properties:
                                merchant_public_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/webhook-deliveries/{id}/redeliver:
    parameters:
      - name: id
        in: path
        required: true
        description: The **`delivery_id`** from a listing, not the internal row id.
        schema: { type: string, format: uuid }
    post:
      operationId: adminRedeliverWebhook
      tags: [Admin webhooks]
      summary: Try a delivery again now.
      description: |
        **Resets the existing row** rather than inserting a second one — the unique index on
        `(event_id, endpoint_id)` makes two queues of attempts for one event impossible. The
        attempt counter goes back to 1 and `delivery_id` is regenerated, because it identifies
        one HTTP request. The `event_id` is unchanged, so the merchant's own dedupe still works.

        It does **not** deliver inline: the row becomes due immediately and the next sweep takes
        it. Redelivering to a disabled endpoint is `422 endpoint_disabled` — enable it first.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The delivery, reset and due.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422':
          description: The endpoint is disabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # =========================================================================
  # Admin — stats
  # =========================================================================
  /admin/stats/overview:
    get:
      operationId: adminStatsOverview
      tags: [Admin stats]
      summary: Headline counts and totals, per currency.
      description: |
        Succeeded is reported **separately rather than as a conversion percentage**: a
        percentage over a handful of payments is noise, and an operator reading "33%" on three
        payments draws a conclusion that is not there.

        These are **operational numbers, not accounting ones** — they round nothing and
        reconcile nothing against a PSP statement. Do not label them revenue.
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, since, payments, succeeded]
                properties:
                  window_days: { type: integer }
                  since: { type: string, format: date-time }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyTotal' }
                  succeeded:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyTotal' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/stats/timeseries:
    get:
      operationId: adminStatsTimeseries
      tags: [Admin stats]
      summary: Payments per bucket, per currency, per status.
      description: |
        Buckets come from `date_trunc`. A bucket with no payments is **absent rather than
        zero**, so fill gaps client-side — the caller knows the range it asked for and the
        viewer's timezone, and this service knows neither.
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: interval
          in: query
          required: false
          schema: { type: string, enum: [hour, day], default: day }
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, interval, since, buckets]
                properties:
                  window_days: { type: integer }
                  interval: { type: string, enum: [hour, day] }
                  since: { type: string, format: date-time }
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [bucket, currency, status, count, amount_minor]
                      properties:
                        bucket: { type: string, format: date-time }
                        currency: { $ref: '#/components/schemas/Currency' }
                        status: { $ref: '#/components/schemas/PaymentStatus' }
                        count: { type: integer }
                        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/stats/merchants:
    get:
      operationId: adminStatsMerchants
      tags: [Admin stats]
      summary: Per-merchant, per-currency activity.
      description: |
        Merchants with no payments in the window are absent: the merchant list answers "who
        exists", this answers "who is transacting".
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: The merchants.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, since, merchants]
                properties:
                  window_days: { type: integer }
                  since: { type: string, format: date-time }
                  merchants:
                    type: array
                    items:
                      type: object
                      required: [merchant_public_id, name, currency, count, succeeded_count, succeeded_amount_minor]
                      properties:
                        merchant_public_id: { type: string, format: uuid }
                        name: { type: string }
                        currency: { $ref: '#/components/schemas/Currency' }
                        count: { type: integer }
                        succeeded_count: { type: integer }
                        succeeded_amount_minor:
                          allOf:
                            - $ref: '#/components/schemas/MinorAmount'
                          description: Succeeded payments only — what the merchant actually took.
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  # =========================================================================
  # Admin — keys and audit
  # =========================================================================
  /admin/keys:
    get:
      operationId: adminListKeys
      tags: [Admin keys]
      summary: Every admin key. `key_hash` is never returned.
      description: A null `last_used_at` on an old key is worth acting on.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
    post:
      operationId: adminMintKey
      tags: [Admin keys]
      summary: Mint an admin key. Plaintext shown once.
      description: |
        `label` is required — it is the identity that appears in every audit entry.

        `scopes` defaults to `["*"]` when omitted, but an **empty array is rejected**: a key
        that authenticates and can do nothing is almost always a client that meant to send
        scopes, and it fails later as a confusing 403 on every call.

        `allowed_ips` is validated with the same CIDR parser the middleware matches with, so a
        rule that could never match is refused at mint time rather than silently locking the
        key out.

        **`admin:manage` is transitively every scope** — a key holding it can mint itself a
        `*` key.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1 }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/AdminScope' }
                  description: 'Omitted grants `["*"]`. `[]` is rejected.'
                allowed_ips:
                  type: array
                  items: { type: string, examples: ['203.0.113.7/32'] }
                  description: CIDRs. Omitted or empty means unrestricted.
      responses:
        '201':
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [key, secret, warning]
                properties:
                  key: { $ref: '#/components/schemas/AdminApiKey' }
                  secret: { type: string, examples: ['pad_YOUR_NEW_KEY'] }
                  warning: { type: string }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /admin/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/InternalId'
    delete:
      operationId: adminRevokeKey
      tags: [Admin keys]
      summary: Deactivate an admin key.
      description: |
        Deactivates rather than deleting, and **refuses to revoke the calling key** (409). An
        operator who locks themselves out has no way back except the bootstrap script on the
        host, and the mistake is easy to make when revoking a list of stale keys that happens
        to include the one in the terminal's environment.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The deactivated key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /admin/audit:
    get:
      operationId: adminListAudit
      tags: [Admin audit]
      summary: The operator trail, newest first.
      description: |
        **Append-only: there is no write endpoint and no delete endpoint.** Entries are written
        as a side effect of the action they describe.

        `actor_label` is denormalised and `actor_id` carries **no foreign key**, so the trail
        stays readable after a key is revoked or deleted — history has to outlive the row it
        points at.

        `metadata` is an **allowlisted summary per action**, never a raw request body. That is
        the control that keeps a plaintext Stripe key out of a table which is not encrypted.

        `action` accepts only names from the catalogue in `admin-api.md` — a filter cannot name
        an action that can never occur.
      security:
        - AdminKey: []
      parameters:
        - name: action
          in: query
          required: false
          schema: { type: string, examples: [payment.refund] }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: actor_id
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

components:
  securitySchemes:
    MerchantKey:
      type: http
      scheme: bearer
      bearerFormat: pmk_...
      description: |
        A merchant API key. Server-to-server only: a request carrying `Origin` or
        `Sec-Fetch-Mode: cors` is rejected with 403 before authentication runs.
    AdminKey:
      type: http
      scheme: bearer
      bearerFormat: pad_...
      description: |
        An admin API key, plus per-route scopes. A separate tier in a separate table from
        `pmk_`, so compromising one does not hand over the other. Insufficient scope returns
        **403 naming the missing scope**.
    CronSecret:
      type: http
      scheme: bearer
      description: '`CRON_SECRET`, presented by Vercel Cron. The route fails closed when it is unset.'

  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **Required, not optional.** Any string up to 255 characters; derive it from the
        operation rather than the clock. Payment keys live 7 days, refund keys 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255 }
    PaymentPublicId:
      name: public_id
      in: path
      required: true
      description: The payment's `public_id` (UUIDv7). A malformed id is a 400 about the id, not a 404.
      schema: { type: string, format: uuid }
    RefundPublicId:
      name: public_id
      in: path
      required: true
      description: The refund's `public_id` (UUIDv7).
      schema: { type: string, format: uuid }
    MerchantPublicId:
      name: public_id
      in: path
      required: true
      description: The merchant's `public_id`.
      schema: { type: string, format: uuid }
    MerchantPublicIdPath:
      name: merchantPublicId
      in: path
      required: true
      description: The merchant's `public_id`, baked into the callback URL at credential-save time.
      schema: { type: string, format: uuid }
    ProviderName:
      name: provider
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Provider' }
    InternalId:
      name: id
      in: path
      required: true
      description: An internal uuid. Admin-only objects have no external identity.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset cursor from a previous `next_cursor`. **Do not construct or parse one**;
        a malformed cursor is a 400 rather than a quiet restart from page 1.
      schema: { type: string }
    From:
      name: from
      in: query
      required: false
      description: '**Inclusive** lower bound.'
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      required: false
      description: |
        **Exclusive** upper bound. Paging by day with `from=D&until=D+1` therefore covers every
        row exactly once; two inclusive bounds double-count the boundary.
      schema: { type: string, format: date-time }
    Days:
      name: days
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 365, default: 7 }

  responses:
    ValidationProblem:
      description: The request, or the merchant's configuration, cannot produce the result.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            amount:
              value:
                type: urn:payment-service:problem:validation
                title: Bad Request
                status: 400
                detail: 'body.amount_minor: Amount must be a decimal string of minor units with no sign, decimal point or leading zero; received "25.00"'
                instance: /v1/payments
    UnauthorizedProblem:
      description: No credential, or one we do not recognise. One identical message for unknown, revoked and disabled.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BrowserTripwireProblem:
      description: |
        A browser-shaped request — `Origin` or `Sec-Fetch-Mode: cors`. A **tripwire, not a
        security boundary**: `Origin` is forgeable, and the real boundary is the API key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenScopeProblem:
      description: |
        The admin key lacks the scope, and the response **names** it — the caller is a trusted
        operator tool, and "which scope do I need?" should not be a support round-trip. Also
        the browser tripwire on this surface.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundProblem:
      description: |
        No such resource **or it belongs to another merchant** — 404, never 403, so ids cannot
        be probed for existence.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflictProblem:
      description: |
        The `Idempotency-Key` is in flight (retry after a pause; the lease is 60 s) or was used
        with a **different** body (use a new key — this path costs zero provider calls).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitProblem:
      description: Too many requests. `Retry-After` says how long.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RefreshThrottledProblem:
      description: |
        This payment was refreshed within the last 5 seconds. **No provider call was made.**
        The `retry_after` extension member carries the seconds to wait.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  retry_after: { type: integer, description: Seconds. }
    RefundStateProblem:
      description: |
        Understood, but the payment's state forbids it. **Not a permanent failure** — every
        cause here describes state that can change.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  code:
                    type: string
                    enum: [payment_not_refundable, currency_mismatch, refund_target_unknown, refund_exceeds_remaining]
    ReconcileStateProblem:
      description: The payment's state forbids this reconcile action.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  code:
                    type: string
                    enum: [not_releasable, known_to_provider, already_attached]
    ProviderProblem:
      description: |
        The PSP rejected us or was unreachable. **Read `detail`:** a rejection is definitive, an
        unreachable provider leaves the outcome unknown and the only safe retry is with the
        same `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  provider_error:
                    type: string
                    description: A short, non-secret description of what the PSP said.

  schemas:
    # ---------------------------------------------------------------- money
    MinorAmount:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: |
        A decimal string of **canonical** minor units. **HUF is zero-decimal here**, so
        `"1000"` HUF is 1000 Ft; EUR is two-decimal, so `"1000"` EUR is €10.00. A string and
        never a JSON number, because JSON numbers lose precision above 2^53. Request amounts
        must be greater than zero.
      examples: ['1000', '2500']
    Currency:
      type: string
      enum: [HUF, EUR]
      description: Two, deliberately. A third is a decision with a golden-vector row attached, not a config change.
    Provider:
      type: string
      enum: [barion, stripe]
    Mode:
      type: string
      enum: [sandbox, live]
      description: A property of the credential used, not of the request. There is no test flag and no sandbox hostname.

    # -------------------------------------------------------------- problem
    Problem:
      type: object
      description: RFC 7807 Problem Details. Served as `application/problem+json`.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum:
            - urn:payment-service:problem:validation
            - urn:payment-service:problem:unauthorized
            - urn:payment-service:problem:forbidden
            - urn:payment-service:problem:not-found
            - urn:payment-service:problem:conflict
            - urn:payment-service:problem:rate-limit
            - urn:payment-service:problem:internal
          description: |
            **Branch on this, never on `title` or `detail`.** A closed set: adding a member is
            an API change. `conflict` carries both 409 and 422; there is no `provider` member —
            a PSP failure is `internal` carried by HTTP 502.
        title:
          type: string
          description: A summary of the **status**, not of the type. Wording may change.
        status: { type: integer }
        detail:
          type: string
          description: Prose for a human reading a log. Never contains a credential or a request body.
        instance:
          type: string
          description: The request **path**. Never a full URL and never with a query string.
      additionalProperties: true

    # -------------------------------------------------------------- merchant
    PaymentStatus:
      type: string
      enum: [initializing, pending, authorized, succeeded, failed, canceled, expired, partially_refunded, refunded]
      description: |
        Our canonical lifecycle, identical across providers. `failed`, `canceled`, `expired` and
        `refunded` are terminal.

        `initializing` is internal — we have reserved the operation and not yet heard from the
        PSP. `authorized` exists because Stripe can produce it, not because an auth/capture
        split is driven. `partially_refunded` and `refunded` come from **our refunds ledger**,
        never from a provider status: Barion still reports `Succeeded` after a full refund.

        **Never fulfil an order on `pending`.**
    RefundStatus:
      type: string
      enum: [pending, succeeded, failed, canceled]
      description: A refund's own lifecycle. `canceled` means a reservation was released, not that money moved.

    Payment:
      type: object
      description: A payment, as the merchant tier returns it.
      required:
        [public_id, merchant_payment_ref, amount_minor, currency, status, provider, mode,
        provider_payment_id, provider_status, gateway_url, redirect_url, metadata, expires_at,
        succeeded_at, failed_at, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid, description: UUIDv7 — sortable by creation time. }
        merchant_payment_ref:
          type: string
          description: The merchant's own order id. Not required to be unique.
        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        provider:
          oneOf:
            - $ref: '#/components/schemas/Provider'
            - type: 'null'
          description: '`null` only for a payment that never reached a PSP.'
        mode: { $ref: '#/components/schemas/Mode' }
        provider_payment_id:
          type: [string, 'null']
          description: The PSP's own id — Barion 32-hex, Stripe `cs_…`. `null` until the PSP has answered.
        provider_status:
          type: [string, 'null']
          description: |
            The PSP's own status word, verbatim, so a status we have not mapped yet is still
            actionable. Not stable across providers.
        gateway_url:
          type: [string, 'null']
          description: Where to send the buyer. `null` means no gateway exists yet — do not redirect.
        redirect_url:
          type: [string, 'null']
          description: Where the PSP returns the buyer, resolved from the merchant's template at creation.
        metadata:
          type: [object, 'null']
          additionalProperties: true
          description: Opaque; stored and echoed, never interpreted. **Never put buyer PII here.**
        expires_at:
          type: [string, 'null']
          format: date-time
          description: The PSP's own payment window, read back from it.
        succeeded_at: { type: [string, 'null'], format: date-time }
        failed_at:
          type: [string, 'null']
          format: date-time
          description: Also stamped for `canceled` and `expired`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePaymentRequest:
      type: object
      required: [merchant_payment_ref, amount_minor, currency]
      properties:
        merchant_payment_ref: { type: string, minLength: 1, maxLength: 200 }
        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Must be one the merchant record allows, which defaults to their default currency alone.
        provider:
          allOf:
            - $ref: '#/components/schemas/Provider'
          description: |
            Omitted with **one** active credential uses that one. Omitted with **two** is a 400:
            guessing which PSP charges a buyer is not a defaulting decision.
        metadata:
          type: object
          additionalProperties: true
          description: 'Capped at 4096 bytes serialised. Default when omitted: `null`.'

    Refund:
      type: object
      description: A refund, as the merchant tier returns it.
      required:
        [public_id, payment_public_id, amount_minor, currency, status, outcome_unknown, reason,
        provider, mode, provider_refund_id, provider_status, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        payment_public_id: { type: string, format: uuid }
        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        outcome_unknown:
          type: boolean
          description: |
            `true` when the provider call did not complete, so we cannot say whether the money
            moved. The reservation stays held. **Never re-issue with a new idempotency key.**
        reason: { type: [string, 'null'] }
        provider: { $ref: '#/components/schemas/Provider' }
        mode: { $ref: '#/components/schemas/Mode' }
        provider_refund_id: { type: [string, 'null'] }
        provider_status: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRefundRequest:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          allOf:
            - $ref: '#/components/schemas/MinorAmount'
          description: |
            **Required, with no "refund the rest" default** — a default would make the same
            request refund different amounts depending on when it arrives.
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: |
            An assertion, not an instruction: it must equal the payment's currency. It exists so
            "refund 500 EUR" against a HUF payment cannot be read as 500 HUF.
        reason:
          type: string
          maxLength: 500
          description: 'For the merchant''s records. Never forwarded to Stripe''s `reason` enum. Default when omitted: `null`.'

    WebhookEventType:
      type: string
      enum: [payment.succeeded, payment.failed, payment.canceled, payment.expired, refund.succeeded, refund.failed]
      description: |
        There is deliberately no event for `pending`, `initializing` or `authorized` — those are
        steps, not outcomes — and no `payment.refunded`: the thing that happened is a refund, so
        it arrives as `refund.succeeded`, whose payload carries the payment's new status.

    WebhookPayload:
      type: object
      description: |
        The body we POST to a merchant's endpoint. **This shape is frozen** — it is stored at
        emission and delivered verbatim afterwards, so it does not grow the way the REST
        responses may. Note `payment.id` here is the payment's `public_id`.
      required: [event_id, event_type, created_at, payment]
      properties:
        event_id:
          type: string
          format: uuid
          description: Matches `X-Event-Id`. **Dedupe on this** — delivery is at-least-once.
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        created_at: { type: string, format: date-time }
        payment:
          type: object
          required: [id, merchant_payment_ref, status, amount_minor, currency, provider]
          properties:
            id: { type: string, format: uuid }
            merchant_payment_ref: { type: string }
            status: { $ref: '#/components/schemas/PaymentStatus' }
            amount_minor: { $ref: '#/components/schemas/MinorAmount' }
            currency: { $ref: '#/components/schemas/Currency' }
            provider:
              oneOf:
                - $ref: '#/components/schemas/Provider'
                - type: 'null'
        refund:
          type: object
          description: Present on `refund.*` events only.
          required: [id, status, amount_minor, currency]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/RefundStatus' }
            amount_minor: { $ref: '#/components/schemas/MinorAmount' }
            currency: { $ref: '#/components/schemas/Currency' }

    WebhookDelivery:
      type: object
      description: One event's delivery state. The payload is deliberately not included.
      required:
        [delivery_id, event_id, event_type, status, attempt, next_attempt_at, response_status,
        response_body_excerpt, error, created_at, updated_at]
      properties:
        delivery_id:
          type: string
          format: uuid
          description: Identifies the most recent HTTP attempt; matches its `X-Delivery-Id`.
        event_id:
          type: string
          format: uuid
          description: Stable across attempts; matches `X-Event-Id`.
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [pending, delivered, dead_lettered] }
        attempt: { type: integer, description: 1-based, for the attempt that is pending or last ran. }
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: |
            `null` unless `pending`. A **floor, not a schedule**: the delivery becomes eligible
            then and is attempted on the next sweep, which on the current tier may be hours
            later.
        response_status:
          type: [integer, 'null']
          description: The merchant's own HTTP status on the last attempt, or `null` if they never answered.
        response_body_excerpt:
          type: [string, 'null']
          description: First 500 bytes of the merchant's response, truncated while reading.
        error:
          type: [string, 'null']
          description: Transport-level failure — timeout, DNS, TLS, a 30x, or a URL the SSRF guard refused.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CallbackAck:
      type: object
      required: [received]
      properties:
        received: { type: boolean }
        reason:
          type: string
          description: Machine-readable cause on a non-200, e.g. `unknown_merchant`, `no_webhook_secret`.

    DrainSummary:
      type: object
      required: [claimed, delivered, scheduled, deadLettered, failed]
      properties:
        claimed: { type: integer }
        delivered: { type: integer }
        scheduled: { type: integer }
        deadLettered: { type: integer }
        failed: { type: integer, description: Attempts that threw. The claim lease expiry brings the row back. }

    # ------------------------------------------------------------------ admin
    AdminScope:
      type: string
      enum:
        - '*'
        - merchants:read
        - merchants:write
        - credentials:read
        - credentials:write
        - payments:read
        - payments:write
        - webhooks:read
        - webhooks:write
        - stats:read
        - audit:read
        - admin:manage
      description: |
        `"*"` grants all of them. **`payments:write` moves real money** — it covers refunds and
        every reconcile action including the one that deletes a row. **`admin:manage` is
        transitively every scope.**

    CursorPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { type: object } }
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque. `null` on the last page. Keyset, not offset: offset pagination silently
            skips rows on a table where new rows arrive at the front, which is every table here.

    AdminMerchant:
      type: object
      required: [public_id, name, external_ref, default_currency, allowed_currencies, redirect_url_template, active, notes, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        external_ref:
          type: [string, 'null']
          description: lamido-admin's own id. Accepted **only at creation**; there is no PATCH for it.
        default_currency: { $ref: '#/components/schemas/Currency' }
        allowed_currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
          description: Must contain `default_currency`. An empty list reads as "the default only".
        redirect_url_template:
          type: [string, 'null']
          description: |
            **Must contain `{publicId}`** — without it every buyer of every payment lands on the
            same page and the merchant cannot tell which order was paid for. `{merchantPublicId}`
            is also substituted.
        active: { type: boolean }
        notes: { type: [string, 'null'], description: Operator free text. Its values never enter the audit trail. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateMerchantRequest:
      type: object
      required: [name, default_currency]
      properties:
        name: { type: string, minLength: 1 }
        default_currency: { $ref: '#/components/schemas/Currency' }
        external_ref: { type: string }
        allowed_currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
          description: 'Default when omitted: `[default_currency]`. Must contain it.'
        redirect_url_template: { type: string, examples: ['https://acme.example.com/order/thanks?p={publicId}'] }
        notes: { type: string }
        api_key_label: { type: string, description: Label for the one-time key minted alongside the merchant. }

    UpdateMerchantRequest:
      type: object
      description: |
        **`null` is meaningful and distinct from absent**: absent leaves a field alone, `null`
        clears it.
      properties:
        name: { type: string }
        default_currency: { $ref: '#/components/schemas/Currency' }
        allowed_currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
        redirect_url_template: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        active: { type: boolean }

    MerchantApiKey:
      type: object
      description: '`key_hash` is never returned — it is not the key, but it is a value an attacker can compare candidates against offline.'
      required: [id, merchant_public_id, label, last_used_at, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        merchant_public_id: { type: string, format: uuid }
        label: { type: [string, 'null'] }
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Refreshed at most once every 5 minutes, to avoid a write on every request.
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    MintedMerchantKey:
      type: object
      required: [key, secret, warning]
      properties:
        key: { $ref: '#/components/schemas/MerchantApiKey' }
        secret:
          type: string
          description: The plaintext `pmk_` key. **Shown once**; only its SHA-256 is stored.
          examples: ['pmk_YOUR_MERCHANT_KEY']
        warning: { type: string }

    AdminApiKey:
      type: object
      required: [id, label, scopes, allowed_ips, active, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: The identity that appears in every audit entry. }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/AdminScope' }
        allowed_ips:
          type: array
          items: { type: string }
          description: |
            CIDRs. **Empty means unrestricted**, and that is the default. Vercel egress IPs
            rotate, so set this only for a caller with a stable outbound address.
        active: { type: boolean }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SecretSummary:
      type: object
      description: |
        The **only** secret-adjacent data any read path returns. No endpoint reveals a stored
        secret, and there will not be one.
      required: [set, last4, fingerprint]
      properties:
        set: { type: boolean }
        last4: { type: string, description: Last four characters of the plaintext, for operator recognition. }
        fingerprint:
          type: string
          description: |
            First 8 hex chars of the plaintext's SHA-256. Compare before and after a rotation to
            answer "did it land?" — and it must be **identical** after a KEK rotation, because
            it hashes the plaintext, not the ciphertext.

    Credential:
      type: object
      required: [id, provider, mode, label, config, secrets, expected_pos_id, expected_account_id, last_tested_at, last_test_status, last_test_error, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/Provider' }
        mode:
          allOf:
            - $ref: '#/components/schemas/Mode'
          description: '**Immutable while the credential is active** — changing it is a 409.'
        label: { type: [string, 'null'] }
        config:
          type: object
          additionalProperties: true
          description: Non-secret settings, per the provider catalog. **Replaced wholesale by a PUT.**
        secrets:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SecretSummary' }
        expected_pos_id:
          type: [string, 'null']
          description: Barion's POSId, pinned on first success. A mismatch afterwards means a different PSP account.
        expected_account_id:
          type: [string, 'null']
          description: Stripe's account id, pinned where the key permits reading it.
        last_tested_at: { type: [string, 'null'], format: date-time }
        last_test_status: { type: [string, 'null'], enum: [ok, failed, null] }
        last_test_error: { type: [string, 'null'] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CredentialWithCallback:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          required: [callback_url]
          properties:
            callback_url:
              type: string
              description: |
                Resolved for this merchant — **the value to paste into the PSP dashboard**, so
                nobody builds it by hand.
              examples: ['https://payment.example.com/v1/providers/barion/ipn/019e4a91-0000-7000-8000-000000000002']

    UpsertCredentialRequest:
      type: object
      required: [mode]
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/Mode'
          description: Cannot change while the credential is active. Stripe cross-validates it against the key prefix.
        label: { type: [string, 'null'] }
        secrets:
          type: object
          additionalProperties: { type: string }
          description: |
            Plaintext, per the provider catalog's `secret_fields`. **Omitted keeps the stored
            ciphertext**; supplying any secret voids the previous test verdict.
        config:
          type: object
          additionalProperties: true
          description: |
            **Replaced wholesale.** Always resend the full object on an edit, or every setting is
            dropped and a required one going missing is a 400.

    CredentialTestResult:
      type: object
      description: Returned with **HTTP 200 even when `ok` is false**.
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          properties:
            reason:
              type: string
              enum: [live_blocked, decrypt_failed, probe_failed]
              description: |
                `live_blocked` — this deployment has live PSP traffic switched off.
                `decrypt_failed` — the KEK was rotated. `probe_failed` — the adapter threw.
        callback_url: { type: string }

    ProviderDescriptor:
      type: object
      description: |
        Drives the generic credential form, so a new PSP needs no admin UI work. Wrapper keys
        are snake_case; each field's `key` is not, because it is the literal property name the
        credential upsert body expects.
      required: [name, label, secret_fields, config_fields, capabilities, callback_path_template, test_description]
      properties:
        name: { $ref: '#/components/schemas/Provider' }
        label: { type: string }
        secret_fields:
          type: array
          items:
            type: object
            required: [key, label, help]
            properties:
              key: { type: string }
              label: { type: string }
              help: { type: string }
              pattern: { type: string, description: A regular-expression **source**, not a compiled RegExp. }
        config_fields:
          type: array
          items:
            type: object
            required: [key, label, type, required]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, email, enum, duration, multiselect] }
              required: { type: boolean }
              options: { type: array, items: { type: string } }
              default: {}
              help: { type: string }
        capabilities:
          type: object
          description: Facts the rest of the service branches on, not decoration.
          required: [partial_refund, multiple_partial_refunds, refund_idempotency_key, signed_callbacks, echoes_amount_on_create, decrements_amount_on_refund, supported_currencies]
          properties:
            partial_refund: { type: boolean }
            multiple_partial_refunds: { type: boolean }
            refund_idempotency_key: { type: boolean, description: Barion does **not** accept one. }
            signed_callbacks: { type: boolean, description: Barion's IPN is **not** signed, which is why state is always re-fetched. }
            echoes_amount_on_create: { type: boolean }
            decrements_amount_on_refund:
              type: boolean
              description: Barion's payment total drops as refunds settle; Stripe's `amount_total` never moves.
            supported_currencies:
              type: array
              items: { $ref: '#/components/schemas/Currency' }
        callback_path_template: { type: string, examples: ['/v1/providers/barion/ipn/{merchantPublicId}'] }
        test_description: { type: string, description: What the read-only probe does, shown to the operator before they run it. }

    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [merchant_public_id, credential_id, refund_reserved_minor, refund_settled_minor, refundable_minor, request_id, last_refreshed_at, unmapped_status_at]
          properties:
            merchant_public_id: { type: string, format: uuid }
            credential_id: { type: [string, 'null'], format: uuid }
            refund_reserved_minor: { $ref: '#/components/schemas/MinorAmount' }
            refund_settled_minor: { $ref: '#/components/schemas/MinorAmount' }
            refundable_minor:
              allOf:
                - $ref: '#/components/schemas/MinorAmount'
              description: '`amount_minor - refund_reserved_minor`. The number to send as a refund amount.'
            request_id: { type: [string, 'null'] }
            last_refreshed_at: { type: [string, 'null'], format: date-time }
            unmapped_status_at:
              type: [string, 'null']
              format: date-time
              description: |
                Stamped when a PSP reported a status we have no mapping for. A column rather
                than a derived query, because Stripe's `provider_status` is a composite and
                "is this one we know?" cannot be reconstructed after the fact.

    AdminRefund:
      allOf:
        - $ref: '#/components/schemas/Refund'
        - type: object
          required: [merchant_public_id]
          properties:
            merchant_public_id: { type: string, format: uuid }

    ProviderEvent:
      type: object
      description: |
        One inbound PSP callback. The raw body and the recorded headers are **not** exposed;
        they stay in `provider_events` for dispute evidence.
      required: [id, provider, mode, method, path, query, provider_event_id, signature_verified, processing_status, attempts, error, received_at, processed_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        mode: { type: [string, 'null'] }
        method: { type: string }
        path: { type: string }
        query: { type: object, additionalProperties: { type: string } }
        provider_event_id: { type: [string, 'null'], description: Stripe has one; Barion does not. }
        signature_verified: { type: boolean, description: Always false for Barion, which signs nothing. }
        processing_status:
          type: string
          enum: [pending, done, ignored, failed]
          description: |
            `ignored` carries a reason in `error` — `unknown_payment`, `unknown_merchant`,
            `merchant_mismatch`, `duplicate_event`, `no_payment_id`. `pending` with reason
            `rate_limited` means an IPN burst was deferred to the sweeper.
        attempts: { type: integer, description: A climbing count on a `failed` event is a poison event. }
        error: { type: [string, 'null'] }
        received_at: { type: string, format: date-time }
        processed_at: { type: [string, 'null'], format: date-time }

    AdminPaymentDetail:
      type: object
      required: [payment, refunds, timeline]
      properties:
        payment: { $ref: '#/components/schemas/AdminPayment' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        timeline:
          type: array
          description: Every inbound PSP callback for this payment, oldest first.
          items: { $ref: '#/components/schemas/ProviderEvent' }

    ReconcileRequest:
      oneOf:
        - type: object
          title: mark_failed
          description: Use when you have confirmed at the PSP that no payment exists.
          required: [action, reason]
          properties:
            action: { const: mark_failed }
            reason: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          title: attach
          description: |
            Links an orphan found in the PSP dashboard. **Does not transition** — run
            `POST /refresh` afterwards and let the provider's answer drive the status.
          required: [action, reason, provider_payment_id]
          properties:
            action: { const: attach }
            reason: { type: string, minLength: 1 }
            provider_payment_id: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          title: release
          description: |
            **Deletes the row**, freeing the merchant's idempotency key. Valid only on an
            `initializing` payment with no `provider_payment_id`. The row is snapshotted into
            the audit trail first.
          required: [action, reason]
          properties:
            action: { const: release }
            reason: { type: string, minLength: 1 }
          additionalProperties: false

    ReconcileResult:
      oneOf:
        - $ref: '#/components/schemas/AdminPayment'
        - type: object
          title: released
          required: [released]
          properties:
            released: { const: true }
            public_id: { type: string, format: uuid }

    WebhookEndpoint:
      type: object
      required: [id, merchant_public_id, url, subscribed_events, enabled, disabled_reason, consecutive_failures, secret_last4, secret_fingerprint, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        merchant_public_id: { type: string, format: uuid }
        url:
          type: string
          description: |
            HTTPS on port 443, and validated against private/link-local ranges at save time
            **and again at delivery time**, because DNS can be re-pointed in between.
        subscribed_events:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/WebhookEventType' }
            - type: 'null'
          description: '`null` means every event type, which is the default. An empty array is rejected on write.'
        enabled: { type: boolean }
        disabled_reason:
          type: [string, 'null']
          description: Set when 5 consecutive dead-lettered deliveries auto-disabled the endpoint.
        consecutive_failures: { type: integer, description: Reset by any 2xx, and by a save. }
        secret_last4: { type: string }
        secret_fingerprint: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertWebhookEndpointRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, examples: ['https://acme.example.com/api/payment-webhook'] }
        subscribed_events:
          oneOf:
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/WebhookEventType' }
            - type: 'null'
          description: 'Omitted or `null` means every event type. `[]` is rejected.'
        rotate_secret:
          type: boolean
          default: false
          description: |
            Mint a new secret even though one exists. The previous one stops working
            **immediately** — there is no grace period, so coordinate with the merchant's deploy.

    MintedWebhookEndpoint:
      type: object
      required: [key, secret, warning]
      properties:
        key: { $ref: '#/components/schemas/WebhookEndpoint' }
        secret:
          type: string
          description: The plaintext `whsec_` signing secret. **Shown once.** The whole string, prefix included, is the HMAC key.
          examples: ['whsec_YOUR_SIGNING_SECRET']
        warning: { type: string }

    CurrencyTotal:
      type: object
      required: [currency, count, amount_minor]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        count: { type: integer }
        amount_minor:
          allOf:
            - $ref: '#/components/schemas/MinorAmount'
          description: Never summed across currencies.

    HealthStrip:
      type: object
      required: [status, database, encryption_key_configured, stuck_payments, failing_credentials, dead_lettered_deliveries, disabled_webhook_endpoints, unmapped_provider_statuses_24h]
      properties:
        status:
          type: string
          enum: [ok, attention, degraded]
          description: |
            Derived by **blast radius, not severity**. `degraded`: someone cannot take payments,
            or we cannot tell — database unreachable, no encryption key, any failing credential,
            any disabled webhook endpoint. `attention`: something needs a human while payments
            still flow.
        database: { type: string, enum: [ok, unreachable] }
        encryption_key_configured: { type: boolean, description: Without a KEK no credential can be decrypted. }
        stuck_payments:
          type: integer
          description: 'Drill-down: `GET /admin/payments/stuck`. A handful is the normal residue of buyers closing tabs.'
        failing_credentials: { type: integer, description: 'Drill-down: `GET /admin/credentials?failing=true`.' }
        dead_lettered_deliveries: { type: integer, description: 'Drill-down: `GET /admin/webhook-deliveries?status=dead_lettered`.' }
        disabled_webhook_endpoints: { type: integer, description: 'Drill-down: `GET /admin/webhook-endpoints?enabled=false`.' }
        unmapped_provider_statuses_24h:
          type: integer
          description: |
            The early-warning signal that a PSP added an enum value. It typically fires weeks
            before it matters.

    AuditEntry:
      type: object
      description: |
        Append-only. `actor_id` carries **no foreign key**, so the trail stays readable after a
        key is revoked — history has to outlive the row it points at.
      required: [id, actor_type, actor_id, actor_label, action, target_type, target_id, metadata, ip, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: string, enum: [admin_key, system] }
        actor_id: { type: [string, 'null'] }
        actor_label:
          type: string
          description: "Denormalised. CLI actions record `scripts/<name>.ts` with `actor_type: system`."
        action: { type: string, examples: [payment.refund] }
        target_type: { type: string, examples: [payment] }
        target_id: { type: [string, 'null'] }
        metadata:
          type: object
          additionalProperties: true
          description: |
            An **allowlisted summary per action**, never a raw request body — that is what keeps
            a plaintext PSP key out of a table which is not encrypted.
        ip: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
