openapi: 3.1.0

# ---------------------------------------------------------------------------
# This spec is the authority on SHAPES. The Markdown in this folder is the
# authority on BEHAVIOUR. Where they disagree, the Markdown wins and this file
# is the bug — fix it here.
#
# Every path below is registered in src/app.ts, and a test
# (src/__tests__/docs/openapi.test.ts) compares the two lists in both
# directions, so a route without an operation and an operation without a route
# both fail the build.
# ---------------------------------------------------------------------------

info:
  title: payment-service
  version: 0.1.0
  summary: Multi-merchant payment broker for Stripe and Barion.
  description: |
    Lamido's client websites integrate against one uniform REST API; this service talks to
    **Stripe** or **Barion** using each merchant's own credentials.

    Three surfaces, three credentials:

    | Surface | Prefix | Auth |
    |---|---|---|
    | Merchant | `/v1/*` | `Authorization: Bearer pmk_…` |
    | Admin | `/v1/admin/*` | `Authorization: Bearer pad_…` plus scopes |
    | Provider callback | `/v1/providers/*` | none (Barion) / HMAC (Stripe) — **not for you to call** |

    **HUF has zero minor units in this API.** `"1000"` HUF means 1000 Ft, not 10.00 Ft.
    This deviates from ISO 4217 deliberately. EUR is 2-decimal, so `"1000"` EUR is €10.00.
    Every amount is a decimal string of minor units, never a JSON number, because JSON
    numbers lose precision above 2^53.

    Errors are RFC 9457 Problem Details on every surface, served as
    `application/problem+json`. Branch on `type`, never on `title` or `detail`. Every problem
    carries `request_id`; a validation 400 also carries `errors[]`, one entry per bad field,
    addressed by JSON Pointer.
  license:
    name: UNLICENSED
  x-docs:
    merchant: merchant-api.md
    admin: admin-api.md
    runbook: runbook.md

servers:
  # The deployment host is deliberately absent from this pinned copy. No host ships in
  # a tarball, and contracts/ is one `files` mistake away from being published — see
  # docs/plans/phase-1-foundations.md §4. The consuming project supplies the base URL
  # from its own environment; the SDK has no fallback.
  - url: "{baseUrl}"
    description: Supplied by the consuming project from its own environment.
    variables:
      baseUrl:
        default: https://payment.example.com
        description: Documentation placeholder, not a usable default.

tags:
  - name: Merchant payments
    description: Create and read payments with a `pmk_` key.
  - name: Merchant refunds
    description: Refund payments with a `pmk_` key.
  - name: Merchant webhooks
    description: A merchant's own outbound-delivery queue.
  - name: Provider callbacks
    description: Inbound PSP traffic. Documented so the URLs are unambiguous; never called by an integrator.
  - name: Observability
    description: Public liveness.
  - name: Admin self
  - name: Admin merchants
  - name: Admin credentials
  - name: Admin payments
  - name: Admin refunds
  - name: Admin webhooks
  - name: Admin stats
  - name: Admin keys
  - name: Admin audit
  - name: Cron

security:
  - MerchantKey: []

paths:
  # =========================================================================
  # Observability
  # =========================================================================
  /:
    get:
      operationId: getLandingPage
      tags: [Observability]
      summary: A static landing page for a human who typed the domain.
      description: |
        HTML, no auth, no browser tripwire, `Cache-Control: public, max-age=3600`. Added at
        `d18882f`. Exists so the root of an API host does not answer a problem document to a
        browser, which reads as an outage. Scoped to `/` exactly; every other unknown path
        still returns the problem document, and a non-`GET` here is a `404`.

        **Not a health check** — the body is a compile-time constant served without touching
        the database, so it stays `200` through a total outage. Use `/healthz`, and read its
        body.
      security: []
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /healthz:
    get:
      operationId: getHealthz
      tags: [Observability]
      summary: Liveness plus a database ping.
      description: |
        Public, unauthenticated, and not subject to the browser tripwire.

        **Always answers 200, including when the database is unreachable.** The status code
        answers "should the platform restart this instance?", and while the process is still
        serving requests the answer is no — a 503 would drain every instance at once during a
        database blip. The verdict is in the body: **alert on `status != "ok"`, never on the
        HTTP status.** Use the authenticated `GET /v1/admin/health` when a status code has to
        carry the database's state.

        On failure the body carries the driver's error **code only** — its message contains
        the connection string.
      security: []
      responses:
        '200':
          description: |
            Alive. `status` is `ok` when the database responded and `degraded` when it did not;
            both are 200. `version`, `commit` and `now` are present on either branch.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HealthOk'
                  - $ref: '#/components/schemas/HealthDegraded'

  # =========================================================================
  # Merchant tier
  # =========================================================================
  /v1/payments:
    post:
      operationId: createPayment
      tags: [Merchant payments]
      summary: Create a payment and get a gateway URL.
      description: |
        Calls the PSP, so this is the one merchant endpoint with real latency. Redirect the
        buyer's browser to `gateway_url`.

        Returns **201** for a new payment and **200** with `Idempotent-Replay: true` for a
        replay of an identical request, because a replay created nothing.

        A **502** does not mean nothing happened: read `detail`. A definitive rejection may be
        retried with the same key once the request is fixed; an unreachable provider leaves the
        outcome unknown and the only safe retry is with the **same** `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
            examples:
              full:
                summary: Every field
                value:
                  merchant_payment_ref: order-12345
                  amount_minor: '2500'
                  currency: HUF
                  provider: barion
                  metadata: { cart_id: c_88f1 }
              minimal:
                summary: The least that works
                value:
                  merchant_payment_ref: order-12345
                  amount_minor: '2500'
                  currency: HUF
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: A replay of an earlier identical request. Nothing was created.
          headers:
            Idempotent-Replay:
              schema: { const: 'true' }
              description: Present only on a replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '409': { $ref: '#/components/responses/IdempotencyConflictProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /v1/payments/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    get:
      operationId: getPayment
      tags: [Merchant payments]
      summary: Read one payment.
      description: |
        **Side effect:** a payment past its `expires_at` and still open is lazily checked with
        the PSP once and may transition to `expired`. That sweep can never fail the read.

        An id belonging to another merchant returns **404**, never 403, so ids cannot be probed
        for existence.
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/payments/{public_id}/refresh:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: refreshPayment
      tags: [Merchant payments]
      summary: Force a re-read of authoritative provider state.
      description: |
        Reconciliation, **not polling**. Throttled to one call per payment per 5 seconds; a
        second call inside the window is a 429 carrying the wait in both a `Retry-After`
        header and a `retry_after` member, and makes no provider call. A payment already in
        a terminal status returns immediately.
      responses:
        '200':
          description: The payment, transitioned if the provider's state had moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RefreshThrottledProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /v1/payments/{public_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: createRefund
      tags: [Merchant refunds]
      summary: Refund a payment, in whole or in part.
      description: |
        **Moves real money, with no confirmation step** — this is a server-to-server API and
        the caller's own backend owns the confirmation UX.

        `amount_minor` and `currency` are both required. `currency` is an assertion, not an
        instruction: both PSPs key a refund off the original transaction. It exists so
        "refund 500 EUR" against a HUF payment cannot be silently read as 500 HUF.

        The remaining balance is enforced by a database CHECK constraint, so two concurrent
        refunds cannot together exceed the payment; the loser gets
        `422 refund_exceeds_remaining`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
            examples:
              partial:
                value: { amount_minor: '1000', currency: HUF, reason: 'Two items returned, ticket #812' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '200':
          description: A replay of an earlier identical request. Nothing was refunded.
          headers:
            Idempotent-Replay:
              schema: { const: 'true' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/IdempotencyConflictProblem' }
        '422': { $ref: '#/components/responses/RefundStateProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }
    get:
      operationId: listPaymentRefunds
      tags: [Merchant refunds]
      summary: Every refund of one payment.
      description: Oldest first. Not paginated — the refund cap bounds the list by construction.
      responses:
        '200':
          description: The refunds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/refunds/{public_id}:
    parameters:
      - $ref: '#/components/parameters/RefundPublicId'
    get:
      operationId: getRefund
      tags: [Merchant refunds]
      summary: Read one refund.
      description: |
        **Side effect:** a refund whose outcome is unknown is reconciled here, which may make
        one provider call. It cannot fail the read. This is the call to make when chasing an
        `outcome_unknown: true`.
      responses:
        '200':
          description: The refund.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/webhook-deliveries:
    get:
      operationId: listOwnWebhookDeliveries
      tags: [Merchant webhooks]
      summary: A merchant's own webhook queue.
      description: |
        Newest first, not cursor-paginated. Exists so an integrator can answer "why didn't I
        get the event?" themselves. The payload is deliberately not included.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `pending`, because the common question is "what is stuck?".
          schema:
            type: string
            enum: [pending, delivered, dead_lettered, all]
            default: pending
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: The deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }

  # =========================================================================
  # Provider callbacks — documented so the URLs are unambiguous
  # =========================================================================
  /v1/providers/barion/ipn/{merchantPublicId}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicIdPath'
    post:
      operationId: barionIpn
      tags: [Provider callbacks]
      summary: Barion's IPN. Called by Barion, never by an integrator.
      description: |
        The value to paste into the Barion shop settings is returned as `callback_url` by
        `PUT /v1/admin/merchants/{public_id}/credentials/barion` — do not build it by hand.

        **Barion sends no body**; `paymentId` arrives in the query string and the `Content-Type`
        may be absent. No body parser may be registered on this path: one would answer 415
        before the handler runs, and the only symptom is "endpoint failing" in the Barion
        dashboard.

        **Always answers 200** — unknown payment ids, missing parameters and internal failures
        included — inside Barion's 15-second deadline. A non-200 makes Barion retry and
        eventually flag the endpoint; recovery here is the sweeper and `POST /refresh`.

        The callback is treated as a hint, never a fact: authoritative state is re-fetched from
        Barion before any transition.
      security: []
      parameters:
        - name: paymentId
          in: query
          required: false
          description: Barion's payment id, bare 32-hex or dashed. Both spellings are resolved.
          schema: { type: string }
      responses:
        '200':
          description: Received. The only response this endpoint produces.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { const: true }

  /v1/providers/stripe/webhook/{merchantPublicId}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicIdPath'
    post:
      operationId: stripeWebhook
      tags: [Provider callbacks]
      summary: Stripe's webhook. Called by Stripe, never by an integrator.
      description: |
        Normally created automatically on the merchant's Stripe account during onboarding, so
        there is nothing to paste. The HMAC covers the exact bytes Stripe sent, so the raw body
        is read before anything else touches the request.

        Status codes are deliberately unlike Barion's, because Stripe's retry behaviour is
        worth using: **400** for a bad, stale or absent signature and for an unknown merchant
        or unusable credential (re-sending will not fix a configuration problem, and the
        dashboard is where someone can act on it); **500** when processing failed or we are
        rate limited, because Stripe then retries with backoff for days.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: A Stripe Event. Verified against the merchant's own signing secret.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Processed, or nothing to do.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }
        '400':
          description: Signature rejected, unknown merchant, or a credential we cannot use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }
        '500':
          description: Processing failed, or rate limited. Stripe should retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackAck' }

  # =========================================================================
  # Cron
  # =========================================================================
  /api/cron/webhooks:
    get:
      operationId: cronDrainWebhooksGet
      tags: [Cron]
      summary: Drain the due webhook queue. Invoked by Vercel Cron.
      description: |
        Requires `Authorization: Bearer $CRON_SECRET` and **fails closed when `CRON_SECRET` is
        unset** — an unauthenticated queue drain is a free denial-of-service against every
        merchant endpoint we have. Vercel Cron issues a `GET`; the `POST` form exists so an
        operator can prove the path by hand. One handler, so the two cannot drift.
      security:
        - CronSecret: []
      responses:
        '200':
          description: What the drain did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainSummary' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
    post:
      operationId: cronDrainWebhooksPost
      tags: [Cron]
      summary: Drain the due webhook queue, by hand.
      description: The same handler as the `GET`, for an operator invoking it manually.
      security:
        - CronSecret: []
      responses:
        '200':
          description: What the drain did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainSummary' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }

  # =========================================================================
  # Admin — self and health
  # =========================================================================
  /v1/admin/me:
    get:
      operationId: adminMe
      tags: [Admin self]
      summary: Introspect the calling key. No scope required.
      description: The first call lamido-admin should make, to decide which navigation to render.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The calling key.
          content:
            application/json:
              schema:
                type: object
                required: [id, label, scopes, allowed_ips, last_used_at]
                properties:
                  id: { type: string, format: uuid }
                  label: { type: string }
                  scopes:
                    type: array
                    items: { $ref: '#/components/schemas/AdminScope' }
                  allowed_ips:
                    type: array
                    items: { type: string }
                    description: CIDRs. **Empty means unrestricted**, which is the default.
                  last_used_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }

  /v1/admin/health:
    get:
      operationId: adminHealth
      tags: [Admin self]
      summary: The dashboard strip. No scope required.
      description: |
        **Always HTTP 200, even when it reports `degraded`** — a monitoring check needs the
        status code to mean "the strip itself is broken" and nothing else. Read the body.

        When the database is unreachable the counts read zero and `database` reads
        `unreachable`.

        `status` is derived from the counts by **blast radius, not severity**: `degraded` means
        someone cannot take payments, `attention` means something needs a human while payments
        still flow. Every count has a drill-down, and the count query and the listing filter
        are the same predicate.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The strip. Note the status code does not reflect `status`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStrip' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/BrowserTripwireProblem' }

  /v1/admin/providers:
    get:
      operationId: adminProviderCatalog
      tags: [Admin self]
      summary: The provider catalog that drives the generic credential form.
      description: |
        A new PSP therefore needs no admin UI work. Wrapper keys are snake_case; the `key`
        inside each field is **not**, because it is the literal property name the credential
        upsert body expects.
      security:
        - AdminKey: []
      responses:
        '200':
          description: One descriptor per provider.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProviderDescriptor' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  # =========================================================================
  # Admin — merchants
  # =========================================================================
  /v1/admin/merchants:
    get:
      operationId: adminListMerchants
      tags: [Admin merchants]
      summary: Browse and search merchants.
      security:
        - AdminKey: []
      parameters:
        - name: q
          in: query
          required: false
          description: Matches the name, the external ref **and** the public id — an operator arrives holding whichever of the three was read out to them.
          schema: { type: string }
        - name: active
          in: query
          required: false
          schema: { type: boolean }
        - name: external_ref
          in: query
          required: false
          description: |
            `missing` narrows to merchants lamido-admin has not paired with an account — the
            drill-down behind `tenants_without_external_ref` on admin health, binding **that
            count's own predicate**.

            A literal rather than a boolean because the only useful direction is the absent one:
            "merchants that have one" is every other merchant, which omitting the filter already
            gives.
          schema: { type: string, enum: [missing] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of merchants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMerchant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
    post:
      operationId: adminCreateMerchant
      tags: [Admin merchants]
      summary: Provision a merchant, with its first API key.
      description: |
        Returns the merchant **plus a one-time `pmk_` key**. The plaintext is shown once; only
        its SHA-256 is stored.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMerchantRequest' }
      responses:
        '201':
          description: Created, with the one-time merchant key.
          content:
            application/json:
              schema:
                type: object
                required: [merchant, api_key]
                properties:
                  merchant: { $ref: '#/components/schemas/AdminMerchant' }
                  api_key: { $ref: '#/components/schemas/MintedMerchantKey' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /v1/admin/merchants/{public_id}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminGetMerchant
      tags: [Admin merchants]
      summary: One merchant.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The merchant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMerchant' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    patch:
      operationId: adminUpdateMerchant
      tags: [Admin merchants]
      summary: Amend a merchant.
      description: |
        **`null` is meaningful and distinct from absent**: absent leaves a field alone, `null`
        clears it. That is the only way to remove a redirect template.

        `external_ref` is accepted only at creation and has no PATCH. A `default_currency` that
        lands outside the stored `allowed_currencies` is a 409 — the rule is checked against
        the merged result, not against the body.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMerchantRequest' }
      responses:
        '200':
          description: The merchant as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMerchant' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /v1/admin/merchants/{public_id}/api-keys:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminListMerchantKeys
      tags: [Admin merchants]
      summary: A merchant's API keys, including revoked ones.
      description: Not paginated. `key_hash` is never returned.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MerchantApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    post:
      operationId: adminMintMerchantKey
      tags: [Admin merchants]
      summary: Mint an additional merchant key.
      description: 'The rotation path: mint, let the merchant deploy, then revoke the old one.'
      security:
        - AdminKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: [string, 'null'], examples: [staging] }
      responses:
        '201':
          description: The new key. Plaintext shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedMerchantKey' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/api-keys/{id}:
    parameters:
      - $ref: '#/components/parameters/InternalId'
    delete:
      operationId: adminRevokeMerchantKey
      tags: [Admin merchants]
      summary: Revoke a merchant key.
      description: |
        A **soft revoke**: the row stays and `revoked_at` is stamped, so a leaked-credential
        post-mortem still has the evidence that the key existed. Idempotent — re-revoking
        returns 200 with the unchanged timestamp.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The revoked key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # =========================================================================
  # Admin — credentials
  # =========================================================================
  /v1/admin/credentials:
    get:
      operationId: adminListFailingCredentials
      tags: [Admin credentials]
      summary: The drill-down behind the health strip's `failing_credentials` count.
      description: |
        Exists **only** to serve that tile, so it takes the one filter that maps onto the
        count's predicate and nothing richer — a second definition of "failing" is a second
        definition waiting to disagree with the first. Not paginated: a list long enough to
        need a cursor is the incident, not an ergonomics problem.
      security:
        - AdminKey: []
      parameters:
        - name: failing
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The credentials, each with its merchant.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Credential'
                    - type: object
                      required: [merchant_public_id]
                      properties:
                        merchant_public_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/merchants/{public_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminListMerchantCredentials
      tags: [Admin credentials]
      summary: Everything configured for a merchant, current and past.
      description: |
        Includes **inactive** rows: deactivating leaves the row behind as history, and "what
        was configured before the switch to live?" is an incident question. Never returns a
        secret.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The credentials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/merchants/{public_id}/credentials/{provider}:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
      - $ref: '#/components/parameters/ProviderName'
    put:
      operationId: adminUpsertCredential
      tags: [Admin credentials]
      summary: Store or amend a merchant's PSP credential.
      description: |
        **Never log this request body.** It carries plaintext PSP secrets.

        Four behaviours matter, and the first two read alike while being asymmetric:

        - An omitted `secrets` field **keeps its stored ciphertext** — editing a label cannot
          blank a working POSKey.
        - `config` is **replaced wholesale**. A PUT that omits it drops every setting, so the
          admin UI must always resend the full config object, even when only the label changed.
        - Supplying a secret **voids the previous test verdict**; the credential stops resolving
          for payments until re-tested. The alternative is charging buyers through an unproven
          key.
        - **The mode of an active credential cannot change** (409). Barion POSKeys are UUIDs in
          both environments with no prefix to tell them apart, so an in-place mode edit is an
          undetectable way to point a sandbox key at live money.

        The response carries `callback_url`, already resolved for this merchant — the value to
        paste into the PSP dashboard, so nobody builds it by hand.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertCredentialRequest' }
            examples:
              barion:
                value:
                  mode: sandbox
                  label: Acme Barion sandbox
                  secrets: { posKey: 'YOUR_POSKEY' }
                  config: { payeeEmail: shop@acme.example.com, defaultLocale: hu-HU }
              stripe:
                value:
                  mode: sandbox
                  secrets: { secretKey: sk_test_YOUR_KEY, webhookSecret: whsec_YOUR_SECRET }
                  config: { defaultLocale: hu }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialWithCallback' }
        '200':
          description: Amended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialWithCallback' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
    delete:
      operationId: adminDeactivateCredential
      tags: [Admin credentials]
      summary: Deactivate a merchant's credential.
      description: The row stays as history and the single active slot frees for a replacement.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The deactivated credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/merchants/{public_id}/credentials/{provider}/test:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
      - $ref: '#/components/parameters/ProviderName'
    post:
      operationId: adminTestCredential
      tags: [Admin credentials]
      summary: Probe a credential, read-only.
      description: |
        **HTTP 200 even when `ok` is `false`** — a failed probe is a fact about the credential,
        not a failure of the request, and a 4xx would send it through generic error handling and
        lose the message that says why.

        `details.reason` is machine-readable so the UI can offer the right remedy:
        `live_blocked` (this deployment has live traffic switched off), `decrypt_failed` (the
        KEK was rotated), `probe_failed` (the adapter itself threw).

        Never issues, captures or refunds anything.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The verdict. Check `ok`, not the status code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialTestResult' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # =========================================================================
  # Admin — payments
  # =========================================================================
  /v1/admin/payments:
    get:
      operationId: adminListPayments
      tags: [Admin payments]
      summary: Browse payments across merchants.
      description: |
        Not searchable by amount or by anything about a buyer: this service holds no buyer PII,
        and an endpoint that looked like it did would invite operators to try.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: provider
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Provider' }
        - name: currency
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Currency' }
        - name: merchant_payment_ref
          in: query
          required: false
          description: Exact match.
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPayment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/payments/stuck:
    get:
      operationId: adminListStuckPayments
      tags: [Admin payments]
      summary: The stuck queue, oldest first.
      description: |
        **Registered before `/v1/admin/payments/{public_id}`** — the other way round, `stuck`
        reaches the detail handler as a public id and the symptom is a 400 on a path that looks
        perfectly correct.

        `total` is the **unfiltered** count, the same number the health strip shows, so
        narrowing by merchant does not change the figure the operator clicked.
      security:
        - AdminKey: []
      parameters:
        - name: olderThanMinutes
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 43200, default: 15 }
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stuck payments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    required: [total, older_than_minutes]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPayment' }
                      total:
                        type: integer
                        description: Unfiltered count — what the health strip shows.
                      older_than_minutes: { type: integer }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/payments/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    get:
      operationId: adminGetPayment
      tags: [Admin payments]
      summary: One payment, its refunds, and every inbound PSP callback.
      description: |
        `timeline` is the answer to "the merchant says Barion notified you and nothing
        happened", which is unanswerable without it. The raw callback body and the recorded
        headers are **not** included; they stay in `provider_events` for dispute evidence.

        Unlike the merchant read, this runs **no expiry sweep**: an operator inspecting a
        payment sees the row as it is, not as their own page load has just rearranged it.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The payment, its refunds and its callback timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/payments/{public_id}/refresh:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: adminRefreshPayment
      tags: [Admin payments]
      summary: Re-read authoritative provider state.
      description: |
        Shares the merchant tier's **5-second per-payment throttle**, which is a column on the
        payment. That throttle protects the PSP's API rather than ours, so exempting operators
        would aim the difference at the wrong party.

        Reading state is not changing it, so this needs only `payments:read`.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The payment, transitioned if the provider's state had moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPayment' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RefreshThrottledProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /v1/admin/payments/{public_id}/reconcile:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: adminReconcilePayment
      tags: [Admin payments]
      summary: Resolve a payment the provider cannot resolve for us.
      description: |
        For the residue `POST /refresh` cannot fix. A discriminated union on `action`, because
        the three actions differ in what they need and in how much damage they do. `reason` is
        required on all three and is recorded in the audit entry.

        **Every reconcile body is validated strictly**: an unrecognised field is a 400 rather
        than silently dropped. Elsewhere unknown keys are ignored, but
        `{"action":"release","provider_payment_id":"…"}` reads to a human as "release this
        specific provider payment", and silently ignoring the field would release whatever the
        row happened to be.

        `release` is the **only destructive action in the admin API**. It requires
        `initializing` status (`422 not_releasable`) and a null `provider_payment_id`
        (`422 known_to_provider`), and the row is snapshotted into `audit_log.metadata` before
        the delete.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileRequest' }
      responses:
        '200':
          description: The payment as it now stands, or a released confirmation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/ReconcileStateProblem' }

  /v1/admin/payments/{public_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/PaymentPublicId'
    post:
      operationId: adminCreateRefund
      tags: [Admin refunds]
      summary: Refund a payment as an operator. Moves real money.
      description: |
        `amount_minor` is required — there is no "refund the rest" default, exactly as on the
        merchant tier. The operator is looking at `refundable_minor` when they click, so send
        the number they saw. The currency comes from the payment.

        There is **no `Idempotency-Key` header** here: an operator clicking a button has none to
        supply. Double-click protection is the CHECK constraint on `payments` — the second
        reserve against the cap is refused by Postgres, not by an `if`. The admin UI should
        still gate the action behind a retype.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              additionalProperties: false
              properties:
                amount_minor: { $ref: '#/components/schemas/MinorAmount' }
                reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: The refund.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422': { $ref: '#/components/responses/RefundStateProblem' }
        '502': { $ref: '#/components/responses/ProviderProblem' }

  /v1/admin/refunds:
    get:
      operationId: adminListRefunds
      tags: [Admin refunds]
      summary: Browse refunds across merchants.
      description: |
        `outcome_unknown=true` is the operationally important filter: it is the reconciler's
        backlog, money that may or may not have moved. The reconciler clears these on its own,
        so a handful at any moment is normal and a growing count is not.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: outcome_unknown
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of refunds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminRefund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/refunds/{public_id}:
    parameters:
      - $ref: '#/components/parameters/RefundPublicId'
    get:
      operationId: adminGetRefund
      tags: [Admin refunds]
      summary: One refund.
      description: |
        Runs **no reconciliation sweep**, unlike the merchant read. An operator called about a
        refund whose outcome is unknown must see that it is unknown, not have the page load
        quietly resolve it into a different answer.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The refund.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRefund' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  # =========================================================================
  # Admin — webhooks
  #
  # This surface is IDENTICAL in every service of the estate, varying only in the
  # tenant collection segment (`merchants` here, `clients`, `sites` elsewhere).
  # lamido-admin drives all five from one screen with one client, so a route or a
  # member that exists only here is paid for in that repository forever. Adding
  # one is a house-rules change, not a local decision.
  #
  # Endpoints are addressed by `public_id`, never the internal row id.
  # =========================================================================
  /v1/admin/event-types:
    get:
      operationId: adminListEventTypes
      tags: [Admin webhooks]
      summary: The event catalogue, as data.
      description: |
        **The highest-leverage route on this surface.** Build an admin UI's trigger picker on
        this, never on a hardcoded array — otherwise every new event type in any of five
        services needs a change in a sixth repository, which means it will be wrong, silently,
        and the symptom is an operator who cannot subscribe to an event that exists.

        Served from the same array that validates a subscription, drives the emitter and backs
        the catalogue table in the published conventions, so the four cannot disagree.

        Wrapped in a page with a `null` cursor even though the set is small and static: it is a
        collection, collections go in an envelope, and a client that special-cases one
        collection shape will get the next one wrong.

        `webhook.ping` is deliberately **absent** — it is reserved estate-wide, in no
        catalogue, and not subscribable.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The whole catalogue. `next_cursor` is always `null`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WebhookEventTypeDescriptor' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/webhook-endpoints:
    get:
      operationId: adminListWebhookEndpoints
      tags: [Admin webhooks]
      summary: Every endpoint, across merchants.
      description: |
        `enabled=false` is the drill-down behind the health strip's
        `disabled_webhook_endpoints` count and binds **that count's own predicate**, which is
        what keeps the tile and the list it opens in agreement.

        `event_type` is the **trigger-first** view — "on `payment.succeeded`, call these three
        endpoints" — which is the question an operator actually has. It is the subscription
        relation read from the other side, derived on read; the inverse is never stored.

        Cursor-paginated, which it was not when a merchant could hold only one endpoint.
      security:
        - AdminKey: []
      parameters:
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
        - name: event_type
          in: query
          required: false
          description: |
            Narrow to endpoints that would receive this type — including those with
            `subscribed_events: null`, which receive everything.

            **This filter is applied in memory, after the page is read**, because
            `subscribed_events` is a jsonb array where `null` means "every type" and the
            predicate has no index to use. A page may therefore come back **short of
            `limit`** without meaning the end of the collection. Follow `next_cursor`, never
            a short page, to decide when to stop.
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of endpoints.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/merchants/{public_id}/webhook-endpoints:
    parameters:
      - $ref: '#/components/parameters/MerchantPublicId'
    get:
      operationId: adminListMerchantWebhookEndpoints
      tags: [Admin webhooks]
      summary: This merchant's endpoints.
      description: |
        A **`200` with an empty array** when the merchant has none — the opposite of the
        singular route this replaces, which 404'd. "This merchant receives no webhooks" was
        worth a status code when there could be at most one endpoint; over a collection it is
        simply an empty collection, and 404ing it would make a client branch on a status to
        render a table with no rows.

        Not paginated: twenty is the schema's own ceiling for one merchant.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The endpoints, oldest first. `[]` when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    post:
      operationId: adminCreateWebhookEndpoint
      tags: [Admin webhooks]
      summary: Add a destination.
      description: |
        The signing secret is returned **once**, here, and never again. It is wrapped the way a
        minted API key is wrapped rather than being a sometimes-null field on the endpoint, so
        a client cannot build a UI that expects to read it back.

        There is **no upsert**. The `PUT` this replaces meant "replace this merchant's
        endpoint", which has no meaning once there are many, so it was deleted rather than
        redefined — a route whose semantics silently changed is worse than one that 404s.

        A merchant may hold up to **20**; a 21st is `409 endpoint_limit_reached`.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookEndpointRequest' }
      responses:
        '201':
          description: Created, with the one-time signing secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedWebhookEndpoint' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409':
          description: |
            The merchant already holds the maximum of 20 endpoints
            (`code: endpoint_limit_reached`, with `limit`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/webhook-endpoints/{public_id}:
    parameters:
      - $ref: '#/components/parameters/EndpointPublicId'
    get:
      operationId: adminGetWebhookEndpoint
      tags: [Admin webhooks]
      summary: One endpoint.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    patch:
      operationId: adminPatchWebhookEndpoint
      tags: [Admin webhooks]
      summary: Change the configuration.
      description: |
        Must change at least one field; an empty body is a `400`.

        **Does not re-enable and does not clear `consecutive_failures`** — the one behaviour
        deliberately dropped from the `PUT` it replaces. Bundling "the destination is good now"
        into every field change meant that fixing a typo in a URL silently re-armed an endpoint
        that had been auto-disabled for a week, and the operator who did it had no idea.
        `POST …/enable` says that, and says only that.

        `contract_version` is absent on purpose: moving a live endpoint between envelope
        versions changes the bytes its receiver verifies, which is a new endpoint, not an edit.

        The audit entry records **which fields changed, not their values**.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchWebhookEndpointRequest' }
      responses:
        '200':
          description: The endpoint as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
    delete:
      operationId: adminDeleteWebhookEndpoint
      tags: [Admin webhooks]
      summary: Remove a destination.
      description: |
        Takes its pending deliveries with it and **leaves every event**. An event is a fact
        about a payment; deleting a URL does not un-happen it, and an operator asking "what did
        we emit last Tuesday" must get the same answer before and after this call.

        `204` with no body, because a body describing a row that no longer exists invites a
        client to render it. The count of deleted deliveries goes to the audit trail.
      security:
        - AdminKey: []
      responses:
        '204': { description: Deleted. No body. }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/webhook-endpoints/{public_id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/EndpointPublicId'
    post:
      operationId: adminRotateWebhookEndpointSecret
      tags: [Admin webhooks]
      summary: Mint new key material.
      description: |
        Returns the plaintext once, in the create's shape. **The previous secret stops working
        immediately** — no dual-secret grace period — which is why this is a route of its own
        rather than a flag on the patch: it must not be reachable by an operator who thought
        they were editing a URL.

        Also re-enables the endpoint and clears `consecutive_failures`, on the reasoning that
        an operator rotating is about to hand the receiver a working secret.

        **The other endpoints of this merchant are untouched.** That is the entire point of
        per-endpoint secrets: with a shared one, rotation would be a simultaneous outage for
        every receiver, and a leak at the least-trusted one would let it forge events to all
        the others.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The endpoint, with the new one-time signing secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedWebhookEndpoint' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/webhook-endpoints/{public_id}/enable:
    parameters:
      - $ref: '#/components/parameters/EndpointPublicId'
    post:
      operationId: adminEnableWebhookEndpoint
      tags: [Admin webhooks]
      summary: Clear a disable.
      description: |
        Clears `disabled_reason` **and** resets `consecutive_failures`. Leaving the counter one
        dead-letter below the threshold would disable the endpoint again on its next hiccup,
        which reads to an operator as "the enable button does not work".
      security:
        - AdminKey: []
      responses:
        '200':
          description: The endpoint, enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/webhook-endpoints/{public_id}/disable:
    parameters:
      - $ref: '#/components/parameters/EndpointPublicId'
    post:
      operationId: adminDisableWebhookEndpoint
      tags: [Admin webhooks]
      summary: Stop delivering to this endpoint.
      description: |
        **This — not `subscribed_events: []` — is how you say "this endpoint should receive
        nothing".** A disabled endpoint keeps its URL, its secret and its history; an endpoint
        subscribed to nothing looks configured and is silently dead, which is why an empty
        array is a `400`.

        Always records a reason, defaulted to `"Disabled by an operator"` rather than left
        null, so a non-null `disabled_reason` never has to be read as "auto-disabled, reason
        lost".
      security:
        - AdminKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisableWebhookEndpointRequest' }
      responses:
        '200':
          description: The endpoint, disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /v1/admin/webhook-endpoints/{public_id}/test:
    parameters:
      - $ref: '#/components/parameters/EndpointPublicId'
    post:
      operationId: adminTestWebhookEndpoint
      tags: [Admin webhooks]
      summary: Deliver a `webhook.ping` now, synchronously.
      description: |
        **Why this route exists.** Without it the only way to prove a URL and a secret are
        right is to cause a real transition — and the operator configuring an endpoint is
        usually not the person who can take a payment. Every misconfiguration would then
        surface as a dead-letter hours later, attached to a real business event that was also
        lost.

        Shares the envelope, the renderer, the signature, the URL guard, the 5 s timeout, the
        redirect rule and the excerpt cap with a real delivery — a test button that exercises
        its own copy of the delivery path proves only that the copy works.

        Writes **no event row and no delivery row**, bypasses `subscribed_events` and the
        ladder, and never touches `consecutive_failures`: a probe is not a fact about a
        payment, and a failed probe is an operator mid-configuration rather than a receiver
        that has gone away.

        > **Answers `200` whatever the receiver said.** The operator's request succeeded; what
        > the receiver answered is the *result*. Read `ok`, never the HTTP status — returning
        > their `401` as ours would make a working diagnostic look like a broken endpoint.
      security:
        - AdminKey: []
      responses:
        '200':
          description: 'What the probe found. `ok: false` is still a `200`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookPingResult' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422':
          description: |
            The endpoint has no signing secret, so there is nothing to sign a test with
            (`code: secret_missing`). Rotate its secret first.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/webhook-events:
    get:
      operationId: adminListWebhookEvents
      tags: [Admin webhooks]
      summary: The outbox — what exactly did we send?
      description: |
        Answers the one question no other list can: **we say we emitted it — what were the
        bytes?** The only place a stored payload is readable.

        Separate from the delivery list because an event emitted for a merchant with **no
        endpoint configured has no delivery row at all** and must still be findable. The event
        is the fact; having somewhere to send it is a separate question.

        `correlation_id` is the cross-service query: one value returns everything one payment
        caused, here and — with the same value against a sibling service's copy of this route —
        everywhere else in the estate.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: event_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - name: correlation_id
          in: query
          required: false
          description: Everything one causal chain produced. Equals `event_id` on a root event.
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WebhookEvent' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/webhook-deliveries:
    get:
      operationId: adminListWebhookDeliveries
      tags: [Admin webhooks]
      summary: The delivery queue, across merchants.
      description: |
        Defaults to **`status=all`**, unlike the merchant-facing list which defaults to
        `pending`. An operator arrives here from a health-strip count about dead-letters, and
        defaulting to `pending` would show a different set than the one they clicked.

        `cross_service` binds **the same predicate the health counts use**, which is what makes
        `dead_lettered_deliveries_cross_service` and the list behind it the same set by
        construction rather than by two queries that agree today.
      security:
        - AdminKey: []
      parameters:
        - name: merchant
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: endpoint
          in: query
          required: false
          description: An endpoint's `public_id`. The drill-down from one row of the endpoint list.
          schema: { type: string, format: uuid }
        - name: event_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, delivered, dead_lettered, all]
            default: all
        - name: cross_service
          in: query
          required: false
          description: |
            `true` narrows to deliveries aimed at **another Lamido service**, recognised by the
            URL ending `/v1/hooks/payment-service` rather than by a hand-set column. `false` is
            its exact complement.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/WebhookDelivery'
                            - type: object
                              required: [merchant_public_id, endpoint_public_id]
                              properties:
                                merchant_public_id: { type: string, format: uuid }
                                endpoint_public_id:
                                  type: string
                                  format: uuid
                                  description: |
                                    Which destination this attempt was aimed at. Present because
                                    this list is cross-endpoint as well as cross-tenant.
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/webhook-deliveries/{id}/redeliver:
    parameters:
      - name: id
        in: path
        required: true
        description: The **`delivery_id`** from a listing, not the internal row id.
        schema: { type: string, format: uuid }
    post:
      operationId: adminRedeliverWebhook
      tags: [Admin webhooks]
      summary: Try a delivery again now.
      description: |
        **Resets the existing row** rather than inserting a second one — the unique index on
        `(event_id, endpoint_id)` makes two queues of attempts for one event impossible. The
        attempt counter goes back to 1, so a redelivered dead-letter gets the whole ladder
        again: an operator redelivering has usually just fixed something, and one attempt
        before dead-lettering again would waste the fix.

        `delivery_id` is regenerated because it identifies one HTTP request. **`X-Event-Id` does
        not change**, so a receiver is entitled to recognise the event and skip it.

        It does **not** deliver inline: the row becomes due immediately and the next sweep of
        any kind takes it. On the current hosting tier cron sweeps twice a day, so a redelivery
        can sit for hours on a quiet service — manual redelivery is a first-class operator
        tool, not a fallback.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The delivery, reset and due.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '422':
          description: |
            The endpoint is disabled (`code: endpoint_disabled`) — a redelivery would be
            attempted and immediately refused, so enable it first — or it has no signing secret
            (`code: secret_missing`), so the delivery could not be signed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # =========================================================================
  # Admin — stats
  # =========================================================================
  /v1/admin/stats/overview:
    get:
      operationId: adminStatsOverview
      tags: [Admin stats]
      summary: Headline counts and totals, per currency.
      description: |
        Succeeded is reported **separately rather than as a conversion percentage**: a
        percentage over a handful of payments is noise, and an operator reading "33%" on three
        payments draws a conclusion that is not there.

        These are **operational numbers, not accounting ones** — they round nothing and
        reconcile nothing against a PSP statement. Do not label them revenue.
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, since, payments, succeeded]
                properties:
                  window_days: { type: integer }
                  since: { type: string, format: date-time }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyTotal' }
                  succeeded:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyTotal' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/stats/timeseries:
    get:
      operationId: adminStatsTimeseries
      tags: [Admin stats]
      summary: Payments per bucket, per currency, per status.
      description: |
        Buckets come from `date_trunc`. A bucket with no payments is **absent rather than
        zero**, so fill gaps client-side — the caller knows the range it asked for and the
        viewer's timezone, and this service knows neither.
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: interval
          in: query
          required: false
          schema: { type: string, enum: [hour, day], default: day }
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, interval, since, buckets]
                properties:
                  window_days: { type: integer }
                  interval: { type: string, enum: [hour, day] }
                  since: { type: string, format: date-time }
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [bucket, currency, status, count, amount_minor]
                      properties:
                        bucket: { type: string, format: date-time }
                        currency: { $ref: '#/components/schemas/Currency' }
                        status: { $ref: '#/components/schemas/PaymentStatus' }
                        count: { type: integer }
                        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/stats/merchants:
    get:
      operationId: adminStatsMerchants
      tags: [Admin stats]
      summary: Per-merchant, per-currency activity.
      description: |
        Merchants with no payments in the window are absent: the merchant list answers "who
        exists", this answers "who is transacting".
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: The merchants.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, since, merchants]
                properties:
                  window_days: { type: integer }
                  since: { type: string, format: date-time }
                  merchants:
                    type: array
                    items:
                      type: object
                      required: [merchant_public_id, name, currency, count, succeeded_count, succeeded_amount_minor]
                      properties:
                        merchant_public_id: { type: string, format: uuid }
                        name: { type: string }
                        currency: { $ref: '#/components/schemas/Currency' }
                        count: { type: integer }
                        succeeded_count: { type: integer }
                        succeeded_amount_minor:
                          allOf:
                            - $ref: '#/components/schemas/MinorAmount'
                          description: Succeeded payments only — what the merchant actually took.
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  # =========================================================================
  # Admin — keys and audit
  # =========================================================================
  /v1/admin/keys:
    get:
      operationId: adminListKeys
      tags: [Admin keys]
      summary: Every admin key. `key_hash` is never returned.
      description: A null `last_used_at` on an old key is worth acting on.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
    post:
      operationId: adminMintKey
      tags: [Admin keys]
      summary: Mint an admin key. Plaintext shown once.
      description: |
        `label` is required — it is the identity that appears in every audit entry.

        `scopes` defaults to `["*"]` when omitted, but an **empty array is rejected**: a key
        that authenticates and can do nothing is almost always a client that meant to send
        scopes, and it fails later as a confusing 403 on every call.

        `allowed_ips` is validated with the same CIDR parser the middleware matches with, so a
        rule that could never match is refused at mint time rather than silently locking the
        key out.

        **An empty `allowed_ips` needs `allow_any: true` in the same body**, in every
        environment, else `400` reported against `allowed_ips`. The gate is at mint time and
        not at authentication time on purpose: refusing an empty allowlist when a key is *used*
        would lock lamido-admin out of production on the first redeploy, because Vercel's
        egress addresses rotate. Keys minted before this field keep working untouched.

        **`admin:manage` is transitively every scope** — a key holding it can mint itself a
        `*` key.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1 }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/AdminScope' }
                  description: 'Omitted grants `["*"]`. `[]` is rejected.'
                allowed_ips:
                  type: array
                  items: { type: string, examples: ['203.0.113.7/32'] }
                  description: |
                    CIDRs. Omitted or empty still means unrestricted, but empty is no longer
                    reachable without `allow_any`.
                allow_any:
                  type: boolean
                  default: false
                  description: |
                    Accept an unrestricted key, knowingly. **Required to be `true` whenever
                    `allowed_ips` is empty.**

                    **Not stored and never returned.** It records a decision about this
                    request; what lasts is `allowlist_empty` on the audit entry and
                    `admin_keys_without_ip_allowlist` on `GET /v1/admin/health`, both derived
                    from the allowlist actually being empty.
      responses:
        '201':
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [key, secret, warning]
                properties:
                  key: { $ref: '#/components/schemas/AdminApiKey' }
                  secret: { type: string, examples: ['pad_YOUR_NEW_KEY'] }
                  warning: { type: string }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

  /v1/admin/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/InternalId'
    delete:
      operationId: adminRevokeKey
      tags: [Admin keys]
      summary: Deactivate an admin key.
      description: |
        Deactivates rather than deleting, and **refuses to revoke the calling key** (409). An
        operator who locks themselves out has no way back except the bootstrap script on the
        host, and the mistake is easy to make when revoking a list of stale keys that happens
        to include the one in the terminal's environment.
      security:
        - AdminKey: []
      responses:
        '200':
          description: The deactivated key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminApiKey' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }

  /v1/admin/audit:
    get:
      operationId: adminListAudit
      tags: [Admin audit]
      summary: The operator trail, newest first.
      description: |
        **Append-only: there is no write endpoint and no delete endpoint.** Entries are written
        as a side effect of the action they describe.

        `actor_label` is denormalised and `actor_id` carries **no foreign key**, so the trail
        stays readable after a key is revoked or deleted — history has to outlive the row it
        points at.

        `metadata` is an **allowlisted summary per action**, never a raw request body. That is
        the control that keeps a plaintext Stripe key out of a table which is not encrypted.

        `action` accepts only names from the catalogue in `admin-api.md` — a filter cannot name
        an action that can never occur.
      security:
        - AdminKey: []
      parameters:
        - name: action
          in: query
          required: false
          schema: { type: string, examples: [payment.refund] }
        - name: target_id
          in: query
          required: false
          schema: { type: string }
        - name: actor_id
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenScopeProblem' }

components:
  securitySchemes:
    MerchantKey:
      type: http
      scheme: bearer
      bearerFormat: pmk_...
      description: |
        A merchant API key. Server-to-server only: a request carrying `Origin` or
        `Sec-Fetch-Dest` is rejected with 403 before authentication runs. A plain Node `fetch` is not.
    AdminKey:
      type: http
      scheme: bearer
      bearerFormat: pad_...
      description: |
        An admin API key, plus per-route scopes. A separate tier in a separate table from
        `pmk_`, so compromising one does not hand over the other. Insufficient scope returns
        **403 naming the missing scope**.
    CronSecret:
      type: http
      scheme: bearer
      description: '`CRON_SECRET`, presented by Vercel Cron. The route fails closed when it is unset.'

  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **Required, not optional.** Any string up to 255 characters; derive it from the
        operation rather than the clock. Payment keys live 7 days, refund keys 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255 }
    PaymentPublicId:
      name: public_id
      in: path
      required: true
      description: The payment's `public_id` (UUIDv7). A malformed id is a 400 about the id, not a 404.
      schema: { type: string, format: uuid }
    RefundPublicId:
      name: public_id
      in: path
      required: true
      description: The refund's `public_id` (UUIDv7).
      schema: { type: string, format: uuid }
    MerchantPublicId:
      name: public_id
      in: path
      required: true
      description: The merchant's `public_id`.
      schema: { type: string, format: uuid }
    MerchantPublicIdPath:
      name: merchantPublicId
      in: path
      required: true
      description: The merchant's `public_id`, baked into the callback URL at credential-save time.
      schema: { type: string, format: uuid }
    EndpointPublicId:
      name: public_id
      in: path
      required: true
      description: |
        The **webhook endpoint's** `public_id`, never the internal row id. Endpoints used to be
        addressed by `id`, which was defensible while an endpoint was a property of a merchant
        with no external identity of its own; it stopped being defensible the moment an operator
        points at one from a UI that spans five services.
      schema: { type: string, format: uuid }
    ProviderName:
      name: provider
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Provider' }
    InternalId:
      name: id
      in: path
      required: true
      description: An internal uuid. Admin-only objects have no external identity.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset cursor from a previous `next_cursor`. **Do not construct or parse one**;
        a malformed cursor is a 400 rather than a quiet restart from page 1.
      schema: { type: string }
    From:
      name: from
      in: query
      required: false
      description: '**Inclusive** lower bound.'
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      required: false
      description: |
        **Exclusive** upper bound. Paging by day with `from=D&until=D+1` therefore covers every
        row exactly once; two inclusive bounds double-count the boundary.
      schema: { type: string, format: date-time }
    Days:
      name: days
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 365, default: 7 }

  responses:
    ValidationProblem:
      description: The request, or the merchant's configuration, cannot produce the result.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            amount:
              value:
                type: urn:payment-service:problem:validation
                title: Bad Request
                status: 400
                detail: 'body.amount_minor: Amount must be a decimal string of minor units with no sign, decimal point or leading zero; received "25.00"'
                instance: /v1/payments
    UnauthorizedProblem:
      description: No credential, or one we do not recognise. One identical message for unknown, revoked and disabled.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BrowserTripwireProblem:
      description: |
        A browser-shaped request — `Origin` or `Sec-Fetch-Dest`. A **tripwire, not a
        security boundary**: `Origin` is forgeable, and the real boundary is the API key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenScopeProblem:
      description: |
        The admin key lacks the scope, and the response **names** it — the caller is a trusted
        operator tool, and "which scope do I need?" should not be a support round-trip. Also
        the browser tripwire on this surface.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundProblem:
      description: |
        No such resource **or it belongs to another merchant** — 404, never 403, so ids cannot
        be probed for existence.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflictProblem:
      description: |
        The `Idempotency-Key` is in flight (retry after a pause; the lease is 60 s) or was used
        with a **different** body (use a new key — this path costs zero provider calls).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitProblem:
      description: |
        Too many requests. The seconds to wait are carried **both** in the `Retry-After`
        header and in the `retry_after` extension member, and the two always agree — the
        header is derived from the member in the problem serializer.
      headers:
        Retry-After:
          description: Seconds to wait. Always equal to the `retry_after` member.
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  retry_after: { type: integer, description: Seconds. }
    RefreshThrottledProblem:
      description: |
        This payment was refreshed within the last 5 seconds. **No provider call was made.**
        The seconds to wait are carried both in the `Retry-After` header and in the
        `retry_after` extension member, and the two always agree.
      headers:
        Retry-After:
          description: Seconds to wait. Always equal to the `retry_after` member.
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  retry_after: { type: integer, description: Seconds. }
    RefundStateProblem:
      description: |
        Understood, but the payment's state forbids it. **Not a permanent failure** — every
        cause here describes state that can change.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  code:
                    type: string
                    enum: [payment_not_refundable, currency_mismatch, refund_target_unknown, refund_exceeds_remaining]
    ReconcileStateProblem:
      description: The payment's state forbids this reconcile action.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  code:
                    type: string
                    enum: [not_releasable, known_to_provider, already_attached]
    ProviderProblem:
      description: |
        The PSP rejected us or was unreachable. **Read `detail`:** a rejection is definitive, an
        unreachable provider leaves the outcome unknown and the only safe retry is with the
        same `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  provider_error:
                    type: string
                    description: A short, non-secret description of what the PSP said.

  schemas:
    # ---------------------------------------------------------------- money
    MinorAmount:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: |
        A decimal string of **canonical** minor units. **HUF is zero-decimal here**, so
        `"1000"` HUF is 1000 Ft; EUR is two-decimal, so `"1000"` EUR is €10.00. A string and
        never a JSON number, because JSON numbers lose precision above 2^53. Request amounts
        must be greater than zero.
      examples: ['1000', '2500']
    Currency:
      type: string
      enum: [HUF, EUR]
      description: Two, deliberately. A third is a decision with a golden-vector row attached, not a config change.
    Provider:
      type: string
      enum: [barion, stripe]
    Mode:
      type: string
      enum: [sandbox, live]
      description: A property of the credential used, not of the request. There is no test flag and no sandbox hostname.

    # -------------------------------------------------------------- health
    HealthBase:
      type: object
      required: [version, commit, now]
      properties:
        version:
          type: string
          examples: ['0.1.0']
          description: The service's own version, compiled in from source.
        commit:
          type: string
          description: '`VERCEL_GIT_COMMIT_SHA`, or `dev` locally. Answers "which build is live?".'
        now: { type: string, format: date-time }

    HealthOk:
      allOf:
        - $ref: '#/components/schemas/HealthBase'
        - type: object
          required: [status, db]
          properties:
            status: { const: ok }
            db: { const: ok }

    HealthDegraded:
      allOf:
        - $ref: '#/components/schemas/HealthBase'
        - type: object
          required: [status, db, code]
          description: Served with HTTP **200**, not 503.
          properties:
            status: { const: degraded }
            db: { const: unreachable }
            code:
              type: string
              description: The driver's error code. Never its message.
              examples: ['ECONNREFUSED']

    # -------------------------------------------------------------- problem
    ProblemFieldError:
      type: object
      description: One field-level failure, an entry of the `errors` member.
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: |
            An RFC 6901 JSON Pointer into the request body (`/amount_minor`,
            `/items/0/amount_minor`), or `#/<target>/<name>` for anything that did not arrive
            in the body — `#/query/limit`, `#/param/public_id`.
          examples: ['/amount_minor', '#/query/limit']
        code:
          type: string
          description: |
            The branchable sub-case. The documented set is `required`, `invalid_type`,
            `invalid_format`, `invalid_enum`, `unknown_field`, `invalid_union`, `too_small`,
            `too_big` and `invalid` — but it is **not closed**: an unmapped validator failure
            falls through carrying its own code rather than being flattened to `invalid`.
            Branch on the documented values and treat anything else as a generic invalid field.
          examples: ['unknown_field']
        detail:
          type: string
          description: A sentence about this one field. Prose — do not branch on it.

    Problem:
      type: object
      description: RFC 9457 Problem Details. Served as `application/problem+json`.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          enum:
            - urn:payment-service:problem:validation
            - urn:payment-service:problem:unauthorized
            - urn:payment-service:problem:forbidden
            - urn:payment-service:problem:not-found
            - urn:payment-service:problem:conflict
            - urn:payment-service:problem:rate-limit
            - urn:payment-service:problem:internal
          description: |
            **Branch on this, never on `title` or `detail`.** A closed set: adding a member is
            an API change. `conflict` carries both 409 and 422; there is no `provider` member —
            a PSP failure is `internal` carried by HTTP 502.
        title:
          type: string
          description: A summary of the **status**, not of the type. Wording may change.
        status: { type: integer }
        detail:
          type: string
          description: Prose for a human reading a log. Never contains a credential or a request body.
        instance:
          type: string
          description: The request **path**. Never a full URL and never with a query string.
        request_id:
          type: string
          description: |
            The value of the response's `X-Request-Id` header, present on **every** problem.
            Quote it in a support request — it is the one string that joins this response to
            the service's logs and audit trail.
          examples: ['019e4a91-3f2b-7c14-9d5e-2a6b8c0d1f33']
        errors:
          type: array
          description: |
            Present on validation `400`s. Carries **every** field problem in the request, not
            just the first — `detail` names one failure so the message reads well in a
            support ticket, this is the complete list.

            **Breaking change at `058fddc`:** this was previously the validator's own
            `flatten()` object (`{formErrors, fieldErrors}`), whose keys were top-level only.
            Code doing `errors.fieldErrors[name]` now reads `undefined` rather than throwing.
          items:
            $ref: '#/components/schemas/ProblemFieldError'
        code:
          type: string
          enum:
            - payment_not_refundable
            - currency_mismatch
            - refund_target_unknown
            - refund_exceeds_remaining
            - not_releasable
            - known_to_provider
            - already_attached
            - endpoint_disabled
            - endpoint_limit_reached
          description: |
            The machine-branchable sub-case, where `(type, status)` alone cannot identify the
            failure. **Every one of these is `type: conflict`**, which is why the pair has to be
            read together — the first eight on a `422`, `endpoint_limit_reached` on a `409`.

            Absent on every other problem. A `422` always carries one.
        retry_after:
          type: integer
          minimum: 1
          description: |
            Seconds to wait. On **every** `429`, and nothing else. Always equal to the
            `Retry-After` header, which is derived from this member rather than set beside it —
            so the two cannot disagree.
          examples: [5]
        provider_error:
          type: string
          description: |
            A short, **non-secret** description of what the PSP said, on a `502`. Read it before
            retrying: the failure is theirs, and nothing on this side changed.
          examples: ['Barion: the payment window has closed']
        supported_events:
          type: array
          items: { type: string }
          description: |
            The valid webhook event types, on the `400` that rejects an unknown one. Serves the
            same list as the event catalogue, so a caller can correct the request without
            reading the documentation.
          examples: [[payment.succeeded, payment.failed, refund.succeeded]]
        limit:
          type: integer
          description: 'The cap that was reached, on the `endpoint_limit_reached` conflict.'
      additionalProperties: true

    # -------------------------------------------------------------- merchant
    PaymentStatus:
      type: string
      enum: [initializing, pending, authorized, succeeded, failed, canceled, expired, partially_refunded, refunded]
      description: |
        Our canonical lifecycle, identical across providers. `failed`, `canceled`, `expired` and
        `refunded` are terminal.

        `initializing` is internal — we have reserved the operation and not yet heard from the
        PSP. `authorized` exists because Stripe can produce it, not because an auth/capture
        split is driven. `partially_refunded` and `refunded` come from **our refunds ledger**,
        never from a provider status: Barion still reports `Succeeded` after a full refund.

        **Never fulfil an order on `pending`.**
    RefundStatus:
      type: string
      enum: [pending, succeeded, failed, canceled]
      description: A refund's own lifecycle. `canceled` means a reservation was released, not that money moved.

    Payment:
      type: object
      description: A payment, as the merchant tier returns it.
      required:
        [public_id, merchant_payment_ref, amount_minor, currency, status, provider, mode,
        provider_payment_id, provider_status, gateway_url, redirect_url, metadata, expires_at,
        succeeded_at, failed_at, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid, description: UUIDv7 — sortable by creation time. }
        merchant_payment_ref:
          type: string
          description: The merchant's own order id. Not required to be unique.
        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        provider:
          oneOf:
            - $ref: '#/components/schemas/Provider'
            - type: 'null'
          description: '`null` only for a payment that never reached a PSP.'
        mode: { $ref: '#/components/schemas/Mode' }
        provider_payment_id:
          type: [string, 'null']
          description: The PSP's own id — Barion 32-hex, Stripe `cs_…`. `null` until the PSP has answered.
        provider_status:
          type: [string, 'null']
          description: |
            The PSP's own status word, verbatim, so a status we have not mapped yet is still
            actionable. Not stable across providers.
        gateway_url:
          type: [string, 'null']
          description: Where to send the buyer. `null` means no gateway exists yet — do not redirect.
        redirect_url:
          type: [string, 'null']
          description: Where the PSP returns the buyer, resolved from the merchant's template at creation.
        metadata:
          type: [object, 'null']
          additionalProperties: true
          description: Opaque; stored and echoed, never interpreted. **Never put buyer PII here.**
        expires_at:
          type: [string, 'null']
          format: date-time
          description: The PSP's own payment window, read back from it.
        succeeded_at: { type: [string, 'null'], format: date-time }
        failed_at:
          type: [string, 'null']
          format: date-time
          description: Also stamped for `canceled` and `expired`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePaymentRequest:
      type: object
      description: |
        **Rejects unknown fields** (400, `errors[].code = unknown_field`). Changed at
        `058fddc`; unknown keys were previously stripped in silence. `metadata` is exempt —
        its contents are the merchant's and are never inspected.
      required: [merchant_payment_ref, amount_minor, currency]
      additionalProperties: false
      properties:
        merchant_payment_ref: { type: string, minLength: 1, maxLength: 200 }
        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: Must be one the merchant record allows, which defaults to their default currency alone.
        provider:
          allOf:
            - $ref: '#/components/schemas/Provider'
          description: |
            Omitted with **one** active credential uses that one. Omitted with **two** is a 400:
            guessing which PSP charges a buyer is not a defaulting decision.
        metadata:
          type: object
          additionalProperties: true
          description: 'Capped at 4096 bytes serialised. Default when omitted: `null`. Never buyer PII.'
        invoice_details:
          allOf:
            - $ref: '#/components/schemas/InvoiceDetails'
          description: |
            The buyer and lines for an invoice to be issued automatically when this payment
            succeeds. **Default when omitted: `null`** — nothing is stored and no invoice is
            issued, which is the normal case.

            This is the only field on this API carrying personal data. It leaves the service
            only on `payment.succeeded`, and only to a webhook endpoint whose operator has set
            `include_invoice_details`. This service never reads inside it: the receiving service
            validates it against its own invoice schema, so a shape accepted here can still be
            refused downstream — after the money has been taken.

    InvoiceDetails:
      type: object
      description: |
        Buyer identity and invoice lines, passed through verbatim to invoice-service.

        Every object here is `additionalProperties: false`, because each ends up on a legal
        document reported to NAV: a silently stripped `vat_rat` typo would issue an invoice with
        the wrong tax on it and return 201. Capped at 16384 bytes serialised.

        Currency is **not** here — the invoice is issued in the payment's `currency`.
      required: [partner, items]
      additionalProperties: false
      properties:
        partner:
          type: object
          required: [name, address]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, description: The buyer as they must appear on the document. }
            tax_number:
              type: string
              minLength: 1
              description: |
                Required by the provider for a company buyer; not enforced by this API.
                Default when omitted: absent.
            email:
              type: string
              format: email
              description: 'Where the issuing service may send the document. Default when omitted: absent.'
            address:
              type: object
              required: [postal_code, city, address]
              additionalProperties: false
              properties:
                postal_code: { type: string, minLength: 1 }
                city: { type: string, minLength: 1 }
                address: { type: string, minLength: 1, description: Street and number. }
                country:
                  type: string
                  minLength: 1
                  description: "Default when omitted: the issuer's default, `Magyarország`."
        items:
          type: array
          minItems: 1
          description: At least one line, or 400.
          items:
            type: object
            required: [name, quantity, net_unit_price_minor, vat_rate]
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1 }
              quantity: { type: number, exclusiveMinimum: 0 }
              unit:
                type: string
                minLength: 1
                description: "Default when omitted: the issuer's default, `db`."
              net_unit_price_minor:
                allOf:
                  - $ref: '#/components/schemas/MinorAmount'
                description: '**Net**, per unit, in canonical minor units. HUF is zero-decimal.'
              vat_rate:
                type: string
                minLength: 1
                description: A percentage (`27`, `5`) or a provider code (`AAM`, `TAM`, `EU`).
              comment: { type: string, description: 'Default when omitted: absent.' }
        payment_method:
          type: string
          minLength: 1
          description: "Free text on the document. Default when omitted: the issuer's default, `átutalás`."
        language:
          type: string
          minLength: 1
          description: "Default when omitted: the issuer's default, `hu`."
        e_invoice:
          type: boolean
          description: "Default when omitted: the issuer's default, `true`."
        comment: { type: string, description: 'Free text on the document. Default when omitted: absent.' }
        partner_ref:
          type: string
          description: |
            The merchant's own reference, persisted by the issuer for lookups.
            Default when omitted: the payment's `merchant_payment_ref`.

    Refund:
      type: object
      description: A refund, as the merchant tier returns it.
      required:
        [public_id, payment_public_id, amount_minor, currency, status, outcome_unknown, reason,
        provider, mode, provider_refund_id, provider_status, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        payment_public_id: { type: string, format: uuid }
        amount_minor: { $ref: '#/components/schemas/MinorAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        outcome_unknown:
          type: boolean
          description: |
            `true` when the provider call did not complete, so we cannot say whether the money
            moved. The reservation stays held. **Never re-issue with a new idempotency key.**
        reason: { type: [string, 'null'] }
        provider: { $ref: '#/components/schemas/Provider' }
        mode: { $ref: '#/components/schemas/Mode' }
        provider_refund_id: { type: [string, 'null'] }
        provider_status: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRefundRequest:
      type: object
      description: |
        **Rejects unknown fields** (400, `errors[].code = unknown_field`). Changed at
        `058fddc` — a silently dropped key on a refund body is a refund for an amount nobody
        asked for.
      required: [amount_minor, currency]
      additionalProperties: false
      properties:
        amount_minor:
          allOf:
            - $ref: '#/components/schemas/MinorAmount'
          description: |
            **Required, with no "refund the rest" default** — a default would make the same
            request refund different amounts depending on when it arrives.
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: |
            An assertion, not an instruction: it must equal the payment's currency. It exists so
            "refund 500 EUR" against a HUF payment cannot be read as 500 HUF.
        reason:
          type: string
          maxLength: 500
          description: 'For the merchant''s records. Never forwarded to Stripe''s `reason` enum. Default when omitted: `null`.'

    WebhookEventType:
      type: string
      enum:
        [payment.succeeded, payment.failed, payment.canceled, payment.expired, refund.succeeded,
        refund.failed, refund.canceled]
      description: |
        The closed catalogue, **additive only** — read it from `GET /v1/admin/event-types` rather
        than hardcoding this list. An unrecognised `event_type` must be ignored and answered
        `2xx`, which is the condition that lets a type be added without a version bump.

        There is deliberately no event for `pending`, `initializing` or `authorized` — those are
        steps, not outcomes — and no `payment.refunded` or `payment.partially_refunded`: the
        thing that happened is a refund, so it arrives as `refund.succeeded`, whose payload
        carries the payment's new status in the related block. **Two event types must never
        describe one fact** — a receiver handling both would double-count, and one handling
        either would look complete.

        `webhook.ping` is **not** here: it is reserved estate-wide, delivered only by
        `POST /v1/admin/webhook-endpoints/{public_id}/test`, and not subscribable.

    WebhookPingEventType:
      type: string
      enum: [webhook.ping]
      description: The reserved probe type. Never emitted by a transition.

    WebhookEnvelopeMeta:
      type: object
      description: |
        The metadata every delivered body carries, **byte-identical in shape across every Lamido
        service**, so one receiver verifies, logs and dedupes every event with one piece of code
        before it knows what the event is.

        Member order in the wire body is the order listed here, and **the bytes are signed** —
        verify against the raw body, never against re-serialised JSON.
      required:
        [event_id, event_type, contract_version, occurred_at, service, account_id, tenant,
        correlation_id, causation_id, hop, data]
      properties:
        event_id:
          type: string
          format: uuid
          description: UUIDv7. Matches `X-Event-Id`. **Dedupe on this** — delivery is at-least-once.
        contract_version:
          type: integer
          description: |
            The envelope version **these bytes were rendered at**, which is the receiving
            endpoint's own pin — not necessarily the latest the service supports.
        occurred_at:
          type: string
          format: date-time
          description: |
            ISO 8601 UTC. **When the fact became true, not when it was sent.** A retry three days
            later carries the original value.
        service:
          type: string
          enum: [payment-service]
          description: The emitter's slug.
        account_id:
          type: [string, 'null']
          description: |
            The lamido-admin `accountId` (`merchants.external_ref`) as it stood inside the
            emitting transaction. **`null` for a merchant lamido-admin has not paired** — such a
            merchant cannot participate cross-service, and a receiver should refuse at its
            resolve step rather than guess.
        tenant:
          type: object
          description: Which tenant, in the emitter's own noun. Means nothing outside this service.
          required: [kind, public_id]
          properties:
            kind: { type: string, enum: [merchant] }
            public_id: { type: string, format: uuid }
        correlation_id:
          type: string
          format: uuid
          description: |
            Stable across a whole causal chain, and **equal to `event_id`** on an event this
            service produced natively — which today is every event. One value answers "what did
            this payment cause, across five services".
        causation_id:
          type: [string, 'null']
          description: |
            The `event_id` that caused this one. **Never absent**, and always `null` here because
            nothing in the estate sends *to* payment-service.
        hop:
          type: integer
          description: |
            `0` on a natively-produced event, which is all of them here. A blunt backstop that
            bounds the cost of an undeclared cycle; present so the envelope is one shape
            estate-wide.

    WebhookPayload:
      description: |
        The body we POST to a merchant's endpoint. **Stored at emission and delivered verbatim
        afterwards** — it does not grow the way the REST responses may, and a delayed retry
        describes the state that fired the event rather than the state now.

        Note `data.payment.public_id`, not `id`: the wire format never carries an internal uuid.
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeMeta'
        - type: object
          required: [event_type, data]
          properties:
            event_type: { $ref: '#/components/schemas/WebhookEventType' }
            data:
              type: object
              description: |
                The resource blocks, keyed by resource name so the subject can be found
                mechanically. The **only** part of the envelope that varies by event type.
              required: [payment]
              properties:
                payment:
                  type: object
                  description: |
                    Always present — the primary block on a `payment.*` event, and the related
                    block on a `refund.*` one, where a receiver almost always needs to know what
                    the refund did to the order.
                  required: [public_id, status, merchant_payment_ref, amount_minor, currency, provider]
                  properties:
                    public_id: { type: string, format: uuid }
                    status: { $ref: '#/components/schemas/PaymentStatus' }
                    merchant_payment_ref: { type: string }
                    amount_minor: { $ref: '#/components/schemas/MinorAmount' }
                    currency: { $ref: '#/components/schemas/Currency' }
                    provider:
                      oneOf:
                        - $ref: '#/components/schemas/Provider'
                        - type: 'null'
                refund:
                  type: object
                  description: |
                    Present on `refund.*` events only, where it is the **primary** block and the
                    one the status invariant binds: `refund.canceled` carries
                    `data.refund.status == "canceled"` while `data.payment.status` is whatever
                    the ledger now implies.
                  required: [public_id, status, amount_minor, currency]
                  properties:
                    public_id: { type: string, format: uuid }
                    status: { $ref: '#/components/schemas/RefundStatus' }
                    amount_minor: { $ref: '#/components/schemas/MinorAmount' }
                    currency: { $ref: '#/components/schemas/Currency' }

    WebhookPingPayload:
      description: |
        The probe body. **The same envelope with an empty `data`**, signed identically and
        carrying a real `event_id`, so that what a receiver's verification code sees on a test is
        what it will see in production. Deliberately not stored.
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelopeMeta'
        - type: object
          required: [event_type, data]
          properties:
            event_type: { $ref: '#/components/schemas/WebhookPingEventType' }
            data:
              type: object
              description: Always empty.
              maxProperties: 0

    WebhookDelivery:
      type: object
      description: One event's delivery state. The payload is deliberately not included.
      required:
        [delivery_id, event_id, event_type, status, attempt, next_attempt_at, response_status,
        response_body_excerpt, error, created_at, updated_at]
      properties:
        delivery_id:
          type: string
          format: uuid
          description: Identifies the most recent HTTP attempt; matches its `X-Delivery-Id`.
        event_id:
          type: string
          format: uuid
          description: Stable across attempts; matches `X-Event-Id`.
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        status: { type: string, enum: [pending, delivered, dead_lettered] }
        attempt: { type: integer, description: 1-based, for the attempt that is pending or last ran. }
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: |
            `null` unless `pending`. A **floor, not a schedule**: the delivery becomes eligible
            then and is attempted on the next sweep, which on the current tier may be hours
            later.
        response_status:
          type: [integer, 'null']
          description: The merchant's own HTTP status on the last attempt, or `null` if they never answered.
        response_body_excerpt:
          type: [string, 'null']
          description: First 500 bytes of the merchant's response, truncated while reading.
        error:
          type: [string, 'null']
          description: Transport-level failure — timeout, DNS, TLS, a 30x, or a URL the SSRF guard refused.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CallbackAck:
      type: object
      required: [received]
      properties:
        received: { type: boolean }
        reason:
          type: string
          description: Machine-readable cause on a non-200, e.g. `unknown_merchant`, `no_webhook_secret`.

    DrainSummary:
      type: object
      description: >-
        The drain report from `/api/cron/webhooks`, and the same object spread into the
        OB-15 `job.heartbeat` log line.


        BREAKING at `95c66a3`: `deadLettered` was renamed `dead_lettered`. It was the one
        camelCase key in this estate that was on a **wire** surface rather than only in a
        log line — this response body and the heartbeat both — so the OB-2 casing sweep
        that renamed 27 log keys changed a documented response shape with them. A client
        reading `deadLettered` gets `undefined`, not an error.
      required: [claimed, delivered, scheduled, dead_lettered, failed]
      properties:
        claimed: { type: integer }
        delivered: { type: integer }
        scheduled: { type: integer }
        dead_lettered: { type: integer, description: Renamed from `deadLettered` at `95c66a3`. }
        failed: { type: integer, description: Attempts that threw. The claim lease expiry brings the row back. }

    # ------------------------------------------------------------------ admin
    AdminScope:
      type: string
      enum:
        - '*'
        - merchants:read
        - merchants:write
        - credentials:read
        - credentials:write
        - payments:read
        - payments:write
        - webhooks:read
        - webhooks:write
        - stats:read
        - audit:read
        - admin:manage
      description: |
        `"*"` grants all of them. **`payments:write` moves real money** — it covers refunds and
        every reconcile action including the one that deletes a row. **`admin:manage` is
        transitively every scope.**

    CursorPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { type: object } }
        next_cursor:
          type: [string, 'null']
          description: |
            Opaque. `null` on the last page. Keyset, not offset: offset pagination silently
            skips rows on a table where new rows arrive at the front, which is every table here.

    AdminMerchant:
      type: object
      required: [public_id, name, external_ref, default_currency, allowed_currencies, redirect_url_template, active, notes, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        external_ref:
          type: [string, 'null']
          description: lamido-admin's own id. Accepted **only at creation**; there is no PATCH for it.
        default_currency: { $ref: '#/components/schemas/Currency' }
        allowed_currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
          description: Must contain `default_currency`. An empty list reads as "the default only".
        redirect_url_template:
          type: [string, 'null']
          description: |
            **Must contain `{publicId}`** — without it every buyer of every payment lands on the
            same page and the merchant cannot tell which order was paid for. `{merchantPublicId}`
            is also substituted.
        active: { type: boolean }
        notes: { type: [string, 'null'], description: Operator free text. Its values never enter the audit trail. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateMerchantRequest:
      type: object
      required: [name, default_currency]
      properties:
        name: { type: string, minLength: 1 }
        default_currency: { $ref: '#/components/schemas/Currency' }
        external_ref: { type: string }
        allowed_currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
          description: 'Default when omitted: `[default_currency]`. Must contain it.'
        redirect_url_template: { type: string, examples: ['https://acme.example.com/order/thanks?p={publicId}'] }
        notes: { type: string }
        api_key_label: { type: string, description: Label for the one-time key minted alongside the merchant. }

    UpdateMerchantRequest:
      type: object
      description: |
        **`null` is meaningful and distinct from absent**: absent leaves a field alone, `null`
        clears it.
      properties:
        name: { type: string }
        default_currency: { $ref: '#/components/schemas/Currency' }
        allowed_currencies:
          type: array
          items: { $ref: '#/components/schemas/Currency' }
        redirect_url_template: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        active: { type: boolean }

    MerchantApiKey:
      type: object
      description: '`key_hash` is never returned — it is not the key, but it is a value an attacker can compare candidates against offline.'
      required: [id, merchant_public_id, label, last_used_at, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        merchant_public_id: { type: string, format: uuid }
        label: { type: [string, 'null'] }
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Refreshed at most once every 5 minutes, to avoid a write on every request.
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    MintedMerchantKey:
      type: object
      required: [key, secret, warning]
      properties:
        key: { $ref: '#/components/schemas/MerchantApiKey' }
        secret:
          type: string
          description: The plaintext `pmk_` key. **Shown once**; only its SHA-256 is stored.
          examples: ['pmk_YOUR_MERCHANT_KEY']
        warning: { type: string }

    AdminApiKey:
      type: object
      required: [id, label, scopes, allowed_ips, active, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: The identity that appears in every audit entry. }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/AdminScope' }
        allowed_ips:
          type: array
          items: { type: string }
          description: |
            CIDRs. **Empty means unrestricted**, and that is the default. Vercel egress IPs
            rotate, so set this only for a caller with a stable outbound address.
        active: { type: boolean }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SecretSummary:
      type: object
      description: |
        The **only** secret-adjacent data any read path returns. No endpoint reveals a stored
        secret, and there will not be one.
      required: [set, last4, fingerprint]
      properties:
        set: { type: boolean }
        last4: { type: string, description: Last four characters of the plaintext, for operator recognition. }
        fingerprint:
          type: string
          description: |
            First 8 hex chars of the plaintext's SHA-256. Compare before and after a rotation to
            answer "did it land?" — and it must be **identical** after a KEK rotation, because
            it hashes the plaintext, not the ciphertext.

    Credential:
      type: object
      required: [id, provider, mode, label, config, secrets, expected_pos_id, expected_account_id, last_tested_at, last_test_status, last_test_error, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/Provider' }
        mode:
          allOf:
            - $ref: '#/components/schemas/Mode'
          description: '**Immutable while the credential is active** — changing it is a 409.'
        label: { type: [string, 'null'] }
        config:
          type: object
          additionalProperties: true
          description: Non-secret settings, per the provider catalog. **Replaced wholesale by a PUT.**
        secrets:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SecretSummary' }
        expected_pos_id:
          type: [string, 'null']
          description: Barion's POSId, pinned on first success. A mismatch afterwards means a different PSP account.
        expected_account_id:
          type: [string, 'null']
          description: Stripe's account id, pinned where the key permits reading it.
        last_tested_at: { type: [string, 'null'], format: date-time }
        last_test_status: { type: [string, 'null'], enum: [ok, failed, null] }
        last_test_error: { type: [string, 'null'] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CredentialWithCallback:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          required: [callback_url]
          properties:
            callback_url:
              type: string
              description: |
                Resolved for this merchant — **the value to paste into the PSP dashboard**, so
                nobody builds it by hand.
              examples: ['https://payment.example.com/v1/providers/barion/ipn/019e4a91-0000-7000-8000-000000000002']

    UpsertCredentialRequest:
      type: object
      required: [mode]
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/Mode'
          description: Cannot change while the credential is active. Stripe cross-validates it against the key prefix.
        label: { type: [string, 'null'] }
        secrets:
          type: object
          additionalProperties: { type: string }
          description: |
            Plaintext, per the provider catalog's `secret_fields`. **Omitted keeps the stored
            ciphertext**; supplying any secret voids the previous test verdict.
        config:
          type: object
          additionalProperties: true
          description: |
            **Replaced wholesale.** Always resend the full object on an edit, or every setting is
            dropped and a required one going missing is a 400.

    CredentialTestResult:
      type: object
      description: Returned with **HTTP 200 even when `ok` is false**.
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          properties:
            reason:
              type: string
              enum: [live_blocked, decrypt_failed, probe_failed]
              description: |
                `live_blocked` — this deployment has live PSP traffic switched off.
                `decrypt_failed` — the KEK was rotated. `probe_failed` — the adapter threw.
        callback_url: { type: string }

    ProviderDescriptor:
      type: object
      description: |
        Drives the generic credential form, so a new PSP needs no admin UI work. Wrapper keys
        are snake_case; each field's `key` is not, because it is the literal property name the
        credential upsert body expects.
      required: [name, label, secret_fields, config_fields, capabilities, callback_path_template, test_description]
      properties:
        name: { $ref: '#/components/schemas/Provider' }
        label: { type: string }
        secret_fields:
          type: array
          items:
            type: object
            required: [key, label, help]
            properties:
              key: { type: string }
              label: { type: string }
              help: { type: string }
              pattern: { type: string, description: A regular-expression **source**, not a compiled RegExp. }
        config_fields:
          type: array
          items:
            type: object
            required: [key, label, type, required]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, email, enum, duration, multiselect] }
              required: { type: boolean }
              options: { type: array, items: { type: string } }
              default: {}
              help: { type: string }
        capabilities:
          type: object
          description: Facts the rest of the service branches on, not decoration.
          required: [partial_refund, multiple_partial_refunds, refund_idempotency_key, signed_callbacks, echoes_amount_on_create, decrements_amount_on_refund, supported_currencies]
          properties:
            partial_refund: { type: boolean }
            multiple_partial_refunds: { type: boolean }
            refund_idempotency_key: { type: boolean, description: Barion does **not** accept one. }
            signed_callbacks: { type: boolean, description: Barion's IPN is **not** signed, which is why state is always re-fetched. }
            echoes_amount_on_create: { type: boolean }
            decrements_amount_on_refund:
              type: boolean
              description: Barion's payment total drops as refunds settle; Stripe's `amount_total` never moves.
            supported_currencies:
              type: array
              items: { $ref: '#/components/schemas/Currency' }
        callback_path_template: { type: string, examples: ['/v1/providers/barion/ipn/{merchantPublicId}'] }
        test_description: { type: string, description: What the read-only probe does, shown to the operator before they run it. }

    AdminPayment:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [merchant_public_id, credential_id, refund_reserved_minor, refund_settled_minor, refundable_minor, request_id, last_refreshed_at, unmapped_status_at]
          properties:
            merchant_public_id: { type: string, format: uuid }
            credential_id: { type: [string, 'null'], format: uuid }
            refund_reserved_minor: { $ref: '#/components/schemas/MinorAmount' }
            refund_settled_minor: { $ref: '#/components/schemas/MinorAmount' }
            refundable_minor:
              allOf:
                - $ref: '#/components/schemas/MinorAmount'
              description: '`amount_minor - refund_reserved_minor`. The number to send as a refund amount.'
            request_id: { type: [string, 'null'] }
            last_refreshed_at: { type: [string, 'null'], format: date-time }
            unmapped_status_at:
              type: [string, 'null']
              format: date-time
              description: |
                Stamped when a PSP reported a status we have no mapping for. A column rather
                than a derived query, because Stripe's `provider_status` is a composite and
                "is this one we know?" cannot be reconstructed after the fact.

    AdminRefund:
      allOf:
        - $ref: '#/components/schemas/Refund'
        - type: object
          required: [merchant_public_id]
          properties:
            merchant_public_id: { type: string, format: uuid }

    ProviderEvent:
      type: object
      description: |
        One inbound PSP callback. The raw body and the recorded headers are **not** exposed;
        they stay in `provider_events` for dispute evidence.
      required: [id, provider, mode, method, path, query, provider_event_id, signature_verified, processing_status, attempts, error, received_at, processed_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        mode: { type: [string, 'null'] }
        method: { type: string }
        path: { type: string }
        query: { type: object, additionalProperties: { type: string } }
        provider_event_id: { type: [string, 'null'], description: Stripe has one; Barion does not. }
        signature_verified: { type: boolean, description: Always false for Barion, which signs nothing. }
        processing_status:
          type: string
          enum: [pending, done, ignored, failed]
          description: |
            `ignored` carries a reason in `error` — `unknown_payment`, `unknown_merchant`,
            `merchant_mismatch`, `duplicate_event`, `no_payment_id`. `pending` with reason
            `rate_limited` means an IPN burst was deferred to the sweeper.
        attempts: { type: integer, description: A climbing count on a `failed` event is a poison event. }
        error: { type: [string, 'null'] }
        received_at: { type: string, format: date-time }
        processed_at: { type: [string, 'null'], format: date-time }

    AdminPaymentDetail:
      type: object
      required: [payment, refunds, timeline]
      properties:
        payment: { $ref: '#/components/schemas/AdminPayment' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        timeline:
          type: array
          description: Every inbound PSP callback for this payment, oldest first.
          items: { $ref: '#/components/schemas/ProviderEvent' }

    ReconcileRequest:
      oneOf:
        - type: object
          title: mark_failed
          description: Use when you have confirmed at the PSP that no payment exists.
          required: [action, reason]
          properties:
            action: { const: mark_failed }
            reason: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          title: attach
          description: |
            Links an orphan found in the PSP dashboard. **Does not transition** — run
            `POST /refresh` afterwards and let the provider's answer drive the status.
          required: [action, reason, provider_payment_id]
          properties:
            action: { const: attach }
            reason: { type: string, minLength: 1 }
            provider_payment_id: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          title: release
          description: |
            **Deletes the row**, freeing the merchant's idempotency key. Valid only on an
            `initializing` payment with no `provider_payment_id`. The row is snapshotted into
            the audit trail first.
          required: [action, reason]
          properties:
            action: { const: release }
            reason: { type: string, minLength: 1 }
          additionalProperties: false

    ReconcileResult:
      oneOf:
        - $ref: '#/components/schemas/AdminPayment'
        - type: object
          title: released
          required: [released]
          properties:
            released: { const: true }
            public_id: { type: string, format: uuid }

    WebhookEndpoint:
      type: object
      description: |
        A destination. **The member set is identical across all five services of the estate**,
        because lamido-admin drives every one of them from one screen and one client — adding a
        member is a house-rules change, not a local decision.

        There is deliberately no route that reveals a stored secret.
      required:
        [public_id, merchant_public_id, url, description, subscribed_events, contract_version,
        include_invoice_details, enabled, disabled_reason, consecutive_failures, secret_last4,
        secret_fingerprint, created_at, updated_at]
      properties:
        public_id:
          type: string
          format: uuid
          description: UUIDv7. **What every route addresses this endpoint by**, never the row id.
        merchant_public_id: { type: string, format: uuid }
        url:
          type: string
          description: |
            HTTPS on port 443, and validated against private/link-local ranges at save time
            **and again at delivery time**, because DNS can be re-pointed in between.
        description:
          type: [string, 'null']
          description: The operator's note. What the admin list shows beside the URL.
        subscribed_events:
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/WebhookEventType' }
            - type: 'null'
          description: |
            `null` means every event type **including ones added later**, which is the default and
            what nearly every merchant should use. An empty array is rejected on write.
        contract_version:
          type: integer
          description: |
            The envelope version this endpoint's deliveries are rendered at. **Pinned at
            creation and not patchable** — moving a live endpoint between versions changes the
            bytes its receiver verifies, which is a new endpoint rather than an edit.
        include_invoice_details:
          type: boolean
          description: |
            Whether `payment.succeeded` carries `data.invoice_details` to this endpoint — the
            buyer's name and postal address, and optionally their email and tax number.

            **False by default, including on every endpoint that already existed.** This is the
            only control that lets personal data leave this service. Setting it either way writes
            an audit row recording the resulting value and the acting admin key.

            Per endpoint, not per merchant: one stored event produces a different body per
            endpoint, each signed over what that recipient actually received.
        enabled: { type: boolean }
        disabled_reason:
          type: [string, 'null']
          description: |
            Why it is off — auto-disabled after 5 consecutive dead-lettered deliveries, or
            switched off by an operator, whose own words are recorded. Non-null **only** when
            `enabled` is false.
        consecutive_failures:
          type: integer
          description: |
            Dead-letters in a row; at 5 the endpoint is auto-disabled. Reset by any `2xx`, by
            `POST …/enable` and by a rotation — but **not** by a `PATCH`.
        secret_last4:
          type: [string, 'null']
          description: |
            Last four characters of the signing secret. Never the secret.

            **`null` means this endpoint has no secret and cannot deliver** — every delivery is
            refused before it is attempted — which is the state the per-endpoint-secret migration
            left every pre-existing endpoint in. Rotate one in.
        secret_fingerprint:
          type: [string, 'null']
          description: First 8 hex of its SHA-256, for confirming a rotation landed.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEventTypeDescriptor:
      type: object
      description: One entry of the closed catalogue, as `GET /v1/admin/event-types` returns it.
      required:
        [event_type, resource, fires_when, target_status, contract_version, sensitive_blocks,
        cross_service]
      properties:
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        resource:
          type: string
          enum: [payment, refund]
          description: The `data` key carrying the subject. Equals the event type's prefix.
        fires_when:
          type: string
          description: One sentence, present tense, suitable for an admin trigger picker.
        target_status:
          type: string
          description: |
            The status the primary resource reaches, and the participle in the event name. The
            payload is asserted against it.
        contract_version: { type: integer }
        sensitive_blocks:
          type: array
          items: { type: string }
          description: |
            Blocks that appear only behind an `include_*` flag. **Empty for every type** — no
            payload this service emits carries PII.
        cross_service:
          type: boolean
          description: |
            Whether a sibling Lamido service acts on it today. True only for
            `payment.succeeded`, on which invoice-service issues an invoice.

    WebhookEvent:
      type: object
      description: |
        An event as the admin outbox returns it — the only place a stored payload is readable. A
        merchant's own delivery list omits it, because they already have the body: it is what we
        POSTed them.

        `payment_id` and `refund_id` are internal uuids and stay internal; the payload carries the
        `public_id`s an operator can search for.
      required:
        [event_id, event_type, merchant_public_id, account_id, correlation_id, causation_id, hop,
        payload, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: Matches `X-Event-Id`. Stable across every retry **and every redelivery**.
        event_type: { $ref: '#/components/schemas/WebhookEventType' }
        merchant_public_id: { type: string, format: uuid }
        account_id:
          type: [string, 'null']
          description: The lamido-admin account this belonged to, or `null` if the merchant was unpaired.
        correlation_id: { type: string, format: uuid }
        causation_id:
          type: [string, 'null']
          description: Always `null` here — nothing sends to this service.
        hop: { type: integer }
        payload:
          allOf:
            - $ref: '#/components/schemas/WebhookPayload'
          description: The frozen body, exactly as it was signed and sent.
        created_at: { type: string, format: date-time }

    WebhookPingResult:
      type: object
      description: |
        What `POST /v1/admin/webhook-endpoints/{public_id}/test` found. **Read `ok`, not the HTTP
        status** — the route answers `200` whatever the receiver said.
      required: [event_id, ok, response_status, latency_ms, response_body_excerpt, error]
      properties:
        event_id:
          type: string
          format: uuid
          description: The id on the wire, so an operator can find it in the receiver's own log.
        ok:
          type: boolean
          description: Whether the receiver answered `2xx`. The same rule every real delivery uses.
        response_status:
          type: [integer, 'null']
          description: The receiver's HTTP status, or `null` when the request never completed.
        latency_ms:
          type: integer
          description: Round trip, including the URL guard's DNS lookup.
        response_body_excerpt:
          type: [string, 'null']
          description: Truncated at 500 bytes, for when the status alone is not enough.
        error:
          type: [string, 'null']
          description: |
            Transport-level failure, or the URL guard's refusal (`Refused by URL guard: …`).
            `null` when we got an answer.

    CreateWebhookEndpointRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000, examples: ['https://acme.example.com/api/payment-webhook'] }
        description:
          type: [string, 'null']
          maxLength: 500
          description: The operator's note. What the admin list shows beside the URL.
        subscribed_events:
          oneOf:
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/WebhookEventType' }
            - type: 'null'
          description: |
            Omitted or `null` means every event type, including ones added later. **`[]` is a
            `400`** — an endpoint subscribed to nothing is a configured destination that silently
            receives no traffic, which is indistinguishable from a broken one. To say "this
            endpoint should receive nothing", disable or delete it.
        contract_version:
          type: integer
          description: |
            Envelope version to pin this endpoint to. Defaults to the latest, and **cannot be
            changed afterwards**. Only supply it when onboarding a receiver written against an
            older envelope; an unsupported value is a `400`.

    PatchWebhookEndpointRequest:
      type: object
      description: |
        **At least one member is required**; an empty body is a `400`.

        There is no `enabled` member and no `rotate_secret` flag — both are their own routes, so
        that neither is reachable by an operator who thought they were editing a URL.
      minProperties: 1
      properties:
        url: { type: string, maxLength: 2000 }
        description:
          type: [string, 'null']
          maxLength: 500
          description: '`null` **clears** it; omitting the member leaves it alone.'
        subscribed_events:
          oneOf:
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/WebhookEventType' }
            - type: 'null'
          description: '`null` means every type. `[]` is a `400`.'

    DisableWebhookEndpointRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Recorded as `disabled_reason`. Optional, and defaulted to `"Disabled by an operator"`
            rather than stored as null, so a non-null reason always means "and it is off".

    MintedWebhookEndpoint:
      type: object
      description: |
        Returned by the create and the rotation, and **only** by those two. The plaintext is a
        separate top-level member rather than a field on the endpoint object, so a client that
        persists the endpoint record cannot persist the secret alongside it by accident — the
        same shape, and the same reason, as a minted API key.
      required: [endpoint, secret, warning]
      properties:
        endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
        secret:
          type: string
          description: |
            The plaintext `whsec_` signing secret. **Shown once**; stored only as ciphertext and
            unrecoverable afterwards. The whole string, prefix included, is the HMAC key.
          examples: ['whsec_YOUR_SIGNING_SECRET']
        warning: { type: string }

    CurrencyTotal:
      type: object
      required: [currency, count, amount_minor]
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        count: { type: integer }
        amount_minor:
          allOf:
            - $ref: '#/components/schemas/MinorAmount'
          description: Never summed across currencies.

    HealthStrip:
      type: object
      description: |
        Every count here comes from a predicate shared with the listing an operator drills into,
        so a tile and the list behind it are the same set by construction — with one exception,
        `admin_keys_without_ip_allowlist`, which has no listing to share one with.
      required:
        [status, database, encryption_key_configured, stuck_payments, failing_credentials,
        pending_deliveries, dead_lettered_deliveries, dead_lettered_deliveries_cross_service,
        disabled_webhook_endpoints, tenants_without_external_ref, unmapped_provider_statuses_24h,
        admin_keys_without_ip_allowlist]
      properties:
        status:
          type: string
          enum: [ok, attention, degraded]
          description: |
            Derived by **blast radius, not severity**. `degraded`: someone cannot take payments,
            we cannot tell, or a business process has stopped with nobody watching — database
            unreachable, no encryption key, any failing credential, any disabled webhook
            endpoint, or any **cross-service** dead-letter. `attention`: something needs a human
            while payments still flow — stuck payments, a merchant's own dead-letters, or an
            unmapped provider status.

            `pending_deliveries` and `tenants_without_external_ref` move the verdict **not at
            all**: pending is what a working queue looks like and an unpaired merchant is a
            provisioning step in progress. A count that is routinely non-zero and routinely fine
            is how a dashboard stops being read.
        database: { type: string, enum: [ok, unreachable] }
        encryption_key_configured: { type: boolean, description: Without a KEK no credential can be decrypted. }
        stuck_payments:
          type: integer
          description: 'Drill-down: `GET /v1/admin/payments/stuck`. A handful is the normal residue of buyers closing tabs.'
        failing_credentials: { type: integer, description: 'Drill-down: `GET /v1/admin/credentials?failing=true`.' }
        pending_deliveries:
          type: integer
          description: |
            Waiting on the ladder. Drill-down:
            `GET /v1/admin/webhook-deliveries?status=pending`. Ordinary — the number to watch for
            a **spike**, not for being non-zero.
        dead_lettered_deliveries:
          type: integer
          description: |
            Ladders exhausted on a **merchant's own** endpoint. Drill-down:
            `GET /v1/admin/webhook-deliveries?status=dead_lettered&cross_service=false`.
            Recoverable — their reconciliation poll covers it — so `attention`.
        dead_lettered_deliveries_cross_service:
          type: integer
          description: |
            Ladders exhausted on an endpoint pointing at **another Lamido service**. Drill-down:
            `GET /v1/admin/webhook-deliveries?status=dead_lettered&cross_service=true`.

            **A different fact from the count above, not a subset of it**: a payment took money
            and the invoice it should have caused does not exist, and nobody outside this estate
            is watching for that. Hence `degraded` rather than `attention`, and hence two counts
            rather than one — so the louder signal cannot be diluted by the noisier one.
        disabled_webhook_endpoints: { type: integer, description: 'Drill-down: `GET /v1/admin/webhook-endpoints?enabled=false`.' }
        tenants_without_external_ref:
          type: integer
          description: |
            Merchants lamido-admin has not paired with an account. Drill-down:
            `GET /v1/admin/merchants?external_ref=missing`.

            Not a data-hygiene number: their events carry `account_id: null` and **can never be
            routed cross-service**, so these customers will never get an invoice for a payment
            they made — and it is invisible without this count because everything else about
            them works.
        unmapped_provider_statuses_24h:
          type: integer
          description: |
            The early-warning signal that a PSP added an enum value. It typically fires weeks
            before it matters.
        admin_keys_without_ip_allowlist:
          type: integer
          description: |
            Live operator keys usable from any address. An admin key reads and moves money
            across every tenant, so "this key works from anywhere" is worth a number rather
            than a property an operator has to open each key to see. Revoked keys are excluded:
            an inactive key authenticates nothing, so counting it would make the number grow
            with history instead of with exposure.

            **Moves the verdict not at all** — the only count here with that property. Every
            key minted before the `allow_any` opt-in has an empty allowlist, so a strip that
            went red on this would have been red from the day it shipped.

            **It also has no drill-down**, unlike every other count in this object: no filter
            binds its predicate, so an operator reads the number and then filters
            `GET /v1/admin/keys` by eye. The description above this schema says every count
            comes from a predicate shared with a listing; that is true of the others and not
            of this one.

    AuditEntry:
      type: object
      description: |
        Append-only. `actor_id` carries **no foreign key**, so the trail stays readable after a
        key is revoked — history has to outlive the row it points at.
      required: [id, actor_type, actor_id, actor_label, action, target_type, target_id, metadata, ip, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_type: { type: string, enum: [admin_key, system] }
        actor_id: { type: [string, 'null'] }
        actor_label:
          type: string
          description: "Denormalised. CLI actions record `scripts/<name>.ts` with `actor_type: system`."
        action: { type: string, examples: [payment.refund] }
        target_type: { type: string, examples: [payment] }
        target_id: { type: [string, 'null'] }
        metadata:
          type: object
          additionalProperties: true
          description: |
            An **allowlisted summary per action**, never a raw request body — that is what keeps
            a plaintext PSP key out of a table which is not encrypted.
        ip: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
