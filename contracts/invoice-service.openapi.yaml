openapi: 3.1.0

# Machine-readable contract for invoice-service.
# Prose, gotchas and runbooks live in the sibling Markdown files — this file is the
# authority on SHAPES (fields, types, enums, status codes); the Markdown is the authority
# on BEHAVIOUR (idempotency semantics, side effects, retry rules).
# Source: https://github.com/lazslov/invoice-service @ 1f6a1ed — verified 2026-08-17
#
# 44 paths, 55 operations.

info:
  title: Invoice Service API
  version: "1.0.0"
  summary: Hungarian invoicing via szamlazz.hu and Billingo, provider chosen per request.
  description: |
    An API-only service for issuing Hungarian invoices through szamlazz.hu and Billingo.
    NAV reporting is done by the providers; this service never talks to NAV.

    **Four surfaces, two credential tiers.**

    | Surface | Prefix | Auth | Browser tripwire |
    |---|---|---|---|
    | Client | `/v1/invoices/*` | `Bearer isk_…` | yes |
    | Admin | `/v1/admin/*` | `Bearer iad_…` | yes |
    | Public download | `/v1/public/invoices/{public_id}/pdf?token=` | signed token | no |
    | Liveness | `/healthz` | none | no |

    **Conventions that this document does not repeat per operation:**

    - A **single resource is returned unwrapped** — there is no `data` envelope on a
      single object. A **collection** always uses `{data, next_cursor, total?}`, even when
      it is not paginated (`next_cursor: null`).
    - **Every error is an RFC 9457 problem document** served as `application/problem+json`.
      Branch on `type`; never on `title` or `detail`.
    - **Money is a decimal string of canonical minor units.** HUF is zero-decimal, so
      `"38100"` is 38 100 Ft. Never a JSON number.
    - **Pagination is keyset**, via an opaque `cursor`. There is no `offset`.
    - Date-range filters are `from` (inclusive) and `until` (**exclusive**), always on
      `created_at`.
    - Every response carries `X-Request-Id`; the same value appears as `request_id` in a
      problem body.
    - The browser tripwire rejects `Origin` or `Sec-Fetch-Dest` with `403` on both secret
      tiers, before authentication. A plain Node `fetch` is unaffected; until 2026-08-09 the
      check read `Sec-Fetch-Mode: cors` and refused every server-side caller.
    - **Every 429 carries both a `Retry-After` header and a `retry_after` body member**, and
      they always agree — the header is derived from the member.
    - **Every endpoint that calls szamlazz.hu or Billingo is throttled**, and rejects before
      the outbound call: 60 creates per client, 10 credential tests per client, 20 PDF
      fetches per **invoice**, 5 cancels per **invoice**, all per 60-second window. The
      per-invoice buckets are shared by the client tier, the admin tier and the public
      download link. Every throttle fails open. See the `ProviderThrottled` response.

    There is **no `/api/*` surface**; it was removed in the 2026-08-02 cutover.
  contact:
    name: invoice-service maintainers
  license:
    name: Proprietary

servers:
  # The deployment host is deliberately absent from this pinned copy. No host ships in
  # a tarball, and contracts/ is one `files` mistake away from being published — see
  # docs/plans/phase-1-foundations.md §4. The consuming project supplies the base URL
  # from its own environment; the SDK has no fallback.
  - url: "{baseUrl}"
    description: Supplied by the consuming project from its own environment.
    variables:
      baseUrl:
        default: https://invoice.example.com
        description: Documentation placeholder, not a usable default.

tags:
  - name: public
    description: Unauthenticated surfaces — liveness and the signed PDF link.
  - name: client
    description: The `isk_` tier. Everything is scoped to the owning client.
  - name: admin
    description: The `iad_` tier. Cross-tenant; requires scopes.

security:
  - ClientKey: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [public]
      summary: Liveness probe
      description: |
        **Always returns HTTP 200 while the process is alive, and it touches no
        dependency.** It answers exactly one question — should the platform restart or
        drain this instance? — and while requests are still being served the answer is no.

        Since `f73e397` it runs no query and reports no `db` member; `status` has exactly
        one value, `"ok"`. There is nothing here to alert on beyond the transport: a broken
        `DATABASE_URL` still answers `200`. Because it wakes nothing, a synthetic monitor
        may poll it at any cadence.

        **For the database, the stuck counts and the queue, use
        `GET /v1/admin/health`** — which is also always `200`, so read its body.
      security: []
      responses:
        "200":
          description: |
            The process is alive. The body is always exactly `{"status":"ok"}` and says
            nothing about any dependency.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              examples:
                healthy:
                  value: { status: ok }

  /v1/public/invoices/{public_id}/pdf:
    get:
      operationId: getPublicInvoicePdf
      tags: [public]
      summary: Download an invoice PDF with a signed token
      description: |
        Serves the PDF for a link minted by `GET /v1/invoices/{public_id}/download-link` or
        its admin equivalent. No API key: the token authorises access to this one invoice.

        **No browser tripwire here** — a browser is the entire point of this surface.
        The PDF is re-fetched from the provider on every request; nothing is stored.
      security: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
        - name: token
          in: query
          required: true
          description: |
            `<expiryEpochSeconds>.<base64url HMAC-SHA256>`, valid for 7 days from minting
            and bound to this one invoice. Opaque — do not construct one.
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Pdf"
        "403":
          description: |
            Token missing, malformed, tampered with, or expired. Also the response after
            `DOWNLOAD_LINK_SECRET` is rotated, which revokes every outstanding link.
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Token valid, but the invoice is not in a downloadable state.
          $ref: "#/components/responses/NotFound"
        "429":
          description: |
            `invoice_pdf` bucket — more than 20 fetches of this invoice in the current
            minute, from any tier. This unauthenticated route shares the counter with
            `getInvoicePdf` and `getAnyInvoicePdf`, so a customer refreshing the signed link
            spends the same budget your backend uses.
          $ref: "#/components/responses/ProviderThrottled"
        "502":
          $ref: "#/components/responses/ProviderError"

  /v1/invoices:
    post:
      operationId: createInvoice
      tags: [client]
      summary: Issue an invoice (idempotent)
      description: |
        Issues a **real invoice** at szamlazz.hu or Billingo, which also handles NAV
        reporting.

        `Idempotency-Key` is required. A row is reserved `pending` before the provider is
        called. Guards run in a fixed order, and it decides which failures consume the key:

        1. browser tripwire → 403
        2. authentication → 401 / 429 (failed-auth throttle)
        3. body validation → 400 with `errors[]`
        4. `Idempotency-Key` present → 400 `idempotency_key_required`
        5. config allow-listed → 403
        6. config-id prefix matches provider → 400 `provider_config_mismatch`
        7. provider throttle, `invoice_create` bucket, 60/client/minute → 429
        8. **reserve the key** — from here on the key IS consumed
        9. resolve the credential → 400 (no `code`) or 500
        10. call the provider → 502

        Step 7 sits above step 8 deliberately: a 429 must not cost the caller their
        idempotency key, so the throttle rejects before anything is written. The trade-off
        is that an idempotent replay — resolved at step 8 without contacting a provider — is
        counted at step 7 anyway.

        A replay answers `200` with `Idempotent-Replay: true` and does not call the
        provider. Same key + a different body is a `409`.
      security:
        - ClientKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Stable per business event (`order-2026-0001`), never random per attempt.
            Reserved for 7 days; after that the key is free and reuse starts a new
            operation with a new `public_id`.
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/XRequestIdIn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
            examples:
              minimal:
                summary: Everything optional defaulted
                value:
                  provider: szamlazz
                  provider_config_id: szamlazz_acme
                  partner:
                    name: Teszt Vevő Kft
                    address:
                      postal_code: "1011"
                      city: Budapest
                      address: Fő utca 1
                  items:
                    - name: Tanácsadás
                      quantity: 1
                      net_unit_price_minor: "15000"
                      vat_rate: "27"
              full:
                summary: Every field populated
                value:
                  provider: billingo
                  provider_config_id: billingo_acme
                  partner:
                    name: Teszt Vevő Kft
                    tax_number: 12345678-2-42
                    email: vevo@example.hu
                    address:
                      postal_code: "1011"
                      city: Budapest
                      address: Fő utca 1
                      country: Magyarország
                  items:
                    - name: Tanácsadás
                      quantity: 2
                      unit: óra
                      net_unit_price_minor: "15000"
                      vat_rate: "27"
                      comment: 2026 júliusi keret
                  seller:
                    bank_name: OTP Bank
                    bank_account: 11111111-22222222-33333333
                  payment_method: átutalás
                  currency: HUF
                  language: hu
                  issue_date: "2026-08-02"
                  fulfillment_date: "2026-08-02"
                  due_date: "2026-08-10"
                  e_invoice: true
                  comment: Köszönjük a megrendelést!
                  partner_ref: order-2026-0001
      responses:
        "201":
          description: A new invoice was issued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "200":
          description: |
            Idempotent replay — this key was already used by this client. The provider was
            **not** called. The returned invoice may be in any status, including `failed`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replay:
              description: Always `true` on a replay; absent otherwise.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: |
            Schema failure (`errors[]`), a missing header
            (`code: idempotency_key_required`), a provider/config-id mismatch
            (`code: provider_config_mismatch`), or — with **neither** `errors[]` nor `code`
            — a credential-resolution failure, which is the one 400 that consumes the key.
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Browser tripwire, or the config id is not allow-listed for this client.
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `code: idempotency_key_reused` (same key, different body) or
            `code: idempotency_key_in_flight` (a concurrent request holds the key).
          $ref: "#/components/responses/Conflict"
        "429":
          description: |
            `invoice_create` bucket — more than 60 creates for this client in the current
            minute — or the failed-auth throttle; `detail` distinguishes them. **The
            idempotency key is not consumed either way**, so the identical request with the
            same key is safe to resend after `retry_after`. Idempotent replays are counted
            against the bucket too.
          $ref: "#/components/responses/ProviderThrottled"
        "500":
          description: |
            Either a credential could not be resolved or decrypted (row left `failed`,
            retry with a NEW key), or — `detail` beginning "The invoice was issued but
            could not be recorded" — the provider issued a real document and the write
            recording it did not land. **Do not retry the second one with a new key**: it
            issues a second real invoice that a human then has to storno. Contact support
            with the `request_id`.
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

    get:
      operationId: listInvoices
      tags: [client]
      summary: List this client's invoices
      description: |
        Newest first, ordered by `(created_at desc, public_id desc)`.
        **`total` is omitted** on this tier — the key is absent, not `null`.
      security:
        - ClientKey: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/InvoiceStatus" }
        - name: provider
          in: query
          schema: { $ref: "#/components/schemas/Provider" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of invoices.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/invoices/{public_id}:
    get:
      operationId: getInvoice
      tags: [client]
      summary: Get one invoice
      description: |
        The polling endpoint — the service never calls you back. Scoped to the owning
        client in the query itself, so another client's invoice is a `404` rather than a
        `403`; non-existence and no-access are deliberately indistinguishable.
      security:
        - ClientKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          description: The invoice.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: "`public_id` is not a uuid. `errors[0].pointer` is `#/param/public_id`."
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/invoices/{public_id}/pdf:
    get:
      operationId: getInvoicePdf
      tags: [client]
      summary: Download this invoice's PDF
      description: |
        Re-fetched from the provider on every call; nothing is cached or stored. A
        canceled invoice is **not** downloadable here, even though the document still
        exists at the provider.
      security:
        - ClientKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          $ref: "#/components/responses/Pdf"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`code: not_downloadable` — the invoice is not `created`."
          $ref: "#/components/responses/WrongState"
        "429":
          description: |
            `invoice_pdf` bucket — more than 20 fetches of this invoice in the current
            minute. Keyed on the invoice and shared with `getAnyInvoicePdf` and
            `getPublicInvoicePdf`. The 422 state guard runs first, so a wrong-state request
            costs no unit.
          $ref: "#/components/responses/ProviderThrottled"
        "502":
          $ref: "#/components/responses/ProviderError"

  /v1/invoices/{public_id}/download-link:
    get:
      operationId: createInvoiceDownloadLink
      tags: [client]
      summary: Mint a 7-day public download link
      description: |
        For sending a PDF to the end customer without exposing your API key. The token is
        a stateless HMAC bound to this one invoice. Calling again mints a new token; old
        ones stay valid until they expire. **There is no per-link revoke.**
      security:
        - ClientKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          description: A signed URL and its expiry.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadLink" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`code: not_downloadable`."
          $ref: "#/components/responses/WrongState"

  /v1/invoices/{public_id}/cancel:
    post:
      operationId: cancelInvoice
      tags: [client]
      summary: Cancel (storno) this invoice
      description: |
        Issues a **real storno document at the provider**, reported to NAV. Cannot be
        undone. No request body is required or read.

        The response is the Invoice object plus `storno_number`, which appears **here and
        nowhere else** — there is no column for it. Persist it on receipt, or recover it
        later from `GET /v1/admin/audit?action=invoice.cancel&target_id=…`.

        Audited as `actor_type: client_key`, with no `reason` (this endpoint takes no body).
      security:
        - ClientKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          description: The canceled invoice, plus the storno number if the provider returned one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanceledInvoice" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`code: not_cancellable` — only a `created` invoice can be stornoed. Nothing was sent to the provider."
          $ref: "#/components/responses/WrongState"
        "429":
          description: |
            `invoice_cancel` bucket — more than 5 cancels of this invoice in the current
            minute, shared with `cancelAnyInvoice`. Because a successful cancel is terminal
            and the 422 guard runs first, this is reachable only from a retry loop against
            an invoice that is still `created`.
          $ref: "#/components/responses/ProviderThrottled"
        "500":
          description: |
            `detail`: "The invoice was canceled but could not be recorded." The storno
            succeeded at the provider and the write recording it did not land. **Do not
            retry** — the document is already reversed. Reconcile from the audit trail,
            which was written before the failure. A concurrent cancel that merely got
            there first is not this: that returns a normal `200`.
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  # ---------------------------------------------------------------- admin: self

  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Describe the calling admin key
      description: No scope required — a key must always be able to discover what it may do.
      security:
        - AdminKey: []
      responses:
        "200":
          description: The calling key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKey" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/admin/health:
    get:
      operationId: getAdminHealth
      tags: [admin]
      summary: Operational health for the dashboard strip
      description: |
        **Always HTTP 200, even when degraded.** Alert on the body, not the status code.
        No scope required. Every count has a drill-down listing that returns exactly the
        rows it counts.
      security:
        - AdminKey: []
      responses:
        "200":
          description: Health snapshot. The three counts are absent in the degraded body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealth" }
              examples:
                attention:
                  value:
                    status: attention
                    encryption_key_configured: true
                    download_link_secret_configured: true
                    database: ok
                    stuck_invoices: 2
                    failing_credentials: 1
                    untested_credentials: 3
                degraded:
                  value:
                    status: degraded
                    database: unreachable
                    encryption_key_configured: true
                    download_link_secret_configured: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/providers:
    get:
      operationId: listProviders
      tags: [admin]
      summary: Provider catalog — the credential-form contract
      description: |
        Read this instead of hardcoding provider knowledge in the admin UI.

        **This is the one payload on the service that is camelCase.** `configIdPrefix`,
        `configFields`, `envFallback`, `testDescription` and the config keys
        `blockId` / `bankAccountId` were deliberately not renamed, because those are the
        literal keys stored in `provider_credentials.config` and sent to Billingo.

        Scope: `credentials:read`.
      security:
        - AdminKey: []
      responses:
        "200":
          description: Every configurable provider.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderDescriptor" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --------------------------------------------------------- admin: admin keys

  /v1/admin/admin-keys:
    get:
      operationId: listAdminKeys
      tags: [admin]
      summary: List every admin key
      description: |
        Active and revoked, newest first. **Unpaginated** — the query string is not read at
        all, so `?limit=` is silently ignored rather than rejected. No `total`.
        Scope: `admin:manage`.
      security:
        - AdminKey: []
      responses:
        "200":
          description: All admin keys.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminKey" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createAdminKey
      tags: [admin]
      summary: Mint an admin key
      description: |
        The plaintext `api_key` is returned **once** and never stored, logged or written to
        the audit trail. Scope: `admin:manage`.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminKeyRequest" }
      responses:
        "201":
          description: The new key, including its one-time plaintext.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKeyWithSecret" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/admin-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/AdminKeyId"
    patch:
      operationId: updateAdminKey
      tags: [admin]
      summary: Update an admin key
      description: |
        At least one field, else `400`. This is how an IP allowlist is switched on later
        without a redeploy. Never re-issues a key. Scope: `admin:manage`.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminKeyRequest" }
      responses:
        "200":
          description: The updated key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKey" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`code: self_deactivation` — refusing to deactivate the calling key."
          $ref: "#/components/responses/Conflict"
        "500":
          description: |
            Also returned when `{id}` is not a uuid — this route does not validate the path
            parameter, so a malformed id reaches Postgres.
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: revokeAdminKey
      tags: [admin]
      summary: Revoke an admin key (soft)
      description: |
        Sets `active: false`; the row stays so the audit trail keeps its label.
        Scope: `admin:manage`.
      security:
        - AdminKey: []
      responses:
        "200":
          description: The revoked key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKey" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`code: self_revocation` — refusing to revoke the calling key."
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # ------------------------------------------------------------ admin: clients

  /v1/admin/clients:
    get:
      operationId: listClients
      tags: [admin]
      summary: List clients with rollup counts
      description: |
        Newest first. `total` reflects the filters but ignores the cursor.
        `credential_count` counts **active** credentials only; `invoice_count` and
        `last_invoice_at` cover all time. Scope: `clients:read`.
      security:
        - AdminKey: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring on `name` **or** `external_ref`.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: active
          in: query
          schema: { $ref: "#/components/schemas/BoolFlag" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of clients.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ClientWithCounts" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total: { type: integer, minimum: 0 }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createClient
      tags: [admin]
      summary: Create a client
      description: |
        Returns the client plus a one-time `api_key` (`isk_…`). A new client starts with
        `allowed_provider_configs: []` and cannot issue anything until an integration is
        attached. Scope: `clients:write`.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientRequest" }
      responses:
        "201":
          description: The new client and its one-time key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientWithSecret" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/clients/{public_id}:
    parameters:
      - $ref: "#/components/parameters/ClientPublicId"
    get:
      operationId: getClient
      tags: [admin]
      summary: Client detail, with every integration
      description: |
        Everything a detail page needs in one request: the client, its rollups, and all its
        integrations (masked, including inactive ones), sorted by `config_id`.
        Scope: `clients:read`.
      security:
        - AdminKey: []
      responses:
        "200":
          description: The client with counts and integrations.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientDetail" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateClient
      tags: [admin]
      summary: Update a client
      description: |
        At least one field, else `400`. `allowed_provider_configs` is an escape hatch that
        replaces the array wholesale — prefer the integration endpoints, which maintain it.
        Scope: `clients:write`.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateClientRequest" }
      responses:
        "200":
          description: The updated client, without rollup counts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteClient
      tags: [admin]
      summary: Deactivate (or hard-delete) a client
      description: |
        Soft by default. `?hard=true` deletes the credential rows and then the client, and
        is refused with `409` if the client has any invoice. Scope: `clients:write`.
      security:
        - AdminKey: []
      parameters:
        - name: hard
          in: query
          description: Permanent delete. Only when the client has zero invoices.
          schema:
            allOf: [{ $ref: "#/components/schemas/BoolFlag" }]
            default: "false"
      responses:
        "200":
          description: The deactivated client, or the hard-delete acknowledgement.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Client"
                  - $ref: "#/components/schemas/DeletedAck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`code: client_has_invoices` — deactivate instead."
          $ref: "#/components/responses/Conflict"

  /v1/admin/clients/{public_id}/rotate-key:
    post:
      operationId: rotateClientKey
      tags: [admin]
      summary: Rotate a client's API key
      description: |
        No body. **The old key stops working immediately** — there is no overlap window.
        Scope: `clients:write`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/ClientPublicId"
      responses:
        "201":
          description: The client and its new one-time key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientWithSecret" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------- admin: integrations

  /v1/admin/integrations:
    get:
      operationId: listAllIntegrations
      tags: [admin]
      summary: Cross-client credential listing
      description: |
        The only credential read not scoped to one client in the path — this is how you
        answer *which* credential is failing rather than how many.

        Ordered by client `name`, then `config_id`, then credential `id`; the cursor is
        that same three-part tuple, because client names are not unique and a keyset cursor
        over a non-total order can skip rows at a tie.

        Scope: `credentials:read`.
      security:
        - AdminKey: []
      parameters:
        - name: client_public_id
          in: query
          description: An unknown id returns an empty page rather than a 404.
          schema: { type: string, format: uuid }
        - name: provider
          in: query
          schema: { $ref: "#/components/schemas/Provider" }
        - name: config_id
          in: query
          description: Exact match across all clients, not a prefix search.
          schema: { $ref: "#/components/schemas/ConfigId" }
        - name: last_test_status
          in: query
          description: "`untested` is not a stored value — it matches `last_test_status IS NULL`."
          schema:
            type: string
            enum: [ok, failed, untested]
        - name: allowed
          in: query
          description: Whether `config_id` is in the owning client's `allowed_provider_configs`.
          schema: { $ref: "#/components/schemas/BoolFlag" }
        - name: active
          in: query
          schema: { $ref: "#/components/schemas/BoolFlag" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of credentials with their owners.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CredentialWithClient" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total: { type: integer, minimum: 0 }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/clients/{public_id}/integrations:
    get:
      operationId: listClientIntegrations
      tags: [admin]
      summary: All of one client's credentials
      description: |
        Active and inactive, sorted by `config_id`. **Unpaginated** and the query string is
        not read at all, so `?limit=` is silently ignored. No `total`.
        Scope: `credentials:read`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/ClientPublicId"
      responses:
        "200":
          description: Every credential for this client.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: |
            Also returned when `{public_id}` is not a uuid — the nested integrations router
            does not validate the parent path parameter.
          $ref: "#/components/responses/InternalError"

  /v1/admin/clients/{public_id}/integrations/{config_id}:
    parameters:
      - $ref: "#/components/parameters/ClientPublicId"
      - $ref: "#/components/parameters/ConfigIdPath"
    get:
      operationId: getClientIntegration
      tags: [admin]
      summary: One credential
      description: "Scope: `credentials:read`."
      security:
        - AdminKey: []
      responses:
        "200":
          description: The credential, masked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400":
          description: "Config id violates `^[a-z0-9_]+$`. `errors[0].pointer` is `#/param/config_id`."
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: upsertClientIntegration
      tags: [admin]
      summary: Create or rotate a provider credential
      description: |
        The only way to write a provider secret through the API. Two side effects that both
        matter:

        - `config_id` is added to the client's `allowed_provider_configs` — without it the
          credential exists but invoicing still `403`s.
        - Supplying `secret` clears `last_tested_at` / `last_test_status` /
          `last_test_error`, so the credential starts counting towards
          `untested_credentials`. Re-run the test.

        **Never log this request body** — it carries a plaintext provider secret. The audit
        entry records only the config id, provider, whether the secret rotated, and the
        config key names.

        Scope: `credentials:write`.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertIntegrationRequest" }
            examples:
              billingo:
                value:
                  provider: billingo
                  secret: REPLACE_WITH_BILLINGO_API_KEY
                  config: { blockId: 1234, bankAccountId: 5678 }
                  label: Acme main block
              szamlazz:
                value:
                  provider: szamlazz
                  secret: REPLACE_WITH_AGENT_KEY
                  label: Acme agent
              metadataOnly:
                summary: Rename without re-typing the secret
                value:
                  provider: billingo
                  config: { blockId: 1234, bankAccountId: 5678 }
                  label: Renamed
      responses:
        "201":
          description: The credential was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "200":
          description: An existing credential was updated.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400":
          description: |
            `code: provider_config_mismatch`, or `errors[]` naming every missing config key
            (`pointer: /config/blockId`), a missing `secret` on create
            (`pointer: /secret`), or a malformed config id.
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteClientIntegration
      tags: [admin]
      summary: Deactivate a credential and un-allow-list it
      description: |
        Soft delete — the ciphertext is retained so a mistake is recoverable by re-`PUT`ting
        (the secret may be omitted). Removing the config id from
        `allowed_provider_configs` is what actually stops invoicing.
        Scope: `credentials:write`.
      security:
        - AdminKey: []
      responses:
        "200":
          description: "The credential, now `active: false, allowed: false`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/clients/{public_id}/integrations/{config_id}/test:
    post:
      operationId: testClientIntegration
      tags: [admin]
      summary: Verify a credential against the provider
      description: |
        **Read-only at the provider: it issues, modifies and cancels nothing.** No request
        body.

        **`ok: false` is a result, not an error** — the HTTP status is `200` either way.
        Never branch on the status code here. The verdict is persisted to the credential's
        `last_test_*` fields and feeds the health counts.

        Scope: `credentials:write`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/ClientPublicId"
        - $ref: "#/components/parameters/ConfigIdPath"
      responses:
        "200":
          description: The test result, whether it passed or failed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialTestResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: |
            `credential_test` bucket — more than 10 tests for this client in the current
            minute, counted across every `config_id` the client has. **An admin key is not
            exempt:** the limit protects the provider's own login endpoint. Pace a sweep by
            grouping the worklist by client.
          $ref: "#/components/responses/ProviderThrottled"

  # ----------------------------------------------------------- admin: invoices

  /v1/admin/invoices:
    get:
      operationId: listAllInvoices
      tags: [admin]
      summary: Cross-client invoice list
      description: |
        Newest first, with `total`. There is **no search by customer name** — partner data
        is never stored. Scope: `invoices:read`.
      security:
        - AdminKey: []
      parameters:
        - name: client_public_id
          in: query
          description: An unknown id returns an empty page rather than a 404.
          schema: { type: string, format: uuid }
        - name: provider
          in: query
          schema: { $ref: "#/components/schemas/Provider" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/InvoiceStatus" }
        - name: config_id
          in: query
          schema: { $ref: "#/components/schemas/ConfigId" }
        - name: q
          in: query
          description: Case-insensitive substring across `invoice_number`, `partner_ref`, `provider_invoice_id`.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of invoices across all clients.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminInvoice" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total: { type: integer, minimum: 0 }
                additionalProperties: false
        "400":
          description: "Bad filter, malformed cursor, or `from > until` (`pointer: /from`)."
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/invoices/stuck:
    get:
      operationId: listStuckInvoices
      tags: [admin]
      summary: Invoices left pending by a crash
      description: |
        **Oldest first** — this is a work queue, and the oldest stuck row has been wrong for
        longest. The cursor therefore walks forwards, unlike every other list here.

        `older_than_minutes` and `cutoff` come back as siblings of `data`, so a response
        says what "stuck" meant for it. Scope: `invoices:read`.
      security:
        - AdminKey: []
      parameters:
        - name: older_than_minutes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 43200
            default: 15
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of stuck invoices, oldest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total, older_than_minutes, cutoff]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdminInvoice" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total: { type: integer, minimum: 0 }
                  older_than_minutes: { type: integer }
                  cutoff: { type: string, format: date-time }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/invoices/{public_id}:
    get:
      operationId: getAnyInvoice
      tags: [admin]
      summary: Get any invoice, any client
      description: "Admin reads are not tenant-scoped. Scope: `invoices:read`."
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          description: The invoice, with its owner and idempotency key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvoice" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/invoices/{public_id}/pdf:
    get:
      operationId: getAnyInvoicePdf
      tags: [admin]
      summary: Download any invoice's PDF
      description: "Re-fetched from the provider every time. Scope: `invoices:read`."
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          $ref: "#/components/responses/Pdf"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`code: not_downloadable`."
          $ref: "#/components/responses/WrongState"
        "429":
          description: |
            `invoice_pdf` bucket — 20 per invoice per minute, shared with the client-tier
            and public PDF routes. An operator pulling a document a customer is also
            refreshing exhausts it for both.
          $ref: "#/components/responses/ProviderThrottled"
        "502":
          $ref: "#/components/responses/ProviderError"

  /v1/admin/invoices/{public_id}/download-link:
    get:
      operationId: createAnyInvoiceDownloadLink
      tags: [admin]
      summary: Mint a 7-day link for any invoice
      description: "For sending a support copy to an end customer. Scope: `invoices:read`."
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      responses:
        "200":
          description: A signed URL and its expiry.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadLink" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`code: not_downloadable`."
          $ref: "#/components/responses/WrongState"

  /v1/admin/invoices/{public_id}/cancel:
    post:
      operationId: cancelAnyInvoice
      tags: [admin]
      summary: Storno an invoice on the client's behalf
      description: |
        **Real financial effect at the provider, reported to NAV.** `reason` is required and
        written to the audit log.

        `storno_number` appears in this response and nowhere else. Scope: `invoices:write`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The canceled invoice, plus the storno number if the provider returned one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanceledAdminInvoice" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`code: not_cancellable`. Nothing was sent to the provider."
          $ref: "#/components/responses/WrongState"
        "429":
          description: |
            `invoice_cancel` bucket — 5 per invoice per minute, shared with the client-tier
            cancel.
          $ref: "#/components/responses/ProviderThrottled"
        "500":
          description: |
            `detail`: "The invoice was canceled but could not be recorded." The storno
            succeeded at the provider and the write recording it did not land. **Do not
            retry** — the document is already reversed. The audit row was written before
            the failure, so reconcile from there.
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"

  /v1/admin/invoices/{public_id}/reconcile:
    post:
      operationId: reconcileInvoice
      tags: [admin]
      summary: Resolve a stuck pending invoice
      description: |
        Requires `status === "pending"`. There is no automatic resolution: a pending row has
        no `provider_invoice_id` and szamlazz cannot be searched by an external key, so an
        operator checks the provider's UI and reports what they found.

        **Every variant is strict** — an unknown key anywhere in the body is a `400`. This
        is the only endpoint that deletes rows.

        Scope: `invoices:write`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/InvoicePublicId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200":
          description: |
            The updated invoice for `mark_failed` and `attach`; a release acknowledgement
            for `release`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminInvoice"
                  - $ref: "#/components/schemas/ReleasedAck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such invoice, or it was deleted between the read and the write by a
            concurrent `release`.
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `code: invoice_state_changed` — the invoice moved between the read and the
            write, usually a client cancelling concurrently. **Nothing was written.**
            Re-read the invoice and decide again.
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            `code: not_reconcilable` — only a `pending` invoice can be reconciled. A
            `failed` invoice cannot be rescued with `attach`; that transition does not
            exist.
          $ref: "#/components/responses/WrongState"

  # -------------------------------------------------------------- admin: stats

  /v1/admin/stats/overview:
    get:
      operationId: getStatsOverview
      tags: [admin]
      summary: Dashboard aggregate
      description: |
        `by_status` / `by_provider` omit keys with zero rows. `last_24h` and the client
        counts ignore `from`/`until`. `gross` covers **only `created`** invoices and is
        grouped by currency, never summed across it. Scope: `stats:read`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Until"
      responses:
        "200":
          description: The aggregate.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsOverview" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/stats/timeseries:
    get:
      operationId: getStatsTimeseries
      tags: [admin]
      summary: Invoice volume by bucket and status
      description: |
        **Sparse** — a bucket/status pair with no rows is absent, not zero. Fill the gaps
        client-side before charting. `interval` and `range` are siblings of `data`.
        Scope: `stats:read`.
      security:
        - AdminKey: []
      parameters:
        - name: interval
          in: query
          schema:
            type: string
            enum: [hour, day]
            default: day
        - name: client_public_id
          in: query
          schema: { type: string, format: uuid }
        - name: provider
          in: query
          schema: { $ref: "#/components/schemas/Provider" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Until"
      responses:
        "200":
          description: The series.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, interval, range]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [bucket, status, count]
                      properties:
                        bucket: { type: string, format: date-time }
                        status: { $ref: "#/components/schemas/InvoiceStatus" }
                        count: { type: integer, minimum: 0 }
                      additionalProperties: false
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  interval: { type: string, enum: [hour, day] }
                  range: { $ref: "#/components/schemas/Range" }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/stats/clients:
    get:
      operationId: getStatsClients
      tags: [admin]
      summary: Per-client rollup
      description: |
        Sorted by client name. **Every client appears**, including ones with no invoices in
        range (all zeroes) and inactive ones.

        `gross_amount_minor` here sums **every currency indiscriminately**, which is
        meaningless for a multi-currency tenant — use `stats/overview.gross` in that case.

        Scope: `stats:read`.
      security:
        - AdminKey: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Until"
      responses:
        "200":
          description: The rollup.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, range]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ClientStats" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  range: { $ref: "#/components/schemas/Range" }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -------------------------------------------------------------- admin: audit

  /v1/admin/audit:
    get:
      operationId: listAuditEntries
      tags: [admin]
      summary: Read the append-only audit trail
      description: |
        Newest first, with `total`. Both credential tiers write here — `actor_type` tells
        them apart, and a client-tier `invoice.cancel` carries no `reason`.

        `request_id` joins an entry to the log lines of the request that caused it.

        Reads are not audited; only mutations are. CLI actions are not audited at all.

        Scope: `audit:read`.
      security:
        - AdminKey: []
      parameters:
        - name: actor_type
          in: query
          schema: { $ref: "#/components/schemas/AuditActorType" }
        - name: actor_id
          in: query
          description: The actor's **internal** id — an `admin_keys.id` or a `clients.id`.
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: Exact match, not a prefix.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: target_type
          in: query
          schema: { $ref: "#/components/schemas/AuditTargetType" }
        - name: target_id
          in: query
          description: "`public_id` for clients and invoices; internal uuid for credentials and admin keys."
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Until"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of audit entries.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  total: { type: integer, minimum: 0 }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/hooks/payment-service:
    post:
      operationId: receivePaymentServiceEvent
      summary: Receive a house event from payment-service
      description: |
        **Not a route you call.** The estate's inbound house-event surface: payment-service
        posts a signed `payment.succeeded` here and this service issues an invoice for it.

        Carries **no bearer key** — the sending service's `X-Signature` is the credential —
        and is mounted ahead of both authenticators and exempt from the browser tripwire, as
        `/v1/providers/*` is elsewhere in the estate. A typo under `/v1/hooks/` is a 404.

        **The only non-2xx is a failed signature.** Every other outcome is a decision, and a
        decision is something the sender must stop retrying: a 4xx would put the event back
        on a ladder that replays for ~3.5 days and change nothing. Read `status` in the body.

        The side effect is idempotent on the event: the `Idempotency-Key` used to issue the
        invoice is `evt_<event_id>:invoice.issue`, so a redelivery cannot produce a second
        legal document.
      security: []
      tags: [Hooks]
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
          description: '`sha256=<hex>` over `{timestamp}.{raw body}`, HMAC-SHA-256.'
        - name: X-Signature-Timestamp
          in: header
          required: true
          schema: { type: string }
          description: Unix seconds. Rejected outside a 300-second window.
        - name: X-Event-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: The emitter's event id. Informational here; the body is authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                The estate envelope, as payment-service emits it. Only the members this
                service reads are constrained here; `tenant` is deliberately not interpreted.
              required:
                - event_id
                - event_type
                - contract_version
                - occurred_at
                - service
                - account_id
                - correlation_id
                - causation_id
                - hop
                - data
              properties:
                event_id: { type: string, format: uuid }
                event_type: { type: string }
                contract_version: { type: integer }
                occurred_at: { type: string, format: date-time }
                service: { type: string, description: Must equal `payment-service` on this surface. }
                account_id:
                  type: [string, 'null']
                  description: |
                    The lamido-admin account id. **Null is refused, never guessed** — it means
                    the emitting tenant has not been paired.
                correlation_id: { type: string, format: uuid }
                causation_id: { type: [string, 'null'], format: uuid }
                hop:
                  type: integer
                  minimum: 0
                  description: Refused at 3 or above, and counted.
                data: { type: object }
      responses:
        "200":
          description: |
            Accepted, ignored, refused, duplicated or failed — all of them 200. The body says
            which.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted, ignored, refused, duplicate, failed]
                additionalProperties: false
        "400":
          description: |
            Signature verification failed. **The body is not stored** and the failure is logged
            as a security event. The detail deliberately does not say which check failed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/event-types:
    get:
      operationId: listEventTypes
      summary: The closed event catalogue, as data
      description: |
        The same array that validates a subscription and drives the emitter, so a trigger
        picker built on this route cannot go stale. `webhook.ping` is deliberately absent.

        `sensitive_blocks` is `[]` on every entry here and will stay that way: this service
        stores no personal data, so there is nothing for an `include_*` flag to switch on.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: Every event type this service can emit.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEventTypeDescriptor" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      summary: Every endpoint, across clients
      description: '`enabled=false` is the drill-down behind the `disabled_webhook_endpoints` health count and shares its predicate.'
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: event_type, in: query, schema: { $ref: "#/components/schemas/WebhookEventType" } }
      responses:
        "200":
          description: A page of endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/clients/{public_id}/webhook-endpoints:
    parameters:
      - $ref: "#/components/parameters/ClientPublicId"
    get:
      operationId: listClientWebhookEndpoints
      summary: One client's endpoints
      description: 200 with an empty array when there are none — never a 404.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: The client's endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createWebhookEndpoint
      summary: Add a destination, and mint its signing secret
      description: |
        The secret is returned **once**, here. There is no route that reveals it afterwards —
        only `secret_last4` and `secret_fingerprint`.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: |
                    HTTPS. Validated against private and link-local ranges at save time **and
                    again at delivery time**, because DNS can be re-pointed in between.
                description: { type: [string, 'null'], maxLength: 200 }
                subscribed_events:
                  oneOf:
                    - type: array
                      minItems: 1
                      items: { $ref: "#/components/schemas/WebhookEventType" }
                    - type: 'null'
                  description: |
                    **Default when omitted: null**, meaning every type including ones added
                    later. An empty array is a 400 — "subscribed to nothing" and "not
                    configured" are different states, and the former is what `disable` is for.
                contract_version:
                  type: integer
                  minimum: 1
                  description: 'Pinned at creation and never patchable. Default when omitted: the latest.'
      responses:
        "201":
          description: The endpoint, plus its signing secret — the only time it is returned.
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, secret, warning]
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
                  secret: { type: string, description: '`whsec_…`. Store it now; it cannot be read back.' }
                  warning: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/webhook-endpoints/{public_id}:
    parameters:
      - $ref: "#/components/parameters/EndpointPublicId"
    get:
      operationId: getWebhookEndpoint
      summary: One endpoint
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchWebhookEndpoint
      summary: Change an endpoint's configuration
      description: |
        Must change at least one field. `description: null` clears it; absent leaves it alone.

        **Does not re-enable and does not clear `consecutive_failures`** — bundling "the
        destination is good now" into every field change is how fixing a typo in a URL
        silently re-arms an endpoint that has been dead for a week. `contract_version` is
        absent on purpose: moving a live endpoint between envelope versions changes the bytes
        its receiver verifies, which is a new endpoint rather than an edit.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                description: { type: [string, 'null'], maxLength: 200 }
                subscribed_events:
                  oneOf:
                    - type: array
                      minItems: 1
                      items: { $ref: "#/components/schemas/WebhookEventType" }
                    - type: 'null'
      responses:
        "200":
          description: The endpoint as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhookEndpoint
      summary: Remove an endpoint and its deliveries
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/webhook-endpoints/{public_id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/EndpointPublicId"
    post:
      operationId: rotateWebhookEndpointSecret
      summary: Mint a new signing secret
      description: |
        **The old secret stops working immediately — there is no grace period.** Only this
        endpoint is affected; the client's others keep verifying. Also re-enables and clears
        the failure counter, because an operator rotating is about to hand the receiver a
        working secret.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: The endpoint, plus the new secret — returned once.
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, secret, warning]
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
                  secret: { type: string }
                  warning: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/webhook-endpoints/{public_id}/enable:
    parameters:
      - $ref: "#/components/parameters/EndpointPublicId"
    post:
      operationId: enableWebhookEndpoint
      summary: Re-enable an endpoint and clear its failure counter
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: The endpoint, enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/webhook-endpoints/{public_id}/disable:
    parameters:
      - $ref: "#/components/parameters/EndpointPublicId"
    post:
      operationId: disableWebhookEndpoint
      summary: Stop delivering to an endpoint
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: |
                    Recorded on the endpoint. A disable always records one, so a non-null
                    `disabled_reason` never reads as "reason lost".
      responses:
        "200":
          description: The endpoint, disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/webhook-endpoints/{public_id}/test:
    parameters:
      - $ref: "#/components/parameters/EndpointPublicId"
    post:
      operationId: testWebhookEndpoint
      summary: Deliver a signed webhook.ping, synchronously
      description: |
        Proves a destination before a client relies on it — which matters more here than
        elsewhere, because the alternative way to prove it is to issue a legal document
        reported to NAV.

        **Always 200, whatever the receiver said. Read `ok`, not the HTTP status.** Writes no
        event row and no delivery row: a probe is not a fact about an invoice, and a failed
        probe is an operator mid-configuration rather than a receiver that has gone away.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: The probe's outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, event_id]
                properties:
                  ok: { type: boolean, description: Whether the receiver answered 2xx within the timeout. }
                  event_id: { type: string, format: uuid }
                  response_status: { type: [integer, 'null'] }
                  response_body_excerpt: { type: [string, 'null'], description: At most 500 bytes. A diagnostic, never parsed. }
                  error: { type: [string, 'null'] }
                  latency_ms: { type: [integer, 'null'] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The endpoint has no signing secret. Rotate one in first.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/admin/webhook-events:
    get:
      operationId: listWebhookEvents
      summary: The outbox
      description: |
        `correlation_id` is **the cross-service trace**: one value returns everything a single
        payment caused on this side of the chain, and the same value queries payment-service
        and email-service. It is indexed precisely so it is usable during an incident.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: client_public_id, in: query, schema: { type: string, format: uuid } }
        - { name: event_type, in: query, schema: { $ref: "#/components/schemas/WebhookEventType" } }
        - { name: correlation_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Inclusive. Filters `created_at`. }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: Exclusive. Filters `created_at`. }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEvent" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: The delivery queue and its history
      description: |
        `status` defaults to **`all`**, unlike a client-facing list: an operator arrives here
        from a health tile, and defaulting to `pending` would show a different set than the one
        they clicked.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: client_public_id, in: query, schema: { type: string, format: uuid } }
        - { name: endpoint_public_id, in: query, schema: { type: string, format: uuid } }
        - { name: event_type, in: query, schema: { $ref: "#/components/schemas/WebhookEventType" } }
        - name: status
          in: query
          schema: { type: string, enum: [pending, delivered, dead_lettered, all], default: all }
        - name: cross_service
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: |
            Deliveries bound for a sibling Lamido service, recognised by the
            `…/v1/hooks/{source_service}` URL shape. `true` is the drill-down behind the
            loudest health count this service has.
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/webhook-deliveries/{id}/redeliver:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: redeliverWebhookDelivery
      summary: Reset a delivery and start a fresh ladder
      description: |
        **Does not mint a new `event_id`**, so a receiver deduping on `X-Event-Id` correctly
        recognises a redelivery as the same event. Resets the existing row rather than
        inserting a second one — `unique(event_id, endpoint_id)` makes the alternative
        impossible at the table level.
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      responses:
        "200":
          description: The delivery, reset to pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/inbound-events:
    get:
      operationId: listInboundEvents
      summary: What another service told us, and what we did about it
      description: |
        The drill-down behind `refused_inbound_events` and `unroutable_inbound_events`.

        **Not one of WH-9's fourteen identical routes** — it is required by WH-26 and exists
        only in a service with an inbound surface, which today means only this one.

        `outcome` defaults to **`all`**: an operator arrives here from a count, and a
        filtering default would show a different set than the number they clicked. An
        unrecognised `reason_code` is a `400` rather than an empty page, because a filter
        that silently matches nothing reads exactly like "nothing is wrong".
      security: [{ AdminKey: [] }]
      tags: [Admin — webhooks]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: outcome
          in: query
          schema: { type: string, enum: [accepted, ignored, refused, failed, all], default: all }
        - name: reason_code
          in: query
          schema: { $ref: "#/components/schemas/InboundReasonCode" }
          description: |
            `outcome=refused` is the whole outcome; `unroutable` is
            `outcome=ignored&reason_code=unknown_account`. Filtering on `ignored` alone also
            counts every event type this service has no action for, which is most of them.
        - { name: event_type, in: query, schema: { type: string } }
        - { name: correlation_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A page of inbound events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InboundEvent" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /:
    get:
      operationId: getLandingPage
      summary: A static landing page for a human who typed the domain
      description: |
        HTML, no auth, no browser tripwire, `Cache-Control: public, max-age=3600`. Exists so
        the root of an API host does not answer a problem document to a browser, which reads
        as an outage. Scoped to `/` exactly; every other unknown path still returns the
        problem document, and a non-`GET` here is a `404`.

        **Not a health check** — the body is a compile-time constant served without touching
        the database, so it stays `200` through a total outage. `/healthz` is the liveness
        surface, and it touches nothing either; `GET /v1/admin/health` is the one that
        reports on the database.
      security: []
      tags: [Public]
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    ClientKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer isk_…` — the integrating application's key, one per tenant.
        36 characters: the `isk_` prefix plus 32 of base64url. Only its SHA-256 hash is
        stored. An unknown key, a revoked key and a deactivated client are deliberately
        indistinguishable.
    AdminKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer iad_…` — the back-office key, one per deployment. Carries
        scopes and an optional CIDR allowlist, and every mutation it makes is audited under
        its `label`.

  headers:
    XRequestId:
      description: |
        The request's correlation id — your `X-Request-Id` if it matched
        `^[A-Za-z0-9_-]{1,128}$`, otherwise a freshly minted UUIDv7. Present on every
        response, including `/healthz` and every error.
      schema: { type: string }
    RetryAfter:
      description: |
        Seconds to wait before retrying. Emitted on **every** 429 and on no other status,
        because it is derived in the problem serializer from the `retry_after` extension
        member — so the header and the body member can never disagree. Currently always 60.
      schema: { type: integer }

  parameters:
    XRequestIdIn:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Your own correlation id. Accepted and echoed verbatim if it matches
        `^[A-Za-z0-9_-]{1,128}$`; anything else is silently replaced with a UUIDv7.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }

    InvoicePublicId:
      name: public_id
      in: path
      required: true
      description: The invoice's UUIDv7 external id. A malformed value is a `400`.
      schema: { type: string, format: uuid }

    ClientPublicId:
      name: public_id
      in: path
      required: true
      description: The client's UUIDv7 external id.
      schema: { type: string, format: uuid }

    EndpointPublicId:
      name: public_id
      in: path
      required: true
      description: The webhook endpoint's UUIDv7 external id.
      schema: { type: string, format: uuid }

    AdminKeyId:
      name: id
      in: path
      required: true
      description: |
        The admin key's internal uuid. **Not validated** — a non-uuid reaches Postgres and
        surfaces as a `500`.
      schema: { type: string, format: uuid }

    ConfigIdPath:
      name: config_id
      in: path
      required: true
      description: |
        Must match `^[a-z0-9_]+$`, ≤64 chars, and start with the provider's prefix. The id
        is upper-cased to build env-var fallback names, so it must stay filename-safe.
      schema: { $ref: "#/components/schemas/ConfigId" }

    Limit:
      name: limit
      in: query
      description: Page size. Out of range is a `400`, never a clamp.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Cursor:
      name: cursor
      in: query
      description: |
        Opaque keyset cursor. Pass back a `next_cursor` **verbatim**; never construct or
        parse one. A malformed cursor is a `400` with
        `errors[0].pointer = "#/query/cursor"`, never a silent restart from page 1.
      schema: { type: string, minLength: 1 }

    From:
      name: from
      in: query
      description: "**Inclusive** lower bound on `created_at`. ISO date or date-time."
      schema: { type: string }

    Until:
      name: until
      in: query
      description: |
        **Exclusive** upper bound on `created_at`. ISO date or date-time. A whole month is
        `from=2026-07-01&until=2026-08-01`. `from > until` is a `400`.
      schema: { type: string }

  responses:
    Pdf:
      description: |
        The invoice PDF, re-fetched from the provider. `Content-Disposition` carries the
        provider's own filename — the invoice number for szamlazz, the document id for
        Billingo.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Content-Disposition:
          schema: { type: string }
          example: inline; filename="2026-0042.pdf"
      content:
        application/pdf:
          schema: { type: string, format: binary }

    ValidationError:
      description: |
        `type: urn:invoice-service:problem:validation` at 400. Carries `errors[]` for a
        schema failure, or a semantic `code` — or, for a credential-resolution failure on
        invoice creation, neither.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:invoice-service:problem:validation
            title: Bad Request
            status: 400
            detail: json must have required property 'items'
            instance: /v1/invoices
            request_id: 019839c2-7f3a-7a11-b0c1-4d2e6f8a9b01
            errors:
              - pointer: /items
                code: required
                detail: Required

    Unauthorized:
      description: |
        `type: urn:invoice-service:problem:unauthorized` at 401. A missing header, an empty
        token, an unknown key, a revoked key and a deactivated client are all the same
        answer.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Forbidden:
      description: |
        `type: urn:invoice-service:problem:forbidden` at 403. The browser tripwire, a
        missing scope, an IP outside the allowlist, a config id not allow-listed for the
        client, or an invalid download token.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    NotFound:
      description: |
        `type: urn:invoice-service:problem:not-found` at 404. Also returned when a resource
        belongs to another client, so ids cannot be probed for existence.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Conflict:
      description: |
        `type: urn:invoice-service:problem:conflict` at 409 — a duplicate or a concurrent
        write. The `code` extension member names the case.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    WrongState:
      description: |
        `type: urn:invoice-service:problem:conflict` at **422** — well-formed, but the
        resource's state forbids it. Deliberately not a 400: the state can change, so the
        identical request may succeed later.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    RateLimited:
      description: |
        `type: urn:invoice-service:problem:rate-limit` at 429 — the **failed-auth throttle**:
        more than 20 rejected credentials from this IP in the current 60-second window. A
        missing or malformed `Authorization` header is not counted; only a credential that
        was presented and rejected.

        Both `Retry-After` (header) and `retry_after` (body member) are set and always
        agree — the header is derived from the member. Retrying the same rejected credential
        just extends the window: fix the key first.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:invoice-service:problem:rate-limit
            title: Too Many Requests
            status: 429
            detail: Too many failed authentication attempts. Try again in 60 seconds.
            instance: /v1/invoices
            retry_after: 60

    ProviderThrottled:
      description: |
        `type: urn:invoice-service:problem:rate-limit` at 429 on an endpoint that makes an
        outbound call to szamlazz.hu or Billingo. The throttle rejects **before** that call,
        so nothing was contacted and nothing was written.

        Two different throttles can produce a 429 here and they are distinguished only by
        `detail`:

        - `Too many requests. Try again in 60 seconds.` — the provider throttle described
          below.
        - `Too many failed authentication attempts. Try again in 60 seconds.` — the
          failed-auth throttle, which precedes every authenticated route.

        Provider throttle buckets, all fixed 60-second windows:

        | Bucket | Scoped to | Limit | Shared by |
        |---|---|---|---|
        | `invoice_create` | the client | 60 | `createInvoice` |
        | `credential_test` | the client | 10 | `testClientIntegration` |
        | `invoice_pdf` | the **invoice** | 20 | `getInvoicePdf`, `getAnyInvoicePdf`, `getPublicInvoicePdf` |
        | `invoice_cancel` | the **invoice** | 5 | `cancelInvoice`, `cancelAnyInvoice` |

        The per-invoice buckets are keyed on the invoice, not the caller, so the client
        tier, the admin tier and the unauthenticated public download link all spend from one
        counter. An admin key confers no exemption on any of these: the limits protect the
        provider's API, which cannot tell our tiers apart.

        Ordering notes that decide what you actually see under a loop: on the PDF and cancel
        routes the 422 state guard runs **before** the throttle, so a wrong-state request
        never consumes a unit. On `createInvoice` the throttle runs **before** the
        idempotency key is reserved, so this 429 leaves the key free — the identical request
        with the same key is safe to resend after `retry_after`. The cost of that ordering is
        that an idempotent replay is counted too.

        Every throttle **fails open**: if the counter table is unreachable the request
        proceeds, including the provider call. Do not treat the absence of a 429 as proof
        the limit is enforced.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:invoice-service:problem:rate-limit
            title: Too Many Requests
            status: 429
            detail: Too many requests. Try again in 60 seconds.
            instance: /v1/invoices
            retry_after: 60

    InternalError:
      description: |
        `type: urn:invoice-service:problem:internal` at 500. The cause is never disclosed —
        a stack trace or a driver message in a response body is how connection strings leak.
        Quote `request_id` when reporting it.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    ProviderError:
      description: |
        `type: urn:invoice-service:problem:internal` at **502** — szamlazz.hu or Billingo
        refused or was unreachable. There is deliberately no `provider` problem type; the
        provider's own short, non-secret text rides in the `provider_error` extension
        member.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:invoice-service:problem:internal
            title: Bad Gateway
            status: 502
            detail: "szamlazz error 54: Az agent kulcs hibás"
            instance: /v1/invoices
            provider_error: "54"

  schemas:
    # ------------------------------------------------------------- primitives

    Provider:
      type: string
      enum: [szamlazz, billingo]

    InvoiceStatus:
      type: string
      enum: [pending, created, failed, canceled]
      description: |
        `pending` normally exists only for the second a provider call takes. `failed` is
        terminal for its idempotency key until the 7-day TTL expires. `canceled` is
        terminal. There is no "paid" state.

        Exactly three transitions are legal: pending -> created, pending -> failed,
        created -> canceled. A row is only born `pending`, so nothing moves into it;
        `failed` and `canceled` are both terminal, and a `failed` invoice can NEVER become
        `created` (admin reconcile `attach` requires `pending`). Every status change goes
        through one function that locks the row and validates the edge.

    Currency:
      type: string
      enum: [HUF, EUR, USD]
      description: |
        **HUF is zero-decimal in this API** — a deliberate estate-wide deviation from ISO
        4217, so `"1000"` HUF is 1000 Ft. EUR and USD have two minor digits.

    AmountMinor:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: |
        A monetary amount as a decimal string of canonical minor units: digits only, no
        sign, no decimal point, no exponent, no leading zero. **Never a JSON number** —
        JSON numbers lose precision above 2^53, which a yearly HUF total reaches.

        `"0"` and negatives are rejected on input. Output fields may still be `"0"` when a
        provider omitted the total.

    ConfigId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9_]+$"
      description: |
        Names one credential of one provider for one client (`billingo_acme`). Must start
        with `szamlazz_` or `billingo_`. Lower-case only — the id is upper-cased to build
        env-var fallback names, so it must stay filename-safe. The **field** was renamed in
        the snake_case cutover; the **values** were not.

    BoolFlag:
      type: string
      enum: ["true", "false"]
      description: Query-string boolean. Only these two literals; `1`/`yes` are a `400`.

    NextCursor:
      type: [string, "null"]
      description: |
        Opaque cursor for the next page, or `null` when there is none. **Always present**,
        including on unpaginated lists, so one pager terminates correctly everywhere.

    Range:
      type: object
      required: [from, until]
      properties:
        from: { type: [string, "null"], format: date-time }
        until: { type: [string, "null"], format: date-time }
      additionalProperties: false
      description: The window as echoed back, so a chart can label its own axis.

    # ------------------------------------------------------------ problem docs

    ProblemFieldError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: |
            RFC 6901 JSON Pointer into the request body (`/items/0/net_unit_price_minor`),
            or `#/query/<name>` / `#/param/<name>` for anything outside it.
        code:
          type: string
          description: |
            Branchable sub-case from the house set: `required`, `invalid_type`,
            `invalid_format`, `invalid_enum`, `unknown_field`, `invalid_union`, `too_small`,
            `too_big`, `invalid`. An unmapped validator code passes through as itself rather
            than collapsing, so a new one is visible instead of indistinguishable.
        detail:
          type: string
          description: A sentence about this one field.
      additionalProperties: false

    Problem:
      type: object
      required: [type, title, status, detail, instance]
      description: |
        RFC 9457 Problem Details, served as `application/problem+json`. The type set is
        closed and shared verbatim with payment-service and content-service.

        Note `conflict` covers both 409 and 422, and `internal` covers both 500 and 502 —
        the type set does not grow a member for a new status code.
      properties:
        type:
          type: string
          enum:
            - urn:invoice-service:problem:validation
            - urn:invoice-service:problem:unauthorized
            - urn:invoice-service:problem:forbidden
            - urn:invoice-service:problem:not-found
            - urn:invoice-service:problem:conflict
            - urn:invoice-service:problem:rate-limit
            - urn:invoice-service:problem:internal
        title:
          type: string
          description: |
            Summarises the **status code**, not the type — so a 422 whose type is `conflict`
            reads "Unprocessable Entity". Never branch on it.
          enum:
            - Bad Request
            - Unauthorized
            - Forbidden
            - Not Found
            - Conflict
            - Unprocessable Entity
            - Too Many Requests
            - Internal Server Error
            - Bad Gateway
        status: { type: integer }
        detail:
          type: string
          description: A human sentence. May change; never branch on it.
        instance:
          type: string
          description: |
            The request **path** — never a full URL and never with the query string, because
            the public download surface carries a signed token there.
        request_id:
          type: string
          description: Matches the `X-Request-Id` response header. Quote it in a support ticket.
        errors:
          type: array
          items: { $ref: "#/components/schemas/ProblemFieldError" }
          description: Present on a schema validation failure. Every failure is reported at once.
        code:
          type: string
          description: |
            The semantic sub-case, where a check no schema can express failed.
          enum:
            - idempotency_key_required
            - idempotency_key_reused
            - idempotency_key_in_flight
            - provider_config_mismatch
            - client_has_invoices
            - self_deactivation
            - self_revocation
            - not_downloadable
            - not_cancellable
            - not_reconcilable
            - invoice_state_changed
            - missing_path_param
        retry_after:
          type: integer
          description: |
            Seconds, on a 429 only. Currently always 60. Mirrored by the `Retry-After`
            response header, which is derived from this member, so the two always agree.
        provider_error:
          type: string
          description: |
            On a 502: a short, deliberately truncated, non-secret slice of what szamlazz or
            Billingo said. Truncation is a security measure — Billingo echoes the request in
            some error bodies, and that request carries an API key.
      additionalProperties: true

    # ---------------------------------------------------------------- invoices

    Invoice:
      type: object
      required:
        [public_id, provider, provider_config_id, status, invoice_number,
        provider_invoice_id, gross_amount_minor, currency, partner_ref, error_message,
        created_at, updated_at]
      properties:
        public_id:
          type: string
          format: uuid
          description: |
            UUIDv7. The only identity a consumer has — the internal primary key never
            appears. **Stable for the life of the row.** Reusing an idempotency key after
            its 7-day TTL creates a NEW invoice with its own public_id and leaves this one
            untouched.
        provider: { $ref: "#/components/schemas/Provider" }
        provider_config_id: { $ref: "#/components/schemas/ConfigId" }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        invoice_number:
          type: [string, "null"]
          description: "`2026/0042`, `E-KHF-2026-1`. `null` until `created`."
        provider_invoice_id:
          type: [string, "null"]
          description: |
            Billingo: the numeric document id as a string. szamlazz: the invoice number
            again — szamlazz has no separate id. `null` until `created`.
        gross_amount_minor:
          type: [string, "null"]
          description: |
            Canonical minor units as a decimal string. `null` unless `created`. May be
            `"0"` when Billingo omitted `gross_total` — that means "the provider did not
            tell us", not a free invoice.
        currency:
          oneOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
        partner_ref:
          type: [string, "null"]
          description: The caller's own non-identifying reference. The only buyer-side value stored.
        error_message:
          type: [string, "null"]
          description: Populated when `status` is `failed`; carries the provider's error text.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false

    CanceledInvoice:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            storno_number:
              type: string
              description: |
                **Returned here and nowhere else** — there is no column for it. Absent if
                the provider did not return one; the cancel still succeeded. Persist it, or
                recover it from `audit_log.metadata.storno_number`.

    AdminInvoice:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          required: [client_public_id, client_name, idempotency_key]
          properties:
            client_public_id:
              type: [string, "null"]
              format: uuid
              description: "`null` only if the client row was hard-deleted."
            client_name: { type: [string, "null"] }
            idempotency_key:
              type: [string, "null"]
              description: |
                The caller's `Idempotency-Key`, or `null` once the key has been released.
                A `null` here means the client reused this key after its 7-day TTL: this
                row was retired (keeping its public_id, number and status) and the new
                operation went to a new row. It does NOT mean the invoice is incomplete.

    CanceledAdminInvoice:
      allOf:
        - $ref: "#/components/schemas/AdminInvoice"
        - type: object
          properties:
            storno_number: { type: string }

    CreateInvoiceRequest:
      type: object
      required: [provider, provider_config_id, partner, items]
      description: |
        Unknown keys at the **top level** are silently stripped — these are settings, and a
        client library sending a field this deployment does not understand should keep
        working. Unknown keys inside `partner`, `partner.address`, `items[]` and `seller`
        are a **400**, because there a stripped value was the point of the request.
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        provider_config_id:
          allOf: [{ $ref: "#/components/schemas/ConfigId" }]
          description: Must start with `<provider>_` and be in the client's allow-list.
        partner: { $ref: "#/components/schemas/Partner" }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InvoiceItem" }
        seller: { $ref: "#/components/schemas/Seller" }
        payment_method:
          type: string
          default: átutalás
          description: |
            szamlazz receives this verbatim. Billingo needs its own enum, so `átutalás` /
            `transfer` / `wire_transfer` → `wire_transfer`, `készpénz` / `cash` → `cash`,
            `bankkártya` / `card` / `bankcard` → `bankcard` (case-insensitive). Anything
            else is passed through and will probably 502.
        currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          default: HUF
        language:
          type: string
          default: hu
          description: Free text, e.g. `hu`, `en`, `de`.
        issue_date:
          type: string
          format: date
          description: |
            `YYYY-MM-DD`, validated as a **real calendar date** — `2026-02-30` is a 400, not
            a 502 from the provider. Defaults to today (UTC).
        fulfillment_date:
          type: string
          format: date
          description: Defaults to `issue_date`.
        due_date:
          type: string
          format: date
          description: Defaults to **today + 8 days** — relative to today, not to `issue_date`.
        e_invoice:
          type: boolean
          default: true
        comment: { type: string }
        partner_ref:
          type: string
          description: |
            The only buyer-side value persisted. Use an order id — **never** a name, tax
            number or email; it is stored, searchable by any admin, and copied into the
            audit trail on `reconcile release`.
      additionalProperties: true

    Partner:
      type: object
      required: [name, address]
      additionalProperties: false
      description: "**Strict** — an unknown key is a 400, one `errors[]` entry per key."
      properties:
        name: { type: string, minLength: 1 }
        tax_number:
          type: string
          description: |
            Hungarian format `12345678-2-42`. Not required by this service, but **always
            send it for a company buyer**: without it two Billingo buyers with the same name
            collapse onto one partner record.
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }

    Address:
      type: object
      required: [postal_code, city, address]
      additionalProperties: false
      description: "**Strict.**"
      properties:
        postal_code: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        address:
          type: string
          minLength: 1
          description: Street and number, one line.
        country:
          type: string
          default: Magyarország
          description: |
            **Accepted and then ignored.** Both adapters hardcode Hungary — Billingo sends
            `country_code: "HU"`, szamlazz sends no country at all. Foreign addresses are
            not supported through this API.

    InvoiceItem:
      type: object
      required: [name, quantity, net_unit_price_minor, vat_rate]
      additionalProperties: false
      description: |
        **Strict, and this is the single most valuable strictness on the service.** A typo'd
        optional field like `vat_rate` used to be silently dropped, falling back to a
        default and issuing a legal document with the wrong VAT — returned as `201 Created`.
      properties:
        name: { type: string, minLength: 1 }
        quantity:
          type: number
          exclusiveMinimum: 0
          description: A JSON number — it is a count, not money. Fractions allowed.
        unit:
          type: string
          minLength: 1
          default: db
          description: Free text — `db`, `óra`, `hó`.
        net_unit_price_minor:
          allOf: [{ $ref: "#/components/schemas/AmountMinor" }]
          description: "**Net**, per unit, in minor units. Zero and negatives are rejected."
        vat_rate:
          type: string
          minLength: 1
          description: |
            A percentage as a string (`"27"`, `"5"`, `"0"`) **or** a code (`"AAM"`, `"TAM"`,
            `"EU"`). For szamlazz a non-numeric code computes line VAT as 0; for Billingo a
            numeric value becomes `"27%"`. `"27%"` sent by you is forwarded verbatim and
            rejected as a 502.
        comment: { type: string }

    Seller:
      type: object
      additionalProperties: false
      description: "**Strict.** szamlazz only — Billingo ignores it and uses its configured bank account."
      properties:
        bank_name: { type: string }
        bank_account: { type: string }

    DownloadLink:
      type: object
      required: [url, expires_at]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: |
            A public, tokenized URL built from the request's own origin. The token is a
            stateless HMAC bound to this one invoice. **No per-link revoke exists** — treat
            it as a bearer capability.
        expires_at:
          type: string
          format: date-time
          description: Exactly 7 days out. Not configurable.

    ReleasedAck:
      type: object
      required: [public_id, released, idempotency_key]
      additionalProperties: false
      properties:
        public_id: { type: string, format: uuid }
        released: { type: boolean, enum: [true] }
        idempotency_key:
          type: string
          description: Now free — the client may retry with this exact key.

    ReconcileRequest:
      oneOf:
        - $ref: "#/components/schemas/ReconcileMarkFailed"
        - $ref: "#/components/schemas/ReconcileAttach"
        - $ref: "#/components/schemas/ReconcileRelease"
      discriminator:
        propertyName: action
        mapping:
          mark_failed: "#/components/schemas/ReconcileMarkFailed"
          attach: "#/components/schemas/ReconcileAttach"
          release: "#/components/schemas/ReconcileRelease"

    ReconcileMarkFailed:
      type: object
      required: [action, reason]
      additionalProperties: false
      description: Use when **no** invoice was created at the provider. The safe default.
      properties:
        action: { type: string, enum: [mark_failed] }
        reason: { type: string, minLength: 1, maxLength: 500 }

    ReconcileAttach:
      type: object
      required: [action, reason, provider_invoice_id, invoice_number]
      additionalProperties: false
      description: Use when the invoice **was** created. Links it so PDF and cancel work.
      properties:
        action: { type: string, enum: [attach] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        provider_invoice_id: { type: string, minLength: 1, maxLength: 200 }
        invoice_number: { type: string, minLength: 1, maxLength: 200 }
        gross_amount_minor: { $ref: "#/components/schemas/AmountMinor" }
        currency:
          type: string
          minLength: 1
          maxLength: 10
          description: |
            **Not the three-value enum here** — any 1–10 character string is accepted and
            written straight to the column. Type it correctly by hand.

    ReconcileRelease:
      type: object
      required: [action, reason]
      additionalProperties: false
      description: |
        **The only destructive action in the API.** Deletes the row, freeing
        `(client_id, idempotency_key)` so the client can retry with the same key. The full
        row is snapshotted into the audit trail first. Prefer `mark_failed` if in doubt.
      properties:
        action: { type: string, enum: [release] }
        reason: { type: string, minLength: 1, maxLength: 500 }

    # ----------------------------------------------------------------- clients

    Client:
      type: object
      required:
        [public_id, name, notes, external_ref, allowed_provider_configs, active,
        created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: [string, "null"] }
        external_ref:
          type: [string, "null"]
          description: This client's id in the calling system. Indexed and searchable.
        allowed_provider_configs:
          type: array
          items: { $ref: "#/components/schemas/ConfigId" }
          description: |
            The gate checked on every invoice creation. Maintained automatically by the
            integration endpoints — hand-editing it desynchronises it from the credentials.
        active:
          type: boolean
          description: "`false` → every call with this client's key returns 401."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false

    ClientWithCounts:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [invoice_count, credential_count, last_invoice_at]
          properties:
            invoice_count:
              type: integer
              description: All time — ignores any filter on the request.
            credential_count:
              type: integer
              description: "**Active** credentials only."
            last_invoice_at: { type: [string, "null"], format: date-time }

    ClientDetail:
      allOf:
        - $ref: "#/components/schemas/ClientWithCounts"
        - type: object
          required: [integrations]
          properties:
            integrations:
              type: array
              items: { $ref: "#/components/schemas/Credential" }
              description: Every credential, active and inactive, sorted by `config_id`.

    ClientWithSecret:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: |
                The client's plaintext `isk_…` key. **Returned once**, on create and on
                rotate-key, and never again — only its SHA-256 hash is stored. Hand it over
                out of band.

    CreateClientRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_ref: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
      additionalProperties: true

    UpdateClientRequest:
      type: object
      minProperties: 1
      description: At least one field, else a 400 ("No fields to update").
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_ref:
          type: [string, "null"]
          maxLength: 200
          description: "`null` clears it."
        notes:
          type: [string, "null"]
          maxLength: 2000
          description: "`null` clears it."
        active: { type: boolean }
        allowed_provider_configs:
          type: array
          items: { $ref: "#/components/schemas/ConfigId" }
          description: |
            **Escape hatch only** — replaces the array wholesale. Setting it directly can
            leave a credential that exists but is not allowed (invoicing 403s) or a config
            id allowed with no credential (invoicing 500s).
      additionalProperties: true

    DeletedAck:
      type: object
      required: [public_id, deleted]
      additionalProperties: false
      properties:
        public_id: { type: string, format: uuid }
        deleted: { type: boolean, enum: [true] }

    # ------------------------------------------------------------- credentials

    Credential:
      type: object
      required:
        [id, provider, config_id, label, config, secret_last4, secret_fingerprint,
        allowed, last_tested_at, last_test_status, last_test_error, active,
        created_at, updated_at]
      description: |
        **There is no `secret` field and never will be.** Reads expose only two
        non-reversible hints.
      properties:
        id:
          type: string
          format: uuid
          description: |
            The credential row's internal uuid. Credentials have no external identity, so
            this is what the audit trail addresses them by.
        provider: { $ref: "#/components/schemas/Provider" }
        config_id: { $ref: "#/components/schemas/ConfigId" }
        label: { type: [string, "null"] }
        config:
          type: object
          additionalProperties: { type: number }
          description: |
            Non-secret provider config, **camelCase keys** (`blockId`, `bankAccountId`)
            because those are the literal stored keys sent to Billingo. `{}` for szamlazz.
        secret_last4:
          type: [string, "null"]
          description: Last 4 characters of the plaintext. Display hint only.
        secret_fingerprint:
          type: [string, "null"]
          description: |
            First 8 hex chars of SHA-256 of the secret. Compare across rotations to prove a
            new key landed. Non-reversible.
        allowed:
          type: boolean
          description: |
            Whether `config_id` is in the client's `allowed_provider_configs`.
            **`false` means invoicing with this config returns 403**, even though the
            credential exists.
        last_tested_at: { type: [string, "null"], format: date-time }
        last_test_status:
          type: [string, "null"]
          enum: [ok, failed, null]
          description: "`null` = never tested. Reset to `null` whenever the secret is rotated."
        last_test_error:
          type: [string, "null"]
          description: Failure reason, truncated to 500 characters.
        active:
          type: boolean
          description: "`false` = soft-deleted; the ciphertext is retained."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false

    CredentialWithClient:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [client_public_id, client_name]
          properties:
            client_public_id: { type: [string, "null"], format: uuid }
            client_name: { type: [string, "null"] }

    UpsertIntegrationRequest:
      type: object
      required: [provider]
      description: Unknown keys are stripped — this is configuration, not payload.
      properties:
        provider:
          allOf: [{ $ref: "#/components/schemas/Provider" }]
          description: Must match the `config_id` prefix.
        secret:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            **Required on create, optional on update.** Omit it to edit the label or config
            without re-typing the provider key; supply it to rotate. Supplying it clears the
            last-test result.
        config:
          type: object
          additionalProperties: { type: number }
          default: {}
          description: |
            Provider-specific and replaced **wholesale**, not merged. Billingo requires
            numeric `blockId` and `bankAccountId`; szamlazz requires nothing. String values
            are coerced to numbers.
        label: { type: string, minLength: 1, maxLength: 200 }
        active:
          type: boolean
          description: |
            **Omit on update and the integration is reactivated** (`active: true`) — the
            intended "re-enable this" gesture.
      additionalProperties: true

    CredentialTestResult:
      type: object
      required: [ok, credential]
      description: |
        **HTTP is 200 whether the test passed or failed.** Branch on `ok`, never on the
        status code. An unreachable provider also yields `ok: false` — check `message`.
      properties:
        ok: { type: boolean }
        message:
          type: string
          description: Omitted when the provider supplied none — not `null`.
        details:
          type: object
          additionalProperties: true
          description: |
            Provider-specific, hence camelCase keys. Billingo:
            `availableBlockIds`, `availableBankAccountIds`. szamlazz: `code`, `probeError`.
            Omitted when there is nothing to report.
        credential:
          allOf: [{ $ref: "#/components/schemas/Credential" }]
          description: The credential with its `last_test_*` fields already updated.
      additionalProperties: false

    ProviderDescriptor:
      type: object
      required: [name, label, configIdPrefix, secret, configFields, envFallback, testDescription]
      description: |
        The credential-form contract. **The only camelCase payload on this service** — see
        the operation description for why.
      properties:
        name: { $ref: "#/components/schemas/Provider" }
        label: { type: string }
        configIdPrefix:
          type: string
          description: A config id for this provider must start with this.
        secret:
          type: object
          required: [label, help]
          properties:
            label: { type: string }
            help: { type: string }
          additionalProperties: false
          description: How to label and explain the single write-only secret field.
        configFields:
          type: array
          items:
            type: object
            required: [key, label, type, required]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [number] }
              required: { type: boolean }
              help: { type: string }
            additionalProperties: false
        envFallback:
          type: array
          items: { type: string }
          description: |
            Env var names used when no DB credential row exists. `<CONFIGID>` is the
            upper-cased config id: `billingo_acme` → `BILLINGO_ACME_API_KEY`.
        testDescription:
          type: string
          description: What `POST …/test` actually checks for this provider.
      additionalProperties: false

    # ------------------------------------------------------------- admin keys

    AdminScope:
      type: string
      enum:
        - clients:read
        - clients:write
        - credentials:read
        - credentials:write
        - invoices:read
        - invoices:write
        - stats:read
        - audit:read
        - admin:manage
        - "*"

    AdminKey:
      type: object
      required: [id, label, scopes, allowed_ips, active, last_used_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Internal uuid — an admin key has no external identity.
        label:
          type: string
          description: The audit identity. Recorded on every entry this key writes.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/AdminScope" }
        allowed_ips:
          type: array
          items: { type: string }
          description: |
            CIDR allowlist. **Empty means unrestricted** — the default, because Vercel
            egress IPs rotate. If a key has an allowlist and the caller's IP cannot be
            determined, the request is denied.
        active: { type: boolean }
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Refreshed at most once every 5 minutes, so it is coarse.
        created_at: { type: string, format: date-time }
      additionalProperties: false

    AdminKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/AdminKey"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: |
                The plaintext `iad_…` key. **Returned once** and never stored, logged, or
                written to the audit trail.

    CreateAdminKeyRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AdminScope" }
          default: ["*"]
        allowed_ips:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
          default: []
      additionalProperties: true

    UpdateAdminKeyRequest:
      type: object
      minProperties: 1
      description: At least one field, else a 400 ("No fields to update").
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AdminScope" }
        allowed_ips:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        active: { type: boolean }
      additionalProperties: true

    # ------------------------------------------------------------------ health

    Healthz:
      type: object
      required: [status]
      additionalProperties: false
      description: |
        Liveness only. Since `f73e397` this endpoint touches no dependency, so the body has
        exactly one member and one value. The `db` and `code` members it used to carry when
        the database was unreachable no longer exist.
      properties:
        status: { type: string, enum: [ok] }

    AdminHealth:
      type: object
      required: [status, encryption_key_configured, download_link_secret_configured]
      additionalProperties: true
      description: |
        **Always returned with HTTP 200.** Every count is absent in the degraded body.
      properties:
        status:
          type: string
          enum: [ok, attention, degraded]
          description: |
            `attention` when any **actionable** count is above zero. Two are deliberately
            excluded: `unroutable_inbound_events` and `clients_without_external_ref`, both of
            which describe a correct configuration. A strip that says `attention` every day
            for something nobody should act on is a strip nobody reads.
        encryption_key_configured: { type: boolean }
        download_link_secret_configured:
          type: boolean
          description: |
            The service refuses to boot without it, so this reads `true` on any running
            instance.
        database: { type: string, enum: [ok, unreachable] }
        stuck_invoices:
          type: integer
          description: "Pending for more than 15 minutes. Drill down: `GET /v1/admin/invoices/stuck`."
        failing_credentials:
          type: integer
          description: |
            Active credentials whose last test **failed**. Counts only `failed` — see
            `untested_credentials`. Drill down:
            `GET /v1/admin/integrations?active=true&last_test_status=failed`.
        untested_credentials:
          type: integer
          description: |
            Active credentials with `last_test_status: null` — never tested, or tested
            before the last secret rotation. Counted separately because a failing credential
            needs fixing while an untested one needs testing. Drill down:
            `GET /v1/admin/integrations?active=true&last_test_status=untested`.
        disabled_webhook_endpoints:
          type: integer
          description: |
            Switched off by an operator or by twenty consecutive dead-letters. Drill down:
            `GET /v1/admin/webhook-endpoints?enabled=false`.
        dead_lettered_deliveries:
          type: integer
          description: |
            Exhausted the ladder. A client was not told about a document. Drill down:
            `GET /v1/admin/webhook-deliveries?status=dead_lettered`.
        dead_lettered_deliveries_cross_service:
          type: integer
          description: |
            **The loudest number this service has.** An event bound for a sibling service
            that never arrived: the invoice exists, its client believes it was sent, and the
            receiver never heard. Drill down:
            `GET /v1/admin/webhook-deliveries?status=dead_lettered&cross_service=true`.
        overdue_webhook_deliveries:
          type: integer
          description: |
            Due and not yet attempted. On a service with **no cron** this is what says the
            queue has stopped moving; the remedy is `pnpm db:webhooks-drain`. Drill down:
            `GET /v1/admin/webhook-deliveries?status=pending`.
        clients_without_external_ref:
          type: integer
          description: |
            Clients not paired with an account. They cannot participate cross-service at all
            — their events carry `account_id: null` and a receiver refuses rather than
            guesses. **Does not move `status`**: it is the ordinary state of a
            half-provisioned account.
        refused_inbound_events:
          type: integer
          description: |
            **A payment succeeded and no invoice was issued.** An inbound event this service
            could have acted on and deliberately did not — unpaired account, hop cap, chain
            replay, or an unresolvable provider config. Every reason ends the same way for
            the customer, so this is the whole outcome rather than a subset. **Moves
            `status`.** Drill down: `GET /v1/admin/inbound-events?outcome=refused`.
        unroutable_inbound_events:
          type: integer
          description: |
            An inbound event whose `account_id` maps to no client here. Usually correct — a
            customer with payments and no invoicing — so it does **not** move `status`.

            Narrower than `outcome=ignored`, deliberately: an `ignored` row is also written
            for every event type this service has no action for, which is most of them and
            permanent. Drill down:
            `GET /v1/admin/inbound-events?outcome=ignored&reason_code=unknown_account`.

    # ------------------------------------------------------------------- stats

    StatsOverview:
      type: object
      required: [range, clients, invoices, gross]
      additionalProperties: false
      properties:
        range: { $ref: "#/components/schemas/Range" }
        clients:
          type: object
          required: [total, active]
          additionalProperties: false
          description: All-time; **ignores `from`/`until`**.
          properties:
            total: { type: integer }
            active: { type: integer }
        invoices:
          type: object
          required: [total, by_status, by_provider, failure_rate, last_24h]
          additionalProperties: false
          properties:
            total: { type: integer }
            by_status:
              type: object
              additionalProperties: { type: integer }
              description: "**Omits keys with zero rows** — do not assume all four statuses."
            by_provider:
              type: object
              additionalProperties: { type: integer }
              description: Omits keys with zero rows.
            failure_rate:
              type: number
              description: "`failed / total`, 4 decimals. `0` when there are no invoices."
            last_24h:
              type: integer
              description: Rolling 24 hours; **ignores `from`/`until`**.
        gross:
          type: array
          description: |
            **Only `created` invoices**, grouped by currency and never summed across it. A
            `null` currency can appear as its own group for rows whose provider call never
            completed.
          items:
            type: object
            required: [currency, invoice_count, gross_amount_minor]
            additionalProperties: false
            properties:
              currency: { type: [string, "null"] }
              invoice_count: { type: integer }
              gross_amount_minor:
                type: string
                description: |
                  A decimal string forwarded straight from Postgres' `sum()` over a bigint
                  column. Passing it through `Number()` is how a yearly HUF total loses
                  precision past 2^53.

    ClientStats:
      type: object
      required: [client_public_id, client_name, active, invoices, gross_amount_minor, last_invoice_at]
      additionalProperties: false
      properties:
        client_public_id: { type: string, format: uuid }
        client_name: { type: string }
        active: { type: boolean }
        invoices:
          type: object
          required: [total, created, failed, pending, canceled]
          additionalProperties: false
          properties:
            total: { type: integer }
            created: { type: integer }
            failed: { type: integer }
            pending: { type: integer }
            canceled: { type: integer }
        gross_amount_minor:
          type: string
          description: |
            `created` invoices only, but **summed across every currency
            indiscriminately** — meaningless for a multi-currency tenant. Use
            `stats/overview.gross` in that case. `"0"` when there is nothing to sum.
        last_invoice_at: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------------- audit

    AuditActorType:
      type: string
      enum: [admin_key, client_key, system]
      description: |
        `client_key` marks a mutation made through the client tier — today only
        `invoice.cancel`. `system` is reserved; nothing emits it.

    AuditTargetType:
      type: string
      enum: [client, credential, invoice, admin_key]

    AuditEntry:
      type: object
      required:
        [id, actor_type, actor_id, actor_label, action, target_type, target_id,
        metadata, ip, request_id, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        actor_type: { $ref: "#/components/schemas/AuditActorType" }
        actor_id:
          type: [string, "null"]
          format: uuid
          description: |
            An `admin_keys.id` or a `clients.id` (the **internal** id), per `actor_type`.
            Deliberately without a foreign key so history outlives the row it points at.
        actor_label:
          type: string
          description: Denormalised, so the trail stays readable after a key is deleted.
        action:
          type: string
          description: |
            `client.create` · `client.update` · `client.rotate_key` · `client.deactivate` ·
            `client.delete` · `credential.create` · `credential.update` · `credential.test` ·
            `credential.deactivate` · `invoice.cancel` · `invoice.reconcile.mark_failed` ·
            `invoice.reconcile.attach` · `invoice.reconcile.release` · `admin_key.create` ·
            `admin_key.update` · `admin_key.revoke`
        target_type: { $ref: "#/components/schemas/AuditTargetType" }
        target_id: { type: [string, "null"] }
        metadata:
          type: object
          additionalProperties: true
          description: |
            An **allow-listed summary per action** — never a raw request body, so a
            plaintext provider secret can never land here. Shapes are tabulated in
            admin-api.md. Note a client-tier `invoice.cancel` has no `reason`.
        ip: { type: [string, "null"] }
        request_id:
          type: [string, "null"]
          description: |
            The `X-Request-Id` of the causing request — the join key to the log lines around
            it. Nullable because history predates the column.
        created_at: { type: string, format: date-time }

    WebhookEventType:
      type: string
      enum: [invoice.created, invoice.failed, invoice.canceled]
      description: |
        The closed catalogue. Additive only: a new member needs no version bump, on the one
        condition the receiver contract states — an unrecognised type is ignored and answered
        2xx. `pending` has no event: a row is born pending and the 201 already carries it.

    WebhookEventTypeDescriptor:
      type: object
      description: One catalogue entry, as `GET /v1/admin/event-types` serves it.
      required: [event_type, resource, fires_when, target_status, contract_version, sensitive_blocks, cross_service]
      properties:
        event_type: { $ref: "#/components/schemas/WebhookEventType" }
        resource: { type: string, enum: [invoice] }
        fires_when: { type: string, description: One sentence, present tense, for a trigger picker. }
        target_status:
          type: string
          description: |
            The status the invoice reaches. **Asserted against the payload**: the participle
            names this value and `data.invoice.status` equals it.
        contract_version: { type: integer }
        sensitive_blocks:
          type: array
          items: { type: string }
          description: |
            Blocks behind an `include_*` flag. **Always empty in this service** — it stores no
            personal data, so there is nothing to gate.
        cross_service:
          type: boolean
          description: Whether a sibling Lamido service acts on it.

    WebhookEndpoint:
      type: object
      description: |
        A destination. The member set is identical across every service of the estate, because
        lamido-admin drives all of them from one component.
      required:
        - public_id
        - client_public_id
        - url
        - description
        - contract_version
        - subscribed_events
        - enabled
        - disabled_reason
        - consecutive_failures
        - secret_last4
        - secret_fingerprint
        - created_at
        - updated_at
      properties:
        public_id: { type: string, format: uuid }
        client_public_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        description: { type: [string, 'null'] }
        contract_version: { type: integer, description: Pinned at creation. Not patchable. }
        subscribed_events:
          oneOf:
            - type: array
              items: { $ref: "#/components/schemas/WebhookEventType" }
            - type: 'null'
          description: '`null` means every type, including ones added later. Never an empty array.'
        enabled: { type: boolean }
        disabled_reason:
          type: [string, 'null']
          description: Non-null **only** when `enabled` is false.
        consecutive_failures:
          type: integer
          description: Dead-letters in a row. Any 2xx clears it; **20 auto-disables the endpoint**.
        secret_last4:
          type: [string, 'null']
          description: |
            Never the secret. **`null` means this endpoint has none and cannot deliver** until
            one is rotated in.
        secret_fingerprint: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookEvent:
      type: object
      description: One row of the outbox — a fact, written inside the transaction that made it true.
      required: [event_id, client_public_id, event_type, account_id, correlation_id, causation_id, hop, payload, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: UUIDv7. Equals `X-Event-Id`, and is the receiver's dedupe key.
        client_public_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/WebhookEventType" }
        account_id:
          type: [string, 'null']
          description: |
            The lamido-admin account id. **Null for a client the operator has not paired** —
            such an event cannot be routed cross-service at all.
        correlation_id:
          type: string
          format: uuid
          description: Stable across a whole causal chain. Equals `event_id` on a natively produced event.
        causation_id: { type: [string, 'null'], format: uuid }
        hop:
          type: integer
          description: '`0` natively, `1` when a payment caused it. This is the only service in the estate that emits at a non-zero hop.'
        payload:
          type: object
          description: The frozen body, as it was at emission. Never rebuilt from the row afterwards.
        created_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      description: One attempt-state row, per event per endpoint.
      required: [delivery_id, event_id, event_type, status, attempt, next_attempt_at, created_at, updated_at]
      properties:
        delivery_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/WebhookEventType" }
        status: { type: string, enum: [pending, delivered, dead_lettered] }
        attempt:
          type: integer
          description: The attempt **currently pending**, not the number already made.
        next_attempt_at:
          type: string
          format: date-time
          description: |
            **A floor, not a promise.** This service runs no cron: an attempt happens when a
            post-commit burst, an opportunistic drain, or `pnpm db:webhooks-drain` reaches it.
        response_status: { type: [integer, 'null'] }
        response_body_excerpt:
          type: [string, 'null']
          description: At most 500 bytes. A diagnostic for an operator — **never parsed, never acted on**.
        error: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InboundReasonCode:
      type: string
      description: |
        Why an inbound event was not acted on, as a closed vocabulary. `reason` beside it is
        the free-text sentence a human reads; this is the half a count can group by.

        `unknown_account` is the one `unroutable_inbound_events` counts.
        `no_action_for_event_type` is the permanent majority — written for every emitter
        event type this service has no action for — which is why the tile is narrowed by
        code rather than counting the whole `ignored` outcome.
      enum:
        - no_action_for_event_type
        - unknown_account
        - client_deactivated
        - no_invoice_details
        - unpaired_account
        - hop_cap
        - chain_replay
        - no_provider_config
        - ambiguous_provider_config
        - invoice_details_invalid
        - action_error
        - reservation_conflict

    InboundEvent:
      type: object
      description: |
        One verified event another service delivered here. A row exists for **every event
        that verifies**, including the ones nothing was done about — that is what makes "a
        payment succeeded and no invoice exists" a query rather than archaeology across two
        services' logs. An event whose signature does not verify is never stored.
      required:
        [event_id, source_service, event_type, correlation_id, hop, outcome, payload, received_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: The emitter's id, stable across every retry.
        source_service: { type: string, example: payment-service }
        event_type: { type: string, example: payment.succeeded }
        account_id: { type: [string, 'null'] }
        client_public_id:
          type: [string, 'null']
          format: uuid
          description: '**Null on an unroutable event by definition** — the account maps to no client here.'
        correlation_id: { type: string, format: uuid }
        causation_id: { type: [string, 'null'], format: uuid }
        hop: { type: integer }
        action:
          type: [string, 'null']
          enum: [invoice.issue, null]
          description: Null on any row we did not act on, which keeps it out of the loop-breaker index.
        outcome: { type: string, enum: [accepted, ignored, refused, failed] }
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/InboundReasonCode"
            - type: 'null'
          description: Null only on `accepted`.
        reason:
          type: [string, 'null']
          description: The sentence. Read during an incident; not something to branch on.
        invoice_public_id:
          type: [string, 'null']
          format: uuid
          description: '**Null on a refused event** — that is the point of the row.'
        payload:
          type: object
          additionalProperties: true
          description: The verified body as it arrived, never re-derived.
        request_id: { type: [string, 'null'] }
        received_at: { type: string, format: date-time }
        processed_at: { type: [string, 'null'], format: date-time }
