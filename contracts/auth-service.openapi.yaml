    post:
      tags:
        - "browser"
      summary: "Exchange a customer login request for a session cookie"
      description: |
        Answers 204 with NO BODY. The session is the Set-Cookie header and nothing else:
        no customer id and no website id are returned. A backend must read the token out of
        the header and then call POST /v1/customer-sessions/verify to learn who signed in.
        The platform equivalent at /v1/public/auth/magic-link/exchange answers 200 with a
        body, which is the asymmetry that crashed the T-24 smoke runner on 2026-08-27.
      security:
        - websiteKey: []
      responses:
        "204":
          description: "Signed in. No body; the session is in Set-Cookie."
          headers:
            "Set-Cookie":
              description: |
                __Host-lamido_customer_session=<token>; Path=/; HttpOnly; Secure;
                SameSite=Lax; Max-Age=<the website's session lifetime>
              schema:
                type: "string"
