# Generated from the service's own route table at 905fbea — 125 operations across 93 paths.
# Behaviour lives in the Markdown beside this file; this is the shape.
#
# The ERROR RESPONSES are derived, per operation, from the service at b8e9c6a on 2026-08-27:
# `agent-skills/kb-sync/scripts/derive-route-facts.mjs` reads every status reachable from a
# route — its handler, the helpers that handler calls, and each middleware on its chain — and
# `apply-route-facts.mjs` writes them here. They replaced a boilerplate 400/401/403/404/429 that
# every one of the 125 operations carried: a 422 on none of them against nine 422 codes, a 409 on
# four against nineteen, and a 404 on 50 routes that cannot answer one.
#
# The `code` under each status is the branchable member of the problem document. kb-sync check 22
# diffs those against conventions.md's own table, so the two files cannot drift apart in silence.
#
# The 41 QUERY PARAMETER declarations are no longer hand-carried: the same scan finds the names,
# and the warning that used to stand here — "regenerating this file WILL DELETE all 41 of them" —
# is discharged. Their descriptions, enums and defaults are still read from the source by hand,
# per the sweep checklist's §2.1; only the names are derived.
#
# STILL A GAP, and a real one: response SCHEMAS are `{}` on most operations, and 51 write
# operations declare 2 request bodies. Do not generate a write client from this file.
openapi: 3.1.0
info:
  title: "auth-service"
  version: "1.0.0"
  description: "Identity, authorization and entitlements for the Lamido estate. Behaviour, gotchas and the rules that prevent incidents are in the Markdown beside this file — README.md first, then conventions.md. This spec is the shape; the Markdown is the meaning."
servers:
  # The deployment host is deliberately absent from this pinned copy. No host ships in
  # a tarball, and contracts/ is one `files` mistake away from being published — see
  # docs/plans/phase-1-foundations.md §4. The consuming project supplies the base URL
  # from its own environment; the SDK has no fallback.
  - url: "{baseUrl}"
    description: Supplied by the consuming project from its own environment.
    variables:
      baseUrl:
        default: https://auth.example.com
        description: Documentation placeholder, not a usable default.
security:
  - applicationKey: []
components:
  securitySchemes:
    adminKey:
      type: "http"
      scheme: "bearer"
      description: "aad_ operator key"
    applicationKey:
      type: "http"
      scheme: "bearer"
      description: "ask_ secret application key"
    websiteKey:
      type: "http"
      scheme: "bearer"
      description: "apk_ publishable website key"
    cronBearer:
      type: "http"
      scheme: "bearer"
      description: "CRON_SECRET"
    sessionToken:
      type: "apiKey"
      in: "header"
      name: "X-Session-Token"
      description: "A person's session"
  parameters:
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Page size, 1-200. Default 50. Out of range is a 400, never a clamp."
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "Opaque keyset cursor. Pass a next_cursor back verbatim; malformed is a 400, never a restart from page one."
      schema:
        type: "string"
  responses:
    Problem:
      description: "RFC 9457 problem document"
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "request_id"
      properties:
        type:
          type: "string"
          description: "urn:auth-service:problem:<slug>, a closed set. Branch on this."
        title:
          type: "string"
          description: "From a status map. Never branch on it."
        status:
          type: "integer"
        detail:
          type: "string"
          description: "Prose. Will be reworded. Never branch on it."
        instance:
          type: "string"
        request_id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
          description: "The branchable sub-reason, where one applies."
        errors:
          type: "array"
          items:
            type: "object"
            properties:
              pointer:
                type: "string"
              code:
                type: "string"
              detail:
                type: "string"
    Collection:
      type: "object"
      required:
        - "data"
        - "next_cursor"
      description: "Every collection. There is no total, service-wide."
      properties:
        data:
          type: "array"
          items: {}
        next_cursor:
          type:
            - "string"
            - "null"
    AuthorizeDecision:
      type: "object"
      required:
        - "decision"
      properties:
        decision:
          type: "string"
          enum:
            - "allow"
            - "deny"
          description: "The one enum in this API that cannot grow. Hard-code both values."
    Subscription:
      type: "object"
      properties:
        public_id:
          type: "string"
          format: "uuid"
        organization:
          type: "string"
          format: "uuid"
        website:
          type:
            - "string"
            - "null"
          format: "uuid"
        plan:
          type: "string"
        status:
          type: "string"
          enum:
            - "active"
            - "past_due"
            - "canceled"
            - "expired"
        period_start:
          type: "string"
          format: "date-time"
        period_end:
          type: "string"
          format: "date-time"
          description: "Exclusive."
        past_due_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    WebhookEndpoint:
      type: "object"
      properties:
        public_id:
          type: "string"
          format: "uuid"
        organization:
          type: "string"
          format: "uuid"
        url:
          type: "string"
          format: "uri"
        description:
          type:
            - "string"
            - "null"
        subscribed_events:
          type:
            - "array"
            - "null"
          items:
            type: "string"
          description: "null means every type. [] is a 400."
        contract_version:
          type: "integer"
        enabled:
          type: "boolean"
        disabled_reason:
          type:
            - "string"
            - "null"
        consecutive_failures:
          type: "integer"
        secret_last4:
          type: "string"
        secret_fingerprint:
          type: "string"
    CustomerSessionVerdict:
      type: "object"
      required:
        - "valid"
        - "customer"
        - "expires_at"
      description: "An invalid session is 200 with valid:false, not a 401."
      properties:
        valid:
          type: "boolean"
        customer:
          type:
            - "object"
            - "null"
        expires_at:
          type:
            - "string"
            - "null"
          format: "date-time"
